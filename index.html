/* soft edges instead of a hard cut, so no seam shows while they slide in */
.sp-bear{-webkit-mask-image:linear-gradient(90deg,#000 44%,transparent 53%); mask-image:linear-gradient(90deg,#000 44%,transparent 53%); transform-origin:0% 55%;
  animation:bearIn 1.2s cubic-bezier(.2,.8,.2,1) both, bearBreathe 3.2s ease-in-out 1.2s infinite alternate}
.sp-bull{-webkit-mask-image:linear-gradient(270deg,#000 44%,transparent 53%); mask-image:linear-gradient(270deg,#000 44%,transparent 53%); transform-origin:100% 60%;
  animation:bullIn 1.2s cubic-bezier(.2,.8,.2,1) .12s both, bullBob 2.7s ease-in-out 1.3s infinite alternate}
@keyframes bearIn{from{opacity:0; transform:translateX(-9%) scale(1.08); filter:blur(12px) brightness(.2)}}
@keyframes bullIn{from{opacity:0; transform:translateX(9%) scale(1.08); filter:blur(12px) brightness(.2)}}
@keyframes bearBreathe{from{transform:none} to{transform:translateX(1.1%) scale(1.03) rotate(.5deg)}}
@keyframes bullBob{from{transform:none} to{transform:translate(-.7%,-.9%) scale(1.02) rotate(-.7deg)}}
/* each animal's glow breathes with it */
.sp-bear::after,.sp-bull::after{content:""; position:absolute; inset:0; mix-blend-mode:screen; animation:spGlow 2.2s ease-in-out 1.2s infinite alternate; opacity:.2}
.sp-bear::after{background:radial-gradient(28% 55% at 22% 45%, rgba(255,50,50,.55), transparent 70%)}
.sp-bull::after{background:radial-gradient(28% 55% at 76% 45%, rgba(40,255,140,.45), transparent 70%); animation-delay:1.8s}
@keyframes spGlow{to{opacity:.85}}
/* the black gap between them, darkened further so the greeting always reads */
.sp-hush{position:absolute; inset:0; pointer-events:none; background:radial-gradient(34% 40% at 50% 52%, rgba(3,6,5,.72), transparent 100%)}

/* embers rising: red on the bear's side, green on the bull's */
.sp-embers{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.sp-embers i{position:absolute; bottom:-10px; width:var(--s); height:var(--s); border-radius:50%; opacity:0;
  animation:spEmber var(--t) linear var(--d) infinite}
.sp-embers i.r{background:#FF4A3D; box-shadow:0 0 8px 2px rgba(255,60,50,.7)}
.sp-embers i.g{background:#3DFF95; box-shadow:0 0 8px 2px rgba(50,255,140,.6)}
@keyframes spEmber{0%{opacity:0; transform:translate(0,0)} 12%{opacity:.9} 100%{opacity:0; transform:translate(var(--dx),-70vh)}}

/* his equity curve, drawn across the whole window */
.sp-curve{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.sp-line{stroke-width:3.5; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; filter:drop-shadow(0 0 9px rgba(230,240,236,.45));
  animation:spDraw 1.5s cubic-bezier(.65,0,.35,1) .2s forwards}
.sp-area{opacity:0; animation:spFade .9s ease 1.2s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
.sp-tip,.sp-beat{fill:#3DFF95; transform-box:fill-box; transform-origin:center}
.sp-tip{transform:scale(0); filter:drop-shadow(0 0 8px rgba(61,255,149,.95)); animation:spPop .5s var(--spring) 1.65s forwards}
.sp-beat{opacity:0; animation:spBeat 1.1s ease-out 1.8s infinite}
@keyframes spBeat{from{opacity:.6; transform:scale(1)} to{opacity:0; transform:scale(4.5)}}

/* centre: icon, greeting, numbers */
.sp-core{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 16px}
.sp-icon{position:relative; width:96px; height:96px; margin-bottom:30px}
.sp-tile{position:absolute; inset:0; border-radius:30px; display:grid; place-items:center; color:#FFE3C8;
  background:var(--cool); box-shadow:0 24px 60px -16px var(--cool-glow), inset 0 1px 0 rgba(209,232,226,.5), inset 0 0 0 1px rgba(209,232,226,.14);
  transform:scale(.2) rotate(-35deg); opacity:0; animation:spTile .9s var(--spring) .05s forwards}
@keyframes spTile{to{transform:none; opacity:1}}
.sp-tile svg{width:56px; height:56px; overflow:visible; filter:drop-shadow(0 0 7px rgba(255,203,154,.85))}
.sp-mark{fill:none; stroke:currentColor; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1;
  animation:spDraw .7s cubic-bezier(.65,0,.35,1) .45s forwards}
.sp-dot{fill:currentColor; transform-origin:27.5px 6px; transform:scale(0); animation:spPop .5s var(--spring) 1.05s forwards}
@keyframes spPop{to{transform:scale(1)}}
.sp-ring{position:absolute; inset:0; border-radius:30px; border:2px solid #3FE0D0; opacity:0; animation:spRing 1.3s cubic-bezier(.2,.7,.3,1) 1.05s}
.sp-ring.r2{animation-delay:1.25s; border-color:#D1E8E2} .sp-ring.r3{animation-delay:1.45s; border-color:#D9B08C}
@keyframes spRing{0%{opacity:.8; transform:scale(1)} 100%{opacity:0; transform:scale(2.3); border-radius:50%}}

.sp-kicker{font-size:12px; font-weight:700; letter-spacing:.5em; text-transform:uppercase; color:#3FE0D0; margin:0 0 14px; padding-left:.5em;
  opacity:0; animation:spUp .7s var(--ease) .5s forwards}
.sp-hello{font-size:clamp(34px,6.4vw,74px); font-weight:800; letter-spacing:-.04em; line-height:1.05; margin:0; perspective:600px}
.sp-l{display:inline-block; opacity:0; transform:translateY(.55em) rotateX(-80deg); filter:blur(8px); transform-origin:50% 100%;
  animation:spLetter .75s var(--spring) forwards; animation-delay:calc(.6s + var(--i) * 34ms)}
@keyframes spLetter{to{opacity:1; transform:none; filter:none}}
.sp-name{display:inline-block; padding-right:.04em;
  background:linear-gradient(100deg,#B07A50 0%,#D9B08C 25%,#FFCB9A 42%,#D1E8E2 52%,#3FE0D0 70%,#116466 100%); background-size:250% 100%; background-position:100% 0;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  clip-path:inset(0 100% 0 0); animation:spWipe .8s cubic-bezier(.65,0,.35,1) 1.1s forwards, spSheen 1.6s ease-in-out 1.5s forwards}
@keyframes spWipe{to{clip-path:inset(0 -10% 0 0)}}
@keyframes spSheen{to{background-position:0 0}}
.sp-sub{margin:16px 0 0; font-size:15px; font-weight:600; color:var(--ink2); display:flex; align-items:center; gap:10px;
  opacity:0; transform:translateY(10px); animation:spUp .7s var(--ease) 1.25s forwards}
.sp-sub i{width:4px; height:4px; border-radius:50%; background:#D9B08C}
@keyframes spUp{to{opacity:1; transform:none}}
.sp-chips{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:30px}
.sp-chip{min-width:118px; padding:12px 18px; border-radius:18px; background:color-mix(in srgb,var(--surface) 70%,transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), 0 0 0 1px var(--hair2);
  display:flex; flex-direction:column; gap:3px; text-align:left;
  opacity:0; transform:translateY(22px) scale(.92); animation:spChip .75s var(--spring) forwards; animation-delay:calc(1.35s + var(--k) * 90ms)}
.sp-chip small{font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.sp-chip b{font-size:21px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.sp-chip b.up{color:var(--up)} .sp-chip b.down{color:var(--down)}
@keyframes spChip{to{opacity:1; transform:none}}
.sp-skip{position:absolute; bottom:26px; left:0; right:0; text-align:center; font-size:10.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink3); opacity:0; animation:spFade .6s ease 2s forwards}
@media (max-width:600px){ .sp-chip{min-width:0; flex:1 1 40%} .sp-icon{width:76px; height:76px} .sp-tile{border-radius:24px} .sp-tile svg{width:44px; height:44px} }

/* ---------- rules checklist ---------- */
.ru-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:20px; align-items:start}
.ru-score{padding:30px 22px 26px; display:flex; flex-direction:column; align-items:center; gap:20px; position:relative; transition:box-shadow .6s}
.ru-ringwrap{position:relative; width:min(250px,70vw); aspect-ratio:1}
.ru-ring{width:100%; height:100%; overflow:visible}
.ru-track{fill:none; stroke:var(--sunken); stroke-width:15}
.ru-arc{fill:none; stroke-width:15; stroke-linecap:butt; transition:stroke-dashoffset 1s var(--ease), stroke .5s}
.ru-cut{stroke:var(--surface); stroke-width:4}
.ru-num{position:absolute; inset:0; display:grid; place-content:center; text-align:center; gap:2px}
.ru-num b{font-size:68px; font-weight:800; letter-spacing:-.05em; line-height:1; font-variant-numeric:tabular-nums; transition:color .5s}
.ru-num small{font-size:10.5px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--ink3)}
.ru-grade{text-align:center; display:flex; flex-direction:column; gap:4px; min-height:48px}
.ru-grade b{font-size:21px; font-weight:800; letter-spacing:-.02em; transition:color .5s}
.ru-grade span{font-size:13.5px; color:var(--ink2)}
.ru-grade.flip{animation:ruFlip .55s var(--spring)}
@keyframes ruFlip{from{opacity:0; transform:translateY(10px) scale(.96); filter:blur(4px)}}
.ru-actions{display:flex; gap:10px}
/* 100/100: the ring glows and breathes */
.ru-score.perfect{box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), 0 0 0 1px color-mix(in srgb,var(--up) 40%,transparent), 0 0 70px -12px color-mix(in srgb,var(--up) 55%,transparent)}
.ru-score.perfect .ru-ringwrap{animation:ruBreathe 2s ease-in-out infinite}
.ru-score.perfect .ru-arc{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--up) 70%,transparent))}
@keyframes ruBreathe{50%{transform:scale(1.035)}}
.ru-burst{position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none}
.ru-burst i{position:absolute; width:8px; height:8px; margin:-4px; border-radius:50%; opacity:0; animation:ruBurst 1s cubic-bezier(.15,.8,.3,1) forwards}
@keyframes ruBurst{0%{opacity:1; transform:translate(0,0) rotate(0) scale(.3)} 70%{opacity:1} 100%{opacity:0; transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}

.ru-list{display:flex; flex-direction:column; gap:12px}
.ru-row{appearance:none; border:0; font:inherit; text-align:left; color:var(--ink); cursor:pointer; position:relative; overflow:hidden;
  display:flex; align-items:center; gap:16px; padding:19px 20px; border-radius:22px; background:var(--card-bg);
  box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--hair); transition:transform .35s var(--spring), box-shadow .4s}
.ru-row:hover{transform:translateY(-2px)}
.ru-row:active{transform:scale(.98)}
.ru-row:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.view.entering .ru-row{animation:ruIn .7s var(--spring) both; animation-delay:calc(120ms + var(--i) * 70ms)}
@keyframes ruIn{from{opacity:0; transform:translateX(26px) scale(.97)}}
.ru-sweep{position:absolute; inset:0; background:linear-gradient(90deg, color-mix(in srgb,var(--up) 16%,transparent), transparent 75%);
  transform:scaleX(0); transform-origin:left; transition:transform .55s var(--ease)}
.ru-row.on .ru-sweep{transform:scaleX(1)}
.ru-row.on{box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px color-mix(in srgb,var(--up) 30%,transparent)}
.ru-no{position:relative; font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--ink3); width:24px; transition:color .3s}
.ru-row.on .ru-no{color:var(--up)}
.ru-txt{position:relative; flex:1; display:flex; flex-direction:column; gap:3px; min-width:0}
.ru-txt b{font-size:16.5px; font-weight:750; letter-spacing:-.01em}
.ru-txt small{font-size:12.5px; color:var(--ink3)}
.ru-box{position:relative; flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
  box-shadow:inset 0 0 0 2px var(--hair2); transition:background .35s, box-shadow .35s}
.ru-box svg{width:21px; height:21px; fill:none; stroke:#0B2A1D; stroke-width:3; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .35s ease .08s}
.ru-row.on .ru-box{background:linear-gradient(145deg,#9BF0C4,#3FBF86); box-shadow:0 8px 18px -8px rgba(111,221,166,.8), inset 0 1px 0 rgba(255,255,255,.5)}
.ru-row.on .ru-box svg{stroke-dashoffset:0}
.ru-row.pop .ru-box{animation:ruPop .55s var(--spring)}
@keyframes ruPop{0%{transform:scale(.6)} 55%{transform:scale(1.2) rotate(-8deg)} 100%{transform:none}}
.ru-row.pop::after{content:""; position:absolute; right:38px; top:50%; width:12px; height:12px; margin:-6px; border-radius:50%;
  background:var(--up); opacity:.35; pointer-events:none; animation:ruRipple .7s ease-out forwards}
@keyframes ruRipple{to{transform:scale(45); opacity:0}}
@media (max-width:900px){ .ru-grid{grid-template-columns:minmax(0,1fr)} }

/* ---------- chart reel (overview) ---------- */
.t-reel{grid-column:span 12; padding:0 0 14px; overflow:hidden}
.t-reel .card-h{display:flex; align-items:center; gap:10px; padding-bottom:4px}
.rl-count{font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--ink3); padding:3px 9px; border-radius:999px; background:var(--sunken)}
.rl-btn{appearance:none; border:0; width:34px; height:34px; border-radius:12px; display:grid; place-items:center; cursor:pointer; color:var(--ink2);
  background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair); transition:transform .3s var(--spring), color .2s, background .2s}
.rl-btn:hover{color:var(--ink); background:var(--raised)}
.rl-btn:active{transform:scale(.9)}
.rl-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.rl-view{overflow:hidden; padding:14px 0 8px; cursor:grab; touch-action:pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent); mask-image:linear-gradient(90deg,transparent 0,#000 48px,#000 calc(100% - 48px),transparent)}
.rl-view:active{cursor:grabbing}
.rl-track{display:flex; gap:16px; width:max-content; padding:0 22px; will-change:transform; user-select:none; -webkit-user-select:none}
.rl-card{position:relative; flex:none; width:clamp(250px,26vw,360px); border:0; border-radius:20px; overflow:hidden; cursor:pointer;
  background:var(--sunken); box-shadow:0 18px 34px -20px rgba(0,0,0,.8), inset 0 0 0 1px var(--hair2);
  transition:transform .45s var(--spring), box-shadow .45s}
.rl-card:hover{transform:translateY(-5px)}
.rl-card:hover{box-shadow:0 22px 40px -20px rgba(0,0,0,.85), inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.view.entering .rl-card{animation:rlIn .8s var(--spring) both; animation-delay:calc(200ms + var(--k) * 80ms)}
@keyframes rlIn{from{opacity:0; transform:translateX(60px) scale(.94)}}
.rl-card .im{aspect-ratio:16/10}
.rl-card img{transition:transform 1.2s var(--ease)}
.rl-card:hover img{transform:scale(1.05)}
/* caption over a dark fade at the foot of the chart */
.rl-cap{position:absolute; left:0; right:0; bottom:0; padding:34px 16px 13px; display:flex; flex-direction:column; gap:2px;
  background:linear-gradient(transparent, rgba(3,8,7,.88)); color:#EEF4F1}
.rl-cap b{font-size:20px; font-weight:800; letter-spacing:-.02em}
.rl-cap b.up{color:#7BEBB0} .rl-cap b.down{color:#FF8A78}
.rl-cap small{font-size:12px; color:rgba(238,244,241,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rl-side{position:absolute; top:11px; left:11px; font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; padding:4px 9px; border-radius:999px;
  background:rgba(3,8,7,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.rl-side.up{color:#7BEBB0} .rl-side.down{color:#FF8A78}
@media (max-width:720px){ .rl-card{width:72vw} }

/* ---------- equity chart motion ---------- */
.eq-glow{opacity:.45}
.entering .eq-area{animation:eqArea 1.3s var(--ease) .35s both}
@keyframes eqArea{from{opacity:0; transform:translateY(14px)}}
/* a light runs along the curve every few seconds */
.eq-comet{stroke-dasharray:.07 1; stroke-dashoffset:.07; opacity:0; mix-blend-mode:screen; animation:eqComet 3.4s cubic-bezier(.45,0,.25,1) 1.6s infinite}
@keyframes eqComet{0%{stroke-dashoffset:.07; opacity:0} 8%{opacity:.9} 80%{opacity:.9} 100%{stroke-dashoffset:-1; opacity:0}}
.eq-ping{transform-box:fill-box; transform-origin:center; animation:eqPing 2s ease-out 1.2s infinite; opacity:0}
@keyframes eqPing{0%{opacity:.8; transform:scale(1)} 100%{opacity:0; transform:scale(3.4)}}
@media (prefers-reduced-motion: reduce){ .eq-comet,.eq-ping{animation:none; opacity:0} }

/* ---------- dock magnification ---------- */
.pu-dock{overflow:visible}
.pu-nav a{--m:1; min-width:calc(66px * var(--m)); transition:color .25s, min-width .38s var(--spring)}
.pu-nav a svg{transform:translateY(calc((var(--m) - 1) * -14px)) scale(var(--m)); transform-origin:50% 100%; transition:transform .38s var(--spring)}
.pu-nav a .ns{transform:translateY(calc((var(--m) - 1) * -6px)) scale(calc(1 + (var(--m) - 1) * .5)); transition:transform .38s var(--spring)}
.pu-plus{--m:1; margin-left:calc((var(--m) - 1) * 22px); transform:translateY(calc((var(--m) - 1) * -12px)) scale(var(--m));
  transition:transform .38s var(--spring), margin .38s var(--spring)}
.pu-plus:hover{transform:translateY(calc((var(--m) - 1) * -12px)) scale(var(--m)) rotate(90deg)}
/* while the cursor is on the dock, follow it closely instead of springing */
.pu-dock.mag .pu-nav a{transition:color .25s, min-width .12s ease-out}
.pu-dock.mag .pu-nav a svg,.pu-dock.mag .pu-nav a .ns{transition:transform .12s ease-out}
.pu-dock.mag .pu-plus{transition:transform .12s ease-out, margin .12s ease-out}
.pu-dock.mag .pu-nav .pill{transition:transform .12s ease-out, width .12s ease-out}

/* ---------- rings motion (matches the equity chart) ---------- */
.pu-rings svg{filter:none}
.rg-comet{opacity:0; mix-blend-mode:screen; animation:rgComet 3s cubic-bezier(.45,0,.25,1) infinite; animation-delay:calc(2s + var(--k) * .9s)}
@keyframes rgComet{0%{stroke-dashoffset:var(--c0); opacity:0} 10%{opacity:.85} 82%{opacity:.85} 100%{stroke-dashoffset:var(--c1); opacity:0}}
.rg-ping{transform-box:fill-box; transform-origin:center; opacity:0; animation:eqPing 2.2s ease-out infinite; animation-delay:calc(1.7s + var(--k) * .35s)}
.pu-rings li i{box-shadow:0 0 10px -1px currentColor}
@media (prefers-reduced-motion: reduce){ .rg-comet,.rg-ping{animation:none; opacity:0} }

/* =====================================================================
   Polish pass (2026-09-29)
   ===================================================================== */
/* sparklines */
.tile{position:relative}
.tile svg.spark.sp2{height:40px; overflow:visible}
.sp-glow{opacity:.5}
.entering .sp-area{animation:eqArea 1.1s var(--ease) .3s both}
.tile .eq-comet{animation-duration:3s; animation-delay:2.4s}
.t-b .eq-comet{animation-delay:3.4s}
/* the streak strip */
.fs{display:flex; gap:4px; margin-top:12px; height:22px; align-items:flex-end}
.fs i{flex:1; height:100%; border-radius:4px; background:var(--hair2); transform-origin:bottom}
.fs i.w{background:linear-gradient(180deg,#9BF0C4,#3FBF86); box-shadow:0 0 12px -4px rgba(111,221,166,.8)}
.fs i.l{background:linear-gradient(180deg,#FF9C8A,#D9534F); box-shadow:0 0 12px -4px rgba(240,128,106,.7)}
.entering .fs i{animation:fsIn .6s var(--spring) both; animation-delay:calc(350ms + var(--k) * 45ms)}
@keyframes fsIn{from{transform:scaleY(0); opacity:0}}
.fs i.last{animation:fsBeat 1.8s ease-in-out 1.5s infinite}
@keyframes fsBeat{50%{filter:brightness(1.35); transform:scaleY(1.12)}}
/* a winning streak of 2+ burns */
.t-c.hot .v span{position:relative; display:inline-block; background:linear-gradient(0deg,#6FDDA6,#C9F7DD 60%,#FFE3C8); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 12px rgba(111,221,166,.55)); animation:hotFlicker 2.4s ease-in-out infinite}
.t-c.hot .v span::after{content:"🔥"; -webkit-text-fill-color:initial; color:initial; font-size:.6em; margin-left:.25em; vertical-align:.35em; display:inline-block; animation:hotFlame 1.2s ease-in-out infinite alternate; filter:none}
@keyframes hotFlicker{50%{filter:drop-shadow(0 0 18px rgba(111,221,166,.8))}}
@keyframes hotFlame{from{transform:rotate(-6deg) scale(.95)} to{transform:rotate(6deg) scale(1.08) translateY(-2px)}}

/* the header clock */
.pu-greet{position:relative; min-width:230px}
.pu-left{margin-left:6px; font-size:12px; font-weight:700; color:var(--accent); padding:2px 8px; border-radius:999px; background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pu-ny{font-variant-numeric:tabular-nums; color:var(--ink2)}
.pu-sbar{position:absolute; left:16px; right:0; bottom:-7px; height:2px; border-radius:2px; background:var(--hair)}
.pu-sbar b{display:block; height:100%; border-radius:inherit; background:var(--warm); box-shadow:0 0 8px var(--warm-glow); transition:width 1s linear}

/* stat tiles tilt toward the cursor (the cursor spotlight was removed at Luca's request) */
.t-a,.t-b,.t-c{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .5s var(--ease), box-shadow .4s; will-change:transform}
.t-a.lit,.t-b.lit,.t-c.lit{transition:transform .12s ease-out, box-shadow .4s}

/* click ripple */
.btn,.chip,.rl-btn,.seg button,.link{position:relative; overflow:hidden}
.link{overflow:visible}
.pu-ripple{position:absolute; border-radius:50%; background:currentColor; opacity:.22; pointer-events:none; transform:scale(0); animation:puRipple .6s ease-out forwards}
@keyframes puRipple{to{transform:scale(1); opacity:0}}

/* tab changes: the page lifts out of a soft blur, tiles cascade in */
.entering{animation:viewin2 .55s var(--ease) both}
@keyframes viewin2{from{opacity:0; transform:translateY(14px); filter:blur(6px)}}
.entering .bento > *{animation:tileIn .7s var(--spring) both}
.entering .bento > :nth-child(1){animation-delay:.04s} .entering .bento > :nth-child(2){animation-delay:.1s}
.entering .bento > :nth-child(3){animation-delay:.16s} .entering .bento > :nth-child(4){animation-delay:.21s}
.entering .bento > :nth-child(5){animation-delay:.26s} .entering .bento > :nth-child(6){animation-delay:.31s}
.entering .bento > :nth-child(7){animation-delay:.36s} .entering .bento > :nth-child(8){animation-delay:.41s}
.entering .bento > :nth-child(9){animation-delay:.46s}
@keyframes tileIn{from{opacity:0; transform:translateY(22px) scale(.97)}}

/* calendar: today pulses, trading days glow in their own colour on hover */
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.today::after{content:""; position:absolute; inset:-1px; border-radius:inherit; box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent); animation:todayPulse 2.4s ease-out infinite; pointer-events:none}
@keyframes todayPulse{to{box-shadow:0 0 0 8px transparent}}
.day{position:relative; transition:transform .35s var(--spring), box-shadow .3s, filter .3s}
.day.has:hover{filter:brightness(1.25) saturate(1.2); box-shadow:0 10px 24px -10px rgba(0,0,0,.7); z-index:2}

/* trade rows: a tone-coloured edge slides in on hover */
.tr{position:relative; transition:background .25s, transform .3s var(--ease)}
.tr::before{content:""; position:absolute; left:0; top:20%; bottom:20%; width:3px; border-radius:0 3px 3px 0; background:var(--hair2); transform:scaleY(0); transition:transform .3s var(--spring)}
.tr:has(.pnl.up)::before{background:var(--up); box-shadow:0 0 12px var(--up)}
.tr:has(.pnl.down)::before{background:var(--down); box-shadow:0 0 12px var(--down)}
.tr:hover{background:var(--wash); transform:translateX(3px)}
.tr:hover::before{transform:scaleY(1)}
.tr .thumb{transition:transform .35s var(--spring)}
.tr:hover .thumb{transform:scale(1.5); position:relative; z-index:2; box-shadow:0 10px 24px -8px rgba(0,0,0,.8)}

/* toasts: glass, spring in, with a draining timer line */
.toast{backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); background:color-mix(in srgb,var(--raised) 82%,transparent) !important;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.8), inset 0 1px 0 var(--card-edge), 0 0 0 1px var(--hair2) !important; overflow:hidden;
  animation:toastIn .5s var(--spring) both}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,24px) scale(.9)}}
.toast::after{content:""; position:absolute; left:0; bottom:0; height:2px; width:100%; background:var(--warm); transform-origin:left; animation:toastDrain 3.2s linear forwards}
@keyframes toastDrain{to{transform:scaleX(0)}}

/* confetti */
.pu-conf{position:fixed; left:0; top:0; width:9px; height:5px; border-radius:1px; z-index:300; pointer-events:none}

@media (prefers-reduced-motion: reduce){
  .fs i.last,.t-c.hot .v span,.t-c.hot .v span::after,.day.today::after{animation:none}
  .t-a,.t-b,.t-c{transform:none}
}

/* =====================================================================
   Edge + Journal polish (2026-09-29)
   ===================================================================== */
/* setup matrix: cells glow in their own colour, lift on hover, pop in on entry */
.cell{border-radius:14px; transition:transform .35s var(--spring), box-shadow .35s, filter .3s}
.cell.has{background:linear-gradient(150deg, color-mix(in srgb,var(--c) 42%,transparent), color-mix(in srgb,var(--c) 16%,transparent)) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1px color-mix(in srgb,var(--c) 35%,transparent), 0 10px 26px -14px var(--c)}
.cell.has:hover,.cell.has:focus-visible{transform:translateY(-3px) scale(1.04); filter:brightness(1.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1.5px var(--c), 0 16px 34px -12px var(--c)}
.cell.has .a{font-size:15px; font-weight:800; text-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
.cell.none{border-radius:14px}
.entering .cell.has{animation:cellPop .6s var(--spring) both; animation-delay:var(--d,0ms)}
@keyframes cellPop{from{opacity:0; transform:scale(.7)}}

/* time of day: gradient bars with a glow, springing up from zero */
.hr .bar{border-radius:7px}
.hr .bar.pos{background:linear-gradient(180deg,#9BF0C4,#2FA774) !important; box-shadow:0 0 18px -4px rgba(111,221,166,.65)}
.hr .bar.neg{background:linear-gradient(0deg,#FF9C8A,#C94A3C) !important; box-shadow:0 0 18px -4px rgba(240,128,106,.6)}
.hr.has:hover .bar{filter:brightness(1.25)}
.entering .hr .bar{animation:barUp .8s var(--spring) both; animation-delay:calc(150ms + var(--d,0ms))}
@keyframes barUp{from{transform:scaleY(0); opacity:0}}
.hours{padding-top:6px}

/* splits: thicker glowing bars that grow out from the centre line */
.split .trk{height:12px}
.split .trk i{height:12px; border-radius:6px; overflow:hidden}
.split .trk i.pos{background:linear-gradient(90deg,#2FA774,#9BF0C4) !important; box-shadow:0 0 14px -3px rgba(111,221,166,.6); transform-origin:left}
.split .trk i.neg{background:linear-gradient(270deg,#C94A3C,#FF9C8A) !important; box-shadow:0 0 14px -3px rgba(240,128,106,.55); transform-origin:right}
.split .trk i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  transform:translateX(-100%); animation:barSheen 3.6s ease-in-out 1.4s infinite}
@keyframes barSheen{35%,100%{transform:translateX(100%)}}
.entering .split .trk i{animation:splitGrow .9s var(--spring) both; animation-delay:.25s}
@keyframes splitGrow{from{transform:scaleX(0)}}
.split{transition:background .25s}
.split:hover{background:var(--wash)}

/* the side-by-side panels (waited / didn't, last 10 / month) */
.duo{box-shadow:inset 0 0 0 1px var(--hair)}
.duo > *{transition:background .3s}
.duo > *:hover{background:var(--wash)}

/* Journal: the filter card and the day groups */
.search{border-radius:14px; transition:box-shadow .3s, background .3s}
.search:focus-within{box-shadow:0 0 0 1.5px var(--accent), 0 0 22px -6px var(--accent)}
.day-h{position:relative}
.day-h h3{font-size:14px}
.day-h .p{font-weight:800; padding:3px 10px; border-radius:999px}
.day-h .p.up{background:color-mix(in srgb,var(--up) 14%,transparent); box-shadow:0 0 16px -6px var(--up)}
.day-h .p.down{background:color-mix(in srgb,var(--down) 14%,transparent); box-shadow:0 0 16px -6px var(--down)}
.day-h::after{content:""; position:absolute; left:22px; right:22px; bottom:0; height:1px; background:linear-gradient(90deg,var(--hair2),transparent)}
.entering .day-h{animation:rise .5s var(--ease) both}
.jhead{letter-spacing:.14em}

/* =====================================================================
   Shots + Size polish (2026-09-29)
   ===================================================================== */
/* Shots: cards tilt toward the cursor, glow in their result colour, a sheen crosses the chart */
.shots .shot-card{--tone:var(--hair2); position:relative; border-radius:22px; overflow:hidden; background:var(--card-bg);
  box-shadow:var(--lift), inset 0 0 0 1px var(--hair);
  transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .5s var(--ease), box-shadow .4s}
.shots .shot-card:has(.pill.win){--tone:var(--up)}
.shots .shot-card:has(.pill.loss){--tone:var(--down)}
.shots .shot-card.lit{transition:transform .12s ease-out, box-shadow .4s}
.shots .shot-card:hover,.shots .shot-card:focus-visible{box-shadow:0 26px 50px -24px rgba(0,0,0,.9), 0 0 0 1.5px var(--tone), 0 18px 44px -18px var(--tone)}
.shots .shot-card .im::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 48%, transparent 62%); transform:translateX(-120%); transition:transform .9s var(--ease)}
.shots .shot-card:hover .im::after{transform:translateX(120%)}
.shots .shot-card .meta b + .n,.shots .shot-card .meta .n{font-weight:800}
.shots .shot-card .res .pill{box-shadow:0 0 14px -2px var(--tone)}
.shots .shot-card::after{content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--tone); opacity:.8;
  box-shadow:0 0 14px var(--tone); transform:scaleX(0); transform-origin:left; transition:transform .5s var(--spring)}
.shots .shot-card:hover::after{transform:scaleX(1)}
.entering .shots .shot-card{animation:shotIn .7s var(--spring) both; animation-delay:calc(min(var(--k,0), 14) * 55ms + 80ms)}
@keyframes shotIn{from{opacity:0; transform:translateY(26px) scale(.93) rotateX(8deg)}}
/* the viewer: frosted backdrop, the chart zooms up to meet you */
.gallery.lightbox{background:rgba(3,8,7,.78); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2)}
.gallery .stage img{animation:shotZoom .5s var(--spring) both; border-radius:16px; box-shadow:0 40px 100px -30px #000, 0 0 0 1px rgba(209,232,226,.12)}
@keyframes shotZoom{from{opacity:0; transform:scale(.9)}}
.gallery .nav-b{background:rgba(209,232,226,.08) !important; backdrop-filter:blur(10px); box-shadow:inset 0 0 0 1px rgba(209,232,226,.16); transition:transform .3s var(--spring), background .2s}
.gallery .nav-b:hover{transform:translateY(-50%) scale(1.12); background:rgba(209,232,226,.16) !important}
.gallery .close:hover{transform:scale(1.12)}

/* Size: the answer is the hero */
.size-big{font-family:var(--f-ui); font-weight:800; font-stretch:normal; letter-spacing:-.05em; font-size:clamp(64px,8vw,104px)}
.size-big > span:first-child{background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 22px var(--warm-glow))}
.size-big small{font-weight:700; letter-spacing:.14em; font-size:.2em; color:var(--ink3); vertical-align:.9em}
#sizeOut{position:relative}
#sizeOut > *{animation:sizeIn .45s var(--ease) both}
@keyframes sizeIn{from{opacity:.4; transform:translateY(4px)}}
/* budget meter: thicker, glowing, with a light running across it */
.meter{height:12px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair)}
.meter i{position:relative; background:var(--warm) !important; box-shadow:0 0 16px -2px var(--warm-glow); overflow:hidden; transition:width .7s var(--spring)}
.meter i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-100%); animation:barSheen 2.8s ease-in-out .6s infinite}
/* contract options and targets */
.opts,.targets{border-radius:16px; gap:0; background:transparent; border:1px solid var(--hair2)}
.opt{background:transparent; transition:background .25s}
.opt + .opt{border-top:1px solid var(--hair)}
.opt:hover{background:var(--wash)}
.opt.best{background:linear-gradient(90deg, color-mix(in srgb,var(--accent) 16%,transparent), transparent 70%)}
.opt.best .q{color:var(--accent)}
.targets > div{background:transparent; padding:13px 14px; position:relative; transition:background .25s}
.targets > div + div{border-left:1px solid var(--hair)}
.targets > div:hover{background:color-mix(in srgb,var(--up) 8%,transparent)}
.targets .s.up{text-shadow:0 0 14px color-mix(in srgb,var(--up) 55%,transparent)}
.entering .targets > div{animation:rise .5s var(--ease) both}
.entering .targets > div:nth-child(2){animation-delay:.08s} .entering .targets > div:nth-child(3){animation-delay:.16s}
/* inputs glow when you type */
.money-in,input.in{transition:border-color .25s, box-shadow .3s}
.money-in:focus-within,input.in:focus{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent), 0 0 24px -8px var(--accent)}
/* empty answer: a slow breathing outline instead of a flat box */
#sizeOut .empty-chart{border-radius:20px; animation:emptyBreathe 3.2s ease-in-out infinite}
@keyframes emptyBreathe{50%{border-color:color-mix(in srgb,var(--accent) 45%,transparent); color:var(--ink2)}}
@media (prefers-reduced-motion: reduce){ .meter i::after,#sizeOut .empty-chart{animation:none} .shots .shot-card{transform:none} }

/* =====================================================================
   Rules + Data polish (2026-09-29)
   ===================================================================== */
/* rules ring: glow, textured track, running light, an aura that grows with the score */
.ru-ticks{fill:none; stroke:var(--ink3); stroke-opacity:.35; stroke-width:7}
.ru-glow{opacity:.55}
.ru-comet{fill:none; stroke:#FFFFFF; stroke-width:8; stroke-linecap:round; opacity:0; mix-blend-mode:screen}
.ru-comet.on{animation:rgComet 3s cubic-bezier(.45,0,.25,1) 1.4s infinite}
.ru-score::before{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(60% 45% at 50% 32%, var(--ru-col,transparent), transparent 70%); opacity:var(--ru-a,0); transition:opacity .8s, background .6s}
.ru-score > *{position:relative}
.ru-row::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,.10) 50%, transparent 65%); transform:translateX(-120%); transition:transform .9s var(--ease)}
.ru-row:hover::before{transform:translateX(120%)}
.ru-num b{text-shadow:0 0 30px currentColor}

/* data: four status tiles with glowing icons */
.dtiles{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
.dt{position:relative; padding:16px 16px 14px; border-radius:18px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 0 var(--card-edge);
  display:flex; flex-direction:column; gap:6px; transition:transform .35s var(--spring), box-shadow .35s}
.dt:hover{transform:translateY(-3px); box-shadow:inset 0 0 0 1px var(--hair2), 0 14px 30px -18px rgba(0,0,0,.8)}
.dt-i{width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--cool); color:#E6F2EE; box-shadow:0 8px 18px -8px var(--cool-glow); margin-bottom:4px}
.dt:nth-child(2) .dt-i{background:linear-gradient(145deg,#9BF0C4,#2FA774); box-shadow:0 8px 18px -8px rgba(111,221,166,.8); color:#0B2A1D}
.dt:nth-child(3) .dt-i{background:var(--warm); box-shadow:0 8px 18px -8px var(--warm-glow); color:var(--warm-ink)}
.dt-i svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.dt .sv{font-size:16px; font-weight:750}
.dt .sv small{display:block; font-size:11.5px; font-weight:500; color:var(--ink3); margin-top:2px}
.entering .dt{animation:rise .55s var(--ease) both; animation-delay:calc(80ms + var(--k) * 70ms)}
@media (max-width:900px){ .dtiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
/* data: sync between the Mac and the phone */
.gs-state{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:13px 16px; border-radius:16px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 0 var(--card-edge)}
.gs-state i{width:10px; height:10px; border-radius:50%; background:var(--ink3); flex:0 0 auto}
.gs-state b{font-size:15px; font-weight:750}
.gs-state span{font-size:12.5px; color:var(--ink3); flex:1 1 180px}
.gs-state.ok i{background:var(--up); box-shadow:0 0 12px var(--up)}
.gs-state.busy i{background:var(--accent); box-shadow:0 0 12px var(--accent); animation:gsPulse 1s ease-in-out infinite}
.gs-state.warn i{background:var(--accent)}
.gs-state.bad i{background:var(--down); box-shadow:0 0 12px var(--down)}
.gs-state.bad span{color:var(--down)}
@keyframes gsPulse{50%{transform:scale(.55); opacity:.5}}
.gs-row .in{flex:1 1 220px; min-width:0}
.gs-how{font-size:13px; color:var(--ink2)}
.gs-how summary{cursor:pointer; font-weight:650; color:var(--accent); list-style:none}
.gs-how summary::-webkit-details-marker{display:none}
.gs-how ol{margin:10px 0 0; padding-left:20px; display:flex; flex-direction:column; gap:6px; line-height:1.5}
@media (prefers-reduced-motion: reduce){ .gs-state.busy i{animation:none} }
/* keys look like keycaps */
.kbd-list kbd{background:linear-gradient(180deg,var(--raised),var(--sunken)); border:0; border-radius:8px; padding:3px 8px; font-weight:700;
  box-shadow:inset 0 1px 0 var(--card-edge), 0 2px 0 var(--sunken), 0 3px 8px -3px rgba(0,0,0,.6), inset 0 0 0 1px var(--hair2)}
/* the destructive button warns as you approach it */
.btn.danger{transition:box-shadow .3s, background .3s, transform .3s var(--spring)}
.btn.danger:hover{background:color-mix(in srgb,var(--down) 16%,transparent); box-shadow:0 0 0 1px var(--down), 0 0 24px -6px var(--down)}
textarea.in:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent), 0 0 24px -8px var(--accent)}
/* every tab's cards cascade in */
.entering > .card,.entering > .cols > .card,.entering > .ru-grid > *{animation:tileIn .7s var(--spring) both}
.entering > .cols:nth-of-type(2) > .card{animation-delay:.1s} .entering > .cols:nth-of-type(3) > .card{animation-delay:.18s}
.entering > .cols > .card:nth-child(2){animation-delay:.14s}

/* equity chart: a dot per trade, popping in as the line reaches it */
.eq-mark{transform-box:fill-box; transform-origin:center; filter:drop-shadow(0 0 5px currentColor)}
.entering .eq-mark{animation:markPop .45s var(--spring) both; animation-delay:var(--t)}
@keyframes markPop{from{transform:scale(0); opacity:0}}

/* ---------- trade order sheet ---------- */
.ord-open{display:inline-flex; align-items:center; gap:7px; margin-right:10px}
.ord-open svg{width:16px; height:16px; fill:currentColor}
.ord-list{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
.ord-row{position:relative; display:grid; grid-template-columns:28px 28px minmax(0,1fr) auto auto; align-items:center; gap:12px;
  padding:11px 12px; border-radius:16px; background:var(--card-bg); box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--hair);
  transition:transform .28s var(--spring), box-shadow .3s}
.entering .ord-row,.sheet.on .ord-row{animation:rise .45s var(--ease) both; animation-delay:calc(min(var(--k), 14) * 30ms)}
.ord-list.sorting .ord-row{animation:none}
.ord-row.dragging{z-index:5; transition:none; cursor:grabbing; box-shadow:0 24px 50px -18px rgba(0,0,0,.9), 0 0 0 1.5px var(--accent), 0 0 30px -8px var(--accent)}
.ord-row.moved{animation:ordLand .9s ease-out}
@keyframes ordLand{0%{box-shadow:var(--lift), 0 0 0 1.5px var(--accent), 0 0 26px -6px var(--accent)} 100%{box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--hair)}}
.ord-grip{display:grid; place-items:center; width:28px; height:34px; border-radius:9px; color:var(--ink3); cursor:grab; touch-action:none; transition:color .2s, background .2s}
.ord-grip:hover{color:var(--ink); background:var(--wash)}
.ord-grip svg{width:18px; height:18px; fill:currentColor}
.ord-no{font-size:13px; font-weight:800; color:var(--ink3); text-align:center; font-variant-numeric:tabular-nums}
.ord-main{display:flex; flex-direction:column; gap:3px; min-width:0}
.ord-main b{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ord-main small{font-size:12px; color:var(--ink3)}
.ord-main .side{font-size:9.5px}
.ord-pnl{font-weight:800; font-size:14px}
.ord-btns{display:flex; gap:4px}
.ord-btns .iconbtn{width:30px; height:30px; border-radius:10px}
.ord-btns .iconbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.ord-btns .iconbtn:disabled{opacity:.25}

/* ---------- dictation ---------- */
.mic-wrap{position:relative; display:block}
.mic-wrap textarea.in{padding-right:52px; transition:box-shadow .3s, border-color .3s}
.mic-wrap.live textarea.in{border-color:var(--down); box-shadow:0 0 0 3px color-mix(in srgb,var(--down) 18%,transparent), 0 0 30px -8px var(--down)}
.mic{--lv:0; position:absolute; right:9px; bottom:9px; width:34px; height:34px; border:0; border-radius:12px; cursor:pointer; display:grid; place-items:center;
  color:var(--ink2); background:var(--raised); box-shadow:inset 0 0 0 1px var(--hair2), 0 4px 10px -4px rgba(0,0,0,.5);
  transition:transform .3s var(--spring), background .3s, color .3s, box-shadow .15s}
.mic:hover{color:var(--ink); transform:scale(1.08)}
.mic:active{transform:scale(.92)}
.mic-i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:opacity .2s, transform .3s var(--spring)}
.mic.arming{animation:micArm 1s ease-in-out infinite}
@keyframes micArm{50%{box-shadow:inset 0 0 0 1px var(--down), 0 0 16px -4px var(--down)}}
/* listening: coral, rings swell with your voice, the icon becomes a live level meter */
.mic.live{color:#fff; background:linear-gradient(145deg,#FF8A78,#E0503F);
  box-shadow:0 0 0 calc(3px + var(--lv) * 12px) rgba(240,128,106,.22), 0 0 0 calc(7px + var(--lv) * 22px) rgba(240,128,106,.10), 0 8px 20px -6px rgba(224,80,63,.9)}
.mic.live::before{content:""; position:absolute; inset:-4px; border-radius:15px; border:1.5px solid rgba(240,128,106,.6); animation:micRing 1.6s ease-out infinite; pointer-events:none}
@keyframes micRing{to{transform:scale(1.8); opacity:0}}
.mic.live .mic-i{opacity:0; transform:scale(.5)}
.mic-eq{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:2.5px; opacity:0; transition:opacity .2s}
.mic.live .mic-eq{opacity:1}
.mic-eq i{width:3px; border-radius:2px; background:#fff; height:calc(4px + var(--lv) * 16px); transition:height .08s linear; animation:micBar .9s ease-in-out infinite alternate}
.mic-eq i:nth-child(2){animation-delay:-.3s; height:calc(6px + var(--lv) * 20px)} .mic-eq i:nth-child(3){animation-delay:-.6s; height:calc(5px + var(--lv) * 18px)} .mic-eq i:nth-child(4){animation-delay:-.15s}
@keyframes micBar{to{transform:scaleY(.55)}}
.mic-tag{position:absolute; right:42px; top:50%; transform:translate(8px,-50%); white-space:nowrap; font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:var(--down); background:color-mix(in srgb,var(--surface) 85%,transparent); padding:3px 9px; border-radius:999px; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .35s var(--spring)}
.mic.live .mic-tag{opacity:1; transform:translate(0,-50%); animation:micTag 1.4s ease-in-out infinite}
@keyframes micTag{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){ .mic.live::before,.mic-eq i,.mic.live .mic-tag,.mic.arming{animation:none} }

/* ---------- "after loss" flag on trade rows ---------- */
.al-tag{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--down); padding:2px 7px; border-radius:999px;
  background:color-mix(in srgb,var(--down) 14%,transparent); margin-right:6px; vertical-align:1px}


/* ---------- reviews ---------- */
.rv-grid{display:grid; grid-template-columns:minmax(230px,300px) minmax(0,1fr); gap:20px; align-items:start}
.rv-list{display:flex; flex-direction:column; gap:10px; position:sticky; top:16px}
.rv-item{appearance:none; border:0; font:inherit; color:var(--ink); text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:3px;
  padding:14px 16px; border-radius:18px; background:var(--card-bg); box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--hair);
  transition:transform .35s var(--spring), box-shadow .35s}
.rv-item:hover{transform:translateX(4px)}
.rv-item.on{box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1.5px var(--accent), 0 0 26px -10px var(--accent)}
.rv-item b{font-size:15px; font-weight:750}
.rv-item small{font-size:12px; color:var(--ink3)}
.rv-kind,.rv-tag{align-self:flex-start; font-size:9.5px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; padding:3px 9px; border-radius:999px;
  color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent)}
.rv-item.monthly .rv-kind,.rv-tag.monthly{color:var(--violet); background:color-mix(in srgb,var(--violet) 16%,transparent)}
.entering .rv-item{animation:rise .5s var(--ease) both; animation-delay:calc(80ms + min(var(--k), 12) * 45ms)}
.rv-acts{display:flex; gap:8px; margin-top:4px}
.rv-doc{padding:28px 34px 34px; font-size:14.5px; line-height:1.65; color:var(--ink2); min-width:0}
.rv-doc .md-h{color:var(--ink); letter-spacing:-.02em}
.rv-doc h2.md-h{font-size:clamp(24px,2.6vw,32px); margin:10px 0 6px}
.rv-doc h3.md-h{font-size:18px; margin:28px 0 10px; padding-top:18px; border-top:1px solid var(--hair)}
.rv-doc h4.md-h{font-size:15px; margin:18px 0 6px}
.rv-doc p{margin:8px 0}
.rv-doc b{color:var(--ink)}
.rv-doc ul,.rv-doc ol{margin:8px 0; padding-left:22px}
.rv-doc li{margin:5px 0}
.rv-doc li::marker{color:var(--accent)}
.rv-doc blockquote{margin:12px 0; padding:10px 16px; border-radius:0 14px 14px 0; border-left:3px solid var(--accent); background:var(--sunken); color:var(--ink); font-style:italic}
.rv-doc code{font-size:.9em; padding:1px 6px; border-radius:6px; background:var(--sunken)}
.rv-doc hr{border:0; height:1px; background:var(--hair2); margin:20px 0}
.rv-doc .n.up{color:var(--up); font-weight:700} .rv-doc .n.down{color:var(--down); font-weight:700}
.md-tw{overflow-x:auto; margin:12px 0; border-radius:14px; box-shadow:inset 0 0 0 1px var(--hair2)}
.rv-doc table{border-collapse:collapse; width:100%; font-size:13px}
.rv-doc th,.rv-doc td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--hair)}
.rv-doc th{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); background:var(--sunken)}
.rv-doc tr:last-child td{border-bottom:0}
.rv-doc tr:hover td{background:var(--wash)}
.entering .rv-doc{animation:tileIn .7s var(--spring) both .1s}
.rv-empty{padding:48px 28px; text-align:center; max-width:560px; margin:0 auto; color:var(--ink2); line-height:1.6}
.rv-empty-i{width:60px; height:60px; margin:0 auto 14px; border-radius:18px; display:grid; place-items:center; background:var(--cool); color:#E6F2EE; box-shadow:0 12px 26px -10px var(--cool-glow)}
.rv-empty-i svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.rv-empty h2{color:var(--ink); margin:0 0 8px}
@media (max-width:900px){ .rv-grid{grid-template-columns:1fr} .rv-list{position:static} }
.rv-tag{display:inline-block}

.sp-ring{border-radius:50%}
@media (max-width:600px){ .sp-icon{width:130px; height:130px} }

/* ---------- size, reworked ---------- */
.sz-wrap{display:flex; flex-direction:column; gap:20px}
.sz-out-host{display:flex; flex-direction:column; gap:20px}
#sizeOut > *{animation:none}
.sz-hero{display:grid; grid-template-columns:minmax(260px,.9fr) minmax(0,1.6fr); gap:26px; padding:26px 28px; position:relative; overflow:hidden}
.sz-hero::before{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(50% 80% at 12% 30%, rgba(217,176,140,.10), transparent 70%)}
.sz-main{display:flex; flex-direction:column; gap:8px; position:relative}
.sz-big{display:flex; align-items:baseline; gap:12px; line-height:.95}
.sz-n{font-size:clamp(80px,9vw,120px); font-weight:800; letter-spacing:-.06em; background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 26px var(--warm-glow))}
.sz-u{font-size:18px; font-weight:800; letter-spacing:.18em; color:var(--ink3)}
.sz-mix{font-size:clamp(40px,4.4vw,58px); font-weight:800; letter-spacing:-.04em; background:var(--warm); -webkit-background-clip:text; background-clip:text; color:transparent}
.sz-conv{align-self:flex-start; font-size:14px; font-weight:650; color:var(--ink2); padding:5px 12px; border-radius:999px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair2)}
.sz-conv b{color:var(--ink); font-weight:800}
.sz-ladder{display:flex; flex-wrap:wrap; gap:4px; max-width:340px; margin-top:6px}
.sz-ladder i{width:9px; height:18px; border-radius:3px; background:linear-gradient(180deg,#FFCB9A,#B07A50); box-shadow:0 0 8px -2px var(--warm-glow);
  animation:pipIn .45s var(--spring) both; animation-delay:calc(var(--i) * 14ms)}
.sz-ladder i.nq{margin-right:8px}
.sz-ladder span{font-size:12px; font-weight:700; color:var(--ink3); align-self:center}
@keyframes pipIn{from{transform:scaleY(0); opacity:0}}
.sz-meter{margin-top:8px}
.sz-mrow{display:flex; justify-content:space-between; margin-top:7px; font-size:12.5px; color:var(--ink2)}
.sz-mrow b{color:var(--ink)}
/* the outcomes */
.sz-outs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-content:center}
.sz-out{position:relative; overflow:hidden; padding:18px 16px 16px; border-radius:20px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 0 var(--card-edge);
  display:flex; flex-direction:column; gap:6px; transition:transform .35s var(--spring), box-shadow .35s}
.sz-out:hover{transform:translateY(-4px)}
.sz-out.win{--t:var(--up)} .sz-out.loss{--t:var(--down)}
.sz-out:hover{box-shadow:inset 0 0 0 1.5px var(--t), 0 16px 34px -18px var(--t)}
.sz-o-v{font-size:clamp(24px,2.4vw,32px); font-weight:800; letter-spacing:-.03em; color:var(--t); text-shadow:0 0 22px color-mix(in srgb,var(--t) 40%,transparent)}
.sz-o-s{font-size:12.5px; color:var(--ink3)}
.sz-o-s b{color:var(--ink2)}
.sz-o-bar{position:absolute; left:0; bottom:0; height:3px; width:var(--w); background:var(--t); box-shadow:0 0 12px var(--t); transform-origin:left; animation:splitGrow .9s var(--spring) both; animation-delay:calc(.2s + var(--k) * .08s)}
.entering .sz-out,.sz-hero.pop .sz-out{animation:rise .55s var(--ease) both; animation-delay:calc(.1s + var(--k) * 70ms)}
/* options + log */
.sz-sub{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:end}
.sz-opts .card-b{display:flex; flex-direction:column; gap:8px}
.sz-opt{appearance:none; border:0; font:inherit; color:var(--ink); cursor:pointer; display:grid; grid-template-columns:110px minmax(0,1fr) auto; gap:12px; align-items:center;
  padding:12px 14px; border-radius:14px; background:transparent; box-shadow:inset 0 0 0 1px var(--hair); text-align:left; transition:background .25s, box-shadow .25s, transform .3s var(--spring)}
.sz-opt:hover{background:var(--wash); transform:translateX(3px)}
.sz-opt.on{background:linear-gradient(90deg, color-mix(in srgb,var(--accent) 16%,transparent), transparent 80%); box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.sz-opt.on b{color:var(--accent)}
.sz-facts{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--ink3); margin-top:6px}
.sz-log{padding:14px 22px; font-size:14px}
/* inputs in one row */
.sz-inputs .card-b{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:22px; padding:20px 22px}
.sz-inputs .f{display:flex; flex-direction:column; gap:8px}
.sz-hint{text-transform:none; letter-spacing:0; font-weight:500; color:var(--ink2)}
.sz-quick{display:flex; flex-wrap:wrap; gap:6px}

<script>
/* =====================================================================
   LVDHTC TRADING JOURNAL — shared engine
   Every design ships this file unchanged. A design sets window.DESIGN
   before it loads and may redefine view functions after it; nothing in
   the data layer below knows or cares which design is wearing it.
   ===================================================================== */
const BRAND = 'LVDHTC';
const DESIGN = Object.assign({ theme: null, demo: true, chart: { fill: true, width: 2, fillOpacity: 0.22 } }, window.DESIGN || {});
DESIGN.chart = Object.assign({ fill: true, width: 2, fillOpacity: 0.22 }, (window.DESIGN || {}).chart || {});

/* =====================================================================
   (previous header)
   ---------------------------------------------------------------------
   The file is laid out in layers so it is easy to keep changing:
     1. DATA LAYER  — storage, migrations, charts, cloud sync, backup.
                      Lifted verbatim from the previous version. Changing
                      anything here changes how your trades are stored.
     2. STATS       — pure functions: trades in, numbers out.
     3. UI KIT      — icons, formatting, count-up, charts, controls.
     4. VIEWS       — Overview · Journal · Edge · Data.
     5. SHEET       — log / edit / detail.
     6. BOOT        — routing, keyboard, theme, start-up.
   ===================================================================== */

/* =====================================================================
   1. DATA LAYER
   ===================================================================== */
const KEY = 'htc.v2';
const CCY = { symbol: '$', name: 'USD' };
const BIASES = ['Bullish · expanding', 'Bullish · choppy', 'Bearish · expanding', 'Bearish · choppy', 'Range-bound', 'Low TF reversal'];
const TFS = ['15m', '5m'];
const CONT_TYPES = ['Reversion to EQ', 'Continuation out of EQ', 'Premature continuation'];

/* Times are New York, so the session can be read off the clock. */
function sessionOf(time) {
  if (!time) return null;
  const [h, m] = time.split(':').map(Number);
  const mins = h * 60 + m;
  if (mins >= 570 && mins < 960) return 'New York';
  if (mins >= 180 && mins < 570) return 'London';
  return 'Asia';
}
const tfFor = session => session === 'New York' ? '5m' : '15m';
const biasShort = b => b === 'Range-bound' ? 'Range' : b === 'Low TF reversal' ? 'LTF rev' : (b || '').replace('Bullish', 'Bull').replace('Bearish', 'Bear');

let trades = [];
let theme = 'system';
let editing = null;
let F = { bias: '', type: '', dir: '', from: '', to: '' };

try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const d = JSON.parse(raw); trades = d.trades || []; theme = d.theme || 'system'; }
} catch (e) { /* private window or blocked storage — runs in memory */ }

/* Older versions stored prices, then R. Carry whatever result a record has into
   `profit` so nothing logged is lost. Numbers that were R read as money now. */
trades.forEach(t => {
  if (t.profit !== undefined) return;
  if (t.r !== undefined) { t.profit = t.r; delete t.r; return; }
  const risk = Math.abs(t.entry - t.stop);
  t.profit = (risk && t.exit !== null && t.exit !== undefined)
    ? +(((t.exit - t.entry) * (t.direction === 'long' ? 1 : -1)) / risk).toFixed(2) : null;
  ['entry', 'stop', 'exit', 'pdh', 'pdl'].forEach(k => delete t[k]);
  if (t.session && !t.time) t.time = t.session === 'New York' ? '09:45' : t.session === 'London' ? '04:30' : '21:00';
  delete t.session;
});
/* NEVER change KEY — the trades live under it. A new key reads as an empty journal. */
let SAVE_ERR = null, LAST_BACKUP = null, LAST_BACKUP_N = 0;
try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); LAST_BACKUP = d.lastBackup || null; LAST_BACKUP_N = d.lastBackupN || 0; } catch (e) {}

/* Write, then read back and compare. A silent failed write is the one bug that
   actually loses a journal, so it is never swallowed. */
function save() {
  const payload = JSON.stringify({ trades, theme, lastBackup: LAST_BACKUP, lastBackupN: LAST_BACKUP_N });
  try {
    const prior = localStorage.getItem(KEY);
    if (prior) localStorage.setItem(KEY + '.prev', prior);   // one step back, in case a write goes wrong
    localStorage.setItem(KEY, payload);
    if (localStorage.getItem(KEY) !== payload) throw new Error('the browser did not keep the write');
    if (SAVE_ERR) { SAVE_ERR = null; render(); }
    scheduleSync();
    return true;
  } catch (e) {
    SAVE_ERR = /quota/i.test(e.name + e.message) ? 'This browser is out of storage space.' : (e.message || 'Storage is unavailable in this browser.');
    renderAlert();
    return false;
  }
}
function renderAlert() {
  const host = document.getElementById('alert');
  if (!host) return;
  host.innerHTML = SAVE_ERR ? `<div class="alert bad"><div><b>That did not save.</b>${esc(SAVE_ERR)}
    Copy a backup now from the Data panel before you close this tab — what is on screen is all there is.</div></div>` : '';
}

/* Ask the browser not to evict this journal when disk runs low. */
let STORAGE = { persisted: null, usage: null, quota: null };
async function checkStorage(ask) {
  try {
    if (navigator.storage?.persisted) {
      STORAGE.persisted = await navigator.storage.persisted();
      if (!STORAGE.persisted && ask && navigator.storage.persist) STORAGE.persisted = await navigator.storage.persist();
    }
    if (navigator.storage?.estimate) {
      const e = await navigator.storage.estimate();
      STORAGE.usage = e.usage; STORAGE.quota = e.quota;
    }
  } catch (e) { /* not supported — the status panel says so */ }
}
/* ---------------------------------------------------------------
   Cloud mirror. localStorage stays the primary store — instant, offline,
   the thing the app reads. Every change is pushed to the artifact's `db`
   in the background, charts to the `assets` store. If this browser ever
   loses its data, the journal adopts whatever the cloud holds on open.
   Nothing here is on the critical path: if the capability is absent the
   app behaves exactly as before.
   --------------------------------------------------------------- */
let SYNC = { state: 'checking', at: null, msg: '' };
const PENDING_DELETES = new Set();
let _cap = {};
async function cap(name) {
  if (name in _cap) return _cap[name];
  try { _cap[name] = window.claude?.use ? await window.claude.use(name) : null; }
  catch (e) { _cap[name] = null; }
  return _cap[name];
}
const unsynced = () => PENDING_DELETES.size > 0 || trades.some(t => t.synced !== t.updatedAt);
let pushTimer = null;
function scheduleSync() {
  if (SYNC.state === 'off' || !unsynced()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(syncPush, 1500);
}
async function syncPush(manual) {
  const db = await cap('db');
  if (!db) { SYNC = { state: 'off' }; return paintSync(); }
  if (SYNC.state === 'syncing') return;
  if (!manual && !unsynced()) return;
  SYNC = { state: 'syncing', at: SYNC.at }; paintSync();
  try {
    const assets = await cap('assets');
    for (const id of Array.from(PENDING_DELETES)) {
      await db.doc('trades/' + id).delete();
      PENDING_DELETES.delete(id);
    }
    for (const t of trades) {
      if (t.synced === t.updatedAt) continue;
      if (t.shot && !t.asset && assets) {
        const b = await getShot(t.id);
        if (b) { try { t.asset = (await assets.upload(b, { type: 'image/jpeg' })).id; } catch (e) { /* chart stays local-only */ } }
      }
      const body = Object.assign({}, t); delete body.synced;
      await db.doc('trades/' + t.id).set(body);
      t.synced = t.updatedAt;
    }
    SYNC = { state: 'ok', at: new Date().toISOString() };
    save();
  } catch (e) {
    SYNC = { state: 'error', at: SYNC.at, msg: e?.code === 'quota_exceeded' ? 'the cloud store is full' : (e?.message || 'the sync did not go through') };
  }
  paintSync();
  if (manual) render();
}
async function syncPull(manual) {
  const db = await cap('db');
  if (!db) { SYNC = { state: 'off' }; paintSync(); if (manual) toast('Cloud backup is not available in this view'); return 0; }
  try {
    const snap = await db.collection('trades').limit(1000).get();
    const remote = snap.docs.map(d => d.data()).filter(d => d && d.id);
    const have = new Set(trades.map(t => String(t.id)));
    const fresh = remote.filter(r => !have.has(String(r.id)));
    if (!fresh.length) { if (manual) toast(remote.length ? 'Already up to date' : 'Nothing in the cloud backup yet'); return 0; }
    trades = trades.concat(fresh.map(r => Object.assign({}, r, { synced: r.updatedAt })));
    save(); render();
    if (manual) toast(`Pulled ${fresh.length} trade${fresh.length === 1 ? '' : 's'} back from the cloud`);
    return fresh.length;
  } catch (e) { if (manual) toast('Could not reach the cloud backup'); return 0; }
}
function paintSync() {
  document.querySelectorAll('[data-sync]').forEach(d => { d.className = 'syncdot ' + ({ ok: 'ok', syncing: 'busy', error: 'err' }[SYNC.state] || ''); d.title = 'Cloud backup: ' + SYNC.state; });
  const lab = document.getElementById('syncLabel');
  if (lab) lab.textContent = { ok: 'Backed up', syncing: 'Syncing…', error: 'Sync failed', off: 'This browser only', checking: 'Checking…' }[SYNC.state] || '';
  const el = document.getElementById('syncState');
  if (!el) return;
  const m = {
    checking: ['Checking…', 'var(--ink2)', 'asking the viewer'],
    off: ['Not available', 'var(--ink2)', 'this view cannot reach it'],
    syncing: ['Syncing…', 'var(--accent)', 'sending changes'],
    ok: ['On', 'var(--pos)', SYNC.at ? 'last synced ' + new Date(SYNC.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : 'up to date'],
    error: ['Failed', 'var(--warn)', SYNC.msg || 'will retry on the next change']
  }[SYNC.state] || ['Unknown', 'var(--ink2)', ''];
  el.innerHTML = `<span style="color:${m[1]}">${esc(m[0])}</span><small>${esc(m[2])}</small>`;
}

const mb = n => n === null || n === undefined ? '—' : n >= 1073741824 ? (n / 1073741824).toFixed(1) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const ago = iso => {
  if (!iso) return 'never';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago';
};

/* ---------------------------------------------------------------
   Screenshots live in IndexedDB, not localStorage. Charts are far too
   big for a 5MB string store — this keeps the trade records tiny and
   gives the images room. Only a `shot: true` flag is kept on the trade.
   --------------------------------------------------------------- */
const SHOT_DB = 'htc.shots';
let _db = null;
function db() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open(SHOT_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('shots');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
async function putShot(id, blob) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction('shots', 'readwrite');
    tx.objectStore('shots').put(blob, String(id));
    tx.oncomplete = () => res(true); tx.onerror = () => rej(tx.error);
  });
}
async function getShot(id) {
  try {
    const d = await db();
    return await new Promise(res => {
      const tx = d.transaction('shots', 'readonly');
      const rq = tx.objectStore('shots').get(String(id));
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function dropShot(id) {
  try {
    const d = await db();
    await new Promise(res => {
      const tx = d.transaction('shots', 'readwrite');
      tx.objectStore('shots').delete(String(id));
      tx.oncomplete = res; tx.onerror = res;
    });
  } catch (e) {}
  const u = SHOT_URL.get(String(id));
  if (u) { URL.revokeObjectURL(u); SHOT_URL.delete(String(id)); }
}
const SHOT_URL = new Map();
async function shotURL(id) {
  const k = String(id);
  if (SHOT_URL.has(k)) return SHOT_URL.get(k);
  const b = await getShot(k);
  if (!b) return null;
  const u = URL.createObjectURL(b);
  SHOT_URL.set(k, u);
  return u;
}
/* fill every <img data-shot="id"> once the blobs come back */
async function paintShots() {
  for (const el of document.querySelectorAll('img[data-shot]')) {
    const id = el.dataset.shot;
    const u = await shotURL(id);
    if (u) { el.src = u; continue; }
    const t = trades.find(x => String(x.id) === String(id));
    if (t && t.asset) { el.src = '/_blob/' + t.asset; continue; }   // recovered browser: serve it from the cloud
    el.closest('.thumb, .shotbox, .shot-card')?.remove();
  }
  if (ED.shotPending) {
    const img = document.getElementById('shotPreview');
    if (img) img.src = PENDING_URL;
  }
}
/* scale down before storing — a full-res chart is megabytes for no gain */
function processImage(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600, sc = Math.min(1, max / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? res(b) : rej(new Error('could not encode')), 'image/jpeg', 0.82);
      };
      img.onerror = () => rej(new Error('that file is not an image'));
      img.src = fr.result;
    };
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sign = n => n > 0 ? '+' : n < 0 ? '−' : '';
const amt = (n, dp) => CCY.symbol + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: dp === undefined ? 2 : dp });
const money = (n, dp) => sign(n) + amt(n, dp);
const today = () => new Date().toISOString().slice(0, 10);
const dshow = s => { const d = new Date(s + 'T12:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
const pOf = t => (t.profit === null || t.profit === undefined || t.profit === '') ? null : +t.profit;
const isClosed = t => pOf(t) !== null;

/* ---------------- data out ---------------- */
function csv() {
  const cols = ['date', 'time', 'session', 'direction', 'bias', 'timeframe', 'continuation', 'confirmed', 'profit', 'chart', 'notes'];
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = trades.slice().sort((a, b) => a.date.localeCompare(b.date)).map(t =>
    [t.date, t.time, sessionOf(t.time), t.direction, t.bias, t.tf, t.type, t.confirmed ? 'yes' : 'no', pOf(t) ?? '', t.shot ? 'yes' : 'no', t.notes].map(q).join(','));
  return cols.join(',') + '\n' + rows.join('\n');
}
/* ---------------- backup & restore ----------------
   Charts are blobs in IndexedDB, so a text-only backup silently leaves them
   behind. The full backup inlines them as base64 and restore puts them back. */
const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
function dataURLtoBlob(u) {
  const [head, b64] = u.split(',');
  const mime = (head.match(/:(.*?);/) || [, 'image/jpeg'])[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function buildBackup(withShots) {
  const out = { format: 'htc-journal', version: 2, exported: new Date().toISOString(), trades };
  if (withShots) {
    out.shots = {};
    for (const t of trades.filter(t => t.shot)) {
      const b = await getShot(t.id);
      if (b) out.shots[t.id] = await blobToDataURL(b);
    }
  }
  return JSON.stringify(out);
}
async function copyBackup(withShots) {
  const btnText = withShots ? 'Backup with charts' : 'Backup';
  let text;
  try { text = await buildBackup(withShots); }
  catch (e) { return toast('Could not build the backup'); }
  const box = document.getElementById('backupBox');
  if (box) { box.value = text; box.hidden = false; }
  try {
    await navigator.clipboard.writeText(text);
    LAST_BACKUP = new Date().toISOString(); LAST_BACKUP_N = trades.length; save();
    render();
    toast(`${btnText} copied — ${mb(text.length)}. Paste it somewhere safe.`);
  } catch (e) {
    if (box) { box.focus(); box.select(); }
    toast('Clipboard blocked — the backup is in the box below, select it and copy');
  }
}
async function restoreBackup() {
  const box = document.getElementById('restoreBox');
  const text = (box?.value || '').trim();
  if (!text) return toast('Paste a backup into the box first');
  let d;
  try { d = JSON.parse(text); } catch (e) { return toast('That is not valid JSON'); }
  if (!d || !Array.isArray(d.trades)) return toast('No trades found in that backup');
  const prev = trades.slice();
  trades = d.trades.map(t => Object.assign({}, t, { updatedAt: Date.now(), synced: null }));
  if (!save()) { trades = prev; return toast('Restore failed — nothing was changed'); }
  let shots = 0;
  for (const [id, url] of Object.entries(d.shots || {})) {
    try { await putShot(id, dataURLtoBlob(url)); shots++; } catch (e) {}
  }
  SHOT_URL.forEach(u => URL.revokeObjectURL(u)); SHOT_URL.clear();
  editing = null; ED = DEFAULTS();
  render();
  toast(`Restored ${trades.length} trades${shots ? ` and ${shots} charts` : ''}`, 'Undo', () => { trades = prev; save(); render(); });
}

async function askPersist() { await checkStorage(true); render(); toast(STORAGE.persisted ? 'The browser will keep this journal' : 'The browser declined — keep taking backups'); }
async function copyOut(text, what) {
  try { await navigator.clipboard.writeText(text); toast(what + ' copied to clipboard'); }
  catch (e) { toast('Could not reach the clipboard'); }
}
function wipe() {
  if (!confirm('Delete every trade and chart in this journal? Take a backup first if you have not.')) return;
  const prev = trades.slice();
  prev.forEach(t => PENDING_DELETES.add(String(t.id)));
  trades = []; editing = null; ED = DEFAULTS(); save(); render();
  toast('All trades deleted', 'Undo', () => { PENDING_DELETES.clear(); trades = prev; trades.forEach(t => t.synced = null); save(); render(); });
}

/* =====================================================================
   2. STATS — pure functions: trades in, numbers out. Nothing here
      touches the page, so any view can reuse them.
   ===================================================================== */
/* The sequence trades are counted in: the order they were logged (first upload → most recent),
   unless Luca has arranged them by hand — then a trade carries an `order` key that takes the
   place of its log moment. New trades always land at the end. */
/* a trade's New York clock time in minutes (9:35 and 09:35 agree); null when it has none */
const clockMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t.time || ''); return m ? +m[1] * 60 + +m[2] : null; };
const seqKey = t => (t.order !== undefined && t.order !== null) ? +t.order : +t.id;
const byTime = (a, b) => seqKey(a) - seqKey(b) || a.id - b.id;
const closedOf = list => list.filter(isClosed).sort(byTime);
const sum = a => a.reduce((x, y) => x + y, 0);
const hourOf = t => t && t.time ? +t.time.slice(0, 2) : null;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

function summarise(list) {
  const cl = closedOf(list), P = cl.map(pOf);
  const wins = P.filter(p => p > 0), losses = P.filter(p => p < 0);
  const total = sum(P), gw = sum(wins), gl = Math.abs(sum(losses));
  let peak = 0, eq = 0, dd = 0, lr = 0, wr = 0, worstRun = 0, bestRun = 0;
  const under = [];
  P.forEach(p => {
    eq += p; peak = Math.max(peak, eq); dd = Math.min(dd, eq - peak); under.push(eq - peak);
    if (p < 0) { lr++; wr = 0; worstRun = Math.max(worstRun, lr); }
    else if (p > 0) { wr++; lr = 0; bestRun = Math.max(bestRun, wr); }
    /* break even: neutral — a run continues through it */
  });
  let streak = 0, kind = null;                         // current run, read backwards from the latest trade
  for (let i = P.length - 1; i >= 0; i--) {
    const k = P[i] > 0 ? 'W' : P[i] < 0 ? 'L' : null;
    if (!k) continue;                                  // break-evens don't end a streak
    if (kind && k !== kind) break;
    kind = k; streak++;
  }
  return {
    n: cl.length, open: list.length - cl.length, cl, P, total, under,
    wins: wins.length, losses: losses.length, be: cl.length - wins.length - losses.length,
    winRate: wins.length + losses.length ? wins.length / (wins.length + losses.length) : 0,   // of trades that won or lost
    avg: cl.length ? total / cl.length : 0,
    avgWin: wins.length ? gw / wins.length : 0, avgLoss: losses.length ? -gl / losses.length : 0,
    pf: gl > 0 ? gw / gl : (gw > 0 ? Infinity : 0),
    dd, worstRun, bestRun, streak, streakKind: kind
  };
}

/* ranges count back from the newest trade, not from today — a quiet week
   should not empty the screen */
const RANGES = [['7D', 7], ['30D', 30], ['90D', 90], ['All', Infinity]];
function inRange(list, label) {
  const days = (RANGES.find(r => r[0] === label) || RANGES[3])[1];
  if (days === Infinity || !list.length) return list;
  const newest = list.reduce((m, t) => t.date > m ? t.date : m, '');
  const cut = new Date(newest + 'T12:00'); cut.setDate(cut.getDate() - (days - 1));
  const c = ymd(cut);
  return list.filter(t => t.date >= c);
}

function groupStats(list, keyFn) {
  const m = new Map();
  closedOf(list).forEach(t => {
    const k = keyFn(t);
    if (k === null || k === undefined || k === '') return;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  });
  return Array.from(m, ([key, ts]) => ({ key, ts, s: summarise(ts) }));
}

/* how much a number can be trusted — shown next to every read */
const confidence = n => n >= 15 ? ['reliable', 'good'] : n >= 5 ? ['early read', 'mid'] : ['too early', ''];

function rolling(P, w) {
  return P.map((_, i) => { const s = P.slice(Math.max(0, i - w + 1), i + 1); return sum(s) / s.length; });
}

const BIAS_SHORT = { 'Bullish · expanding': 'Bull · exp', 'Bullish · choppy': 'Bull · chop', 'Bearish · expanding': 'Bear · exp', 'Bearish · choppy': 'Bear · chop', 'Range-bound': 'Range', 'Low TF reversal': 'LTF rev' };
const biasPhrase = b => b === 'Range-bound' ? 'a range-bound market' : b === 'Low TF reversal' ? 'a low-timeframe reversal' : 'a ' + (b || '').toLowerCase().replace(' · ', ', ') + ' trend';

/* plain-language reads on where the money comes from and where it leaks */
function insights(list) {
  const S = summarise(list), out = [];
  if (S.n < 5) return [{ kind: 'start', label: 'First read', dot: 'var(--accent)',
    text: `Your first read on the edge appears at <b>5 closed trades</b>. ${S.n ? `${5 - S.n} to go.` : 'Log the next one to start.'}`, fig: `${S.n}/5`, n: S.n }];

  const cells = groupStats(list, t => (t.type && t.bias) ? t.type + '|' + t.bias : null).filter(c => c.s.n >= 3);
  const best = cells.filter(c => c.s.avg > 0).sort((a, b) => b.s.avg - a.s.avg)[0];
  if (best) {
    const [ty, bi] = best.key.split('|');
    out.push({ kind: 'edge', label: 'Edge', dot: 'var(--up)', n: best.s.n, fig: money(best.s.avg, 0), cls: 'up',
      text: `<b>${esc(ty)}</b> in ${esc(biasPhrase(bi))} is where you make money — ${Math.round(best.s.winRate * 100)}% win rate.`,
      filter: { type: ty, bias: bi } });
  }

  const cands = [
    ...cells.map(c => { const [ty, bi] = c.key.split('|'); return { ...c, name: `${ty} in ${biasPhrase(bi)}`, filter: { type: ty, bias: bi } }; }),
    ...groupStats(list, t => t.type).filter(c => c.s.n >= 3).map(c => ({ ...c, name: c.key + 's', filter: { type: c.key } })),
    ...groupStats(list, t => t.bias).filter(c => c.s.n >= 3).map(c => ({ ...c, name: 'Trades in ' + biasPhrase(c.key), filter: { bias: c.key } }))
  ].filter(c => c.s.total < 0).sort((a, b) => a.s.total - b.s.total);
  const leak = cands[0];
  if (leak) out.push({ kind: 'leak', label: 'Leak', dot: 'var(--down)', n: leak.s.n, fig: money(leak.s.avg, 0), cls: 'down',
    text: `<b>${esc(leak.name)}</b> cost you ${amt(leak.s.total, 0)}. Skipping them would have put you <b>${money(S.total - leak.s.total, 0)}</b> instead of ${money(S.total, 0)}.`,
    filter: leak.filter });

  const w = summarise(list.filter(t => t.confirmed)), nw = summarise(list.filter(t => !t.confirmed));
  if (w.n >= 3 && nw.n >= 3) {
    const d = w.avg - nw.avg;
    out.push({ kind: 'disc', label: 'Discipline', dot: 'var(--accent)', n: Math.min(w.n, nw.n), fig: money(d, 0), cls: d >= 0 ? 'up' : 'down',
      text: d >= 0 ? `Waiting for the failure swing to confirm is worth <b>${amt(d, 0)} a trade</b> over entering early.`
                   : `Entering before confirmation is currently doing better by ${amt(d, 0)} a trade — worth a close look before trusting it.`,
      filter: { conf: 'no' } });
  }

  const hrs = groupStats(list, hourOf).filter(c => c.s.n >= 3).sort((a, b) => b.s.avg - a.s.avg);
  if (hrs.length >= 2) {
    const h = hrs[0], hh = String(h.key).padStart(2, '0');
    out.push({ kind: 'time', label: 'Timing', dot: 'var(--ink2)', n: h.s.n, fig: money(h.s.avg, 0), cls: h.s.avg >= 0 ? 'up' : 'down',
      text: `Your best hour is <b>${hh}:00–${hh}:59 New York</b>, ${Math.round(h.s.winRate * 100)}% of those trades won.`,
      filter: { hour: h.key } });
  }
  if (!out.length) out.push({ kind: 'none', label: 'Still forming', dot: 'var(--ink3)', n: S.n, fig: '—',
    text: 'No setup has three closed trades yet, so there is no honest edge or leak to call. Keep tagging bias and continuation on every trade.' });
  return out;
}

/* what-if: every trade carries the keys you can switch off */
const wiKeys = t => ['type:' + t.type, 'bias:' + t.bias, 'cell:' + t.type + '|' + t.bias, t.confirmed ? '' : 'conf:no', 'hour:' + hourOf(t), 'side:' + t.direction];
const whatIf = (list, off) => off.size ? list.filter(t => !wiKeys(t).some(k => off.has(k))) : list;
