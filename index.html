<script>
/* If the journal has not drawn itself after a few seconds, say so in plain view, with the
   reason — a phone has no console to look in. Written for the oldest browsers on purpose. */
(function () {
  var errs = [];
  window.addEventListener('error', function (e) { if (e && e.message) errs.push(e.message + (e.lineno ? ' (line ' + e.lineno + ')' : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + (e && e.reason && (e.reason.message || e.reason))); });
  setTimeout(function () {
    var v = document.getElementById('view');
    if (v && v.childElementCount > 0) return;
    var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#0A1412;color:#E6F2EE;font:16px/1.5 -apple-system,system-ui,sans-serif;padding:64px 22px 40px;overflow:auto');
    d.innerHTML = '<b style="font-size:21px">HTC Vault could not start on this device</b>'
      + '<p style="color:#9DB5AE">Your trades are not affected. Send Claude a screenshot of this screen.</p>'
      + '<pre style="white-space:pre-wrap;word-break:break-word;font-size:13px;color:#FFCB9A">' + esc(errs.length ? errs.slice(0, 6).join('\n') : 'no script error was reported')
      + '\n\nbuild 202610012123\n' + esc(navigator.userAgent) + '</pre>';
    (document.body || document.documentElement).appendChild(d);
  }, 9000);
})();
</script>

<style>
/* ================================================================
   TOKENS — "the tape": warm ink, hairlines, amber for "you are here".
   Green / red are outcome colours only, never decoration.
   ================================================================ */
:root{
  color-scheme: light;
  --ground:#F3F3F0; --surface:#FBFBF9; --raised:#FFFFFF; --sunken:#E9E9E5;
  --ink:#161613; --ink2:#595750; --ink3:#8B8980;
  --accent:#A5670E; --accent-ink:#FFFFFF;
  --up:#1D8757; --down:#C23A30;
  --hair:color-mix(in srgb,var(--ink) 9%,transparent);
  --hair2:color-mix(in srgb,var(--ink) 16%,transparent);
  --wash:color-mix(in srgb,var(--ink) 4%,transparent);
  --lift:0 1px 0 color-mix(in srgb,var(--ink) 5%,transparent), 0 18px 40px -24px color-mix(in srgb,var(--ink) 28%,transparent);
  --scrim:rgba(20,20,17,.34);
  --f-ui:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Martian Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --r-card:14px; --r-ctl:8px; --r-cell:4px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#0D0D0B; --surface:#141412; --raised:#1B1B18; --sunken:#090908;
  --ink:#ECEAE3; --ink2:#A19E94; --ink3:#6B695F;
  --accent:#E3A042; --accent-ink:#1A1204;
  --up:#4CC38A; --down:#E8665B;
  --lift:0 1px 0 rgba(255,255,255,.03), 0 24px 48px -28px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.56);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0D0D0B; --surface:#141412; --raised:#1B1B18; --sunken:#090908;
  --ink:#ECEAE3; --ink2:#A19E94; --ink3:#6B695F;
  --accent:#E3A042; --accent-ink:#1A1204;
  --up:#4CC38A; --down:#E8665B;
  --lift:0 1px 0 rgba(255,255,255,.03), 0 24px 48px -28px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.56);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.018em; text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.n{font-family:var(--f-num); font-variant-numeric:tabular-nums; font-stretch:87.5%; letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink2)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.label{font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
svg.i{width:16px; height:16px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}

/* ================================================================
   SHELL — left rail on desktop, bottom tabs on phones
   ================================================================ */
.shell{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100%}
.rail{position:sticky; top:0; height:100vh; height:100dvh; display:flex; flex-direction:column; gap:22px;
  padding:22px 14px 18px; border-right:1px solid var(--hair); background:var(--ground)}
.mark{display:flex; align-items:center; gap:10px; padding:0 8px}
.mark b{font-family:var(--f-num); font-stretch:112.5%; font-weight:650; font-size:15px; letter-spacing:.02em}
.mark span{font-size:11px; color:var(--ink3); letter-spacing:.02em}
.nav{display:flex; flex-direction:column; gap:2px; position:relative}
.main-col{min-width:0}
.nav a{display:flex; align-items:center; gap:11px; height:38px; padding:0 10px; border-radius:var(--r-ctl); color:var(--ink2);
  text-decoration:none; font-size:13.5px; font-weight:500; position:relative; z-index:1;
  transition:color .2s var(--ease)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a kbd{margin-left:auto; font-family:var(--f-num); font-size:10px; color:var(--ink3); opacity:0; transition:opacity .2s}
.nav:hover a kbd{opacity:1}
.nav .pill{position:absolute; top:0; left:0; right:0; height:38px; border-radius:var(--r-ctl); background:var(--wash);
  box-shadow:inset 0 0 0 1px var(--hair); transition:transform .38s var(--ease); z-index:0}
.nav .pill::before{content:''; position:absolute; left:-14px; top:10px; bottom:10px; width:2px; border-radius:2px; background:var(--accent)}
.rail .grow{flex:1}
.logbtn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px 12px; border:0;
  border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:650; font-size:13.5px;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 8px 20px -10px color-mix(in srgb,var(--accent) 80%,transparent);
  transition:transform .18s var(--ease), filter .18s}
.logbtn:hover{filter:brightness(1.07)} .logbtn:active{transform:translateY(1px) scale(.99)}
.logbtn kbd{font-family:var(--f-num); font-size:10.5px; opacity:.7; font-weight:500}
.railfoot{display:flex; align-items:center; gap:8px; padding:0 4px; font-size:11.5px; color:var(--ink3)}
.syncdot{width:7px; height:7px; border-radius:50%; background:var(--ink3); flex:0 0 auto}
.syncdot.ok{background:var(--up)} .syncdot.busy{background:var(--accent); animation:pulse 1s infinite}
.syncdot.err{background:var(--down)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{appearance:none; border:0; background:none; width:30px; height:30px; display:grid; place-items:center;
  border-radius:var(--r-ctl); color:var(--ink2); transition:background .15s, color .15s}
.iconbtn:hover{background:var(--wash); color:var(--ink)}

.topbar{display:none}
.tabs{display:none}
main{min-width:0; padding:28px clamp(16px,3.4vw,44px) 96px}
.view{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex; align-items:center; gap:10px; position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    padding:12px 16px; background:color-mix(in srgb,var(--ground) 86%,transparent); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--hair)}
  .topbar .grow{flex:1}
  .topbar .logbtn{width:auto; padding:8px 13px; font-size:13px}
  .topbar .logbtn kbd{display:none}
  main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid; grid-template-columns:repeat(6,1fr); position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); background:color-mix(in srgb,var(--surface) 92%,transparent);
    backdrop-filter:blur(16px); border-top:1px solid var(--hair)}
  .tabs a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 5px; color:var(--ink3);
    text-decoration:none; font-size:10.5px; font-weight:600; border-radius:10px}
  .tabs a[aria-current="page"]{color:var(--ink); background:var(--wash)}
  .tabs a[aria-current="page"] svg{stroke:var(--accent)}
}

/* ================================================================
   PRIMITIVES
   ================================================================ */
.head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
.head h1{font-size:clamp(21px,2.4vw,26px)}
.head p{color:var(--ink2); font-size:13px; margin-top:3px; max-width:62ch}
.head .grow{flex:1}

.card{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r-card); box-shadow:var(--lift); min-width:0}
.card-h{display:flex; align-items:baseline; gap:12px; padding:15px 18px 0; min-height:36px}
.card-h h2{font-size:14px; font-weight:650; letter-spacing:-.01em}
.card-h .read{margin-left:auto; font-size:11.5px; color:var(--ink3); text-align:right; min-height:18px}
.card-h .read b{color:var(--ink); font-weight:600}
.card-b{padding:14px 18px 18px}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.grow{flex:1}
.cols{display:grid; gap:18px; grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){ .cols.c-cal{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} .cols.c-2{grid-template-columns:1fr 1fr} }
@media (min-width:720px) and (max-width:1079px){ .cols.c-2{grid-template-columns:1fr 1fr} }

.btn{appearance:none; display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:var(--r-ctl);
  border:1px solid var(--hair2); background:var(--raised); color:var(--ink); font-size:13px; font-weight:550; white-space:nowrap;
  transition:border-color .15s, background .15s, transform .15s var(--ease)}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--wash); color:var(--ink)}
.btn.danger{color:var(--down)}
.btn.sm{padding:5px 10px; font-size:12px}
.link{appearance:none; border:0; background:none; padding:0; color:var(--ink2); font-size:12px; font-weight:550;
  display:inline-flex; align-items:center; gap:4px; transition:color .15s}
.link:hover{color:var(--accent)}

/* segmented control — equal segments, the indicator slides on --i */
.seg{--n:3; --i:0; position:relative; display:inline-grid; grid-auto-flow:column; grid-auto-columns:1fr;
  padding:3px; border-radius:999px; background:var(--wash); box-shadow:inset 0 0 0 1px var(--hair)}
.seg::before{content:''; position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n));
  border-radius:999px; background:var(--raised); box-shadow:0 1px 2px rgba(0,0,0,.14), inset 0 0 0 1px var(--hair);
  transform:translateX(calc(var(--i) * 100%)); transition:transform .34s var(--ease)}
.seg button{appearance:none; position:relative; z-index:1; border:0; background:none; padding:5px 12px; min-width:44px;
  font-size:12px; font-weight:600; color:var(--ink3); border-radius:999px; transition:color .2s; font-family:var(--f-num); font-stretch:87.5%}
.seg button[aria-checked="true"]{color:var(--ink)}
.seg.lg{border-radius:10px} .seg.lg::before{border-radius:7px}
.seg.lg button{font-family:var(--f-ui); font-stretch:normal; font-size:13px; padding:8px 12px; border-radius:7px}
.seg.sidepick button[aria-checked="true"][data-v="long"]{color:var(--up)}
.seg.sidepick button[aria-checked="true"][data-v="short"]{color:var(--down)}
.seg.outcome button[aria-checked="true"][data-v="win"]{color:var(--up)}
.seg.outcome button[aria-checked="true"][data-v="loss"]{color:var(--down)}
.seg.outcome button[aria-checked="true"][data-v="be"]{color:var(--accent)}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{appearance:none; display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px;
  border:1px solid var(--hair2); background:transparent; color:var(--ink2); font-size:12.5px; font-weight:550;
  transition:all .18s var(--ease)}
.chip:hover{color:var(--ink); border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
.chip.off[aria-pressed="true"]{background:transparent; color:var(--ink3); border-style:dashed; text-decoration:line-through;
  text-decoration-color:color-mix(in srgb,var(--down) 70%,transparent)}
.chip small{font-family:var(--f-num); font-stretch:87.5%; font-size:10.5px; opacity:.7}
.chip .x{opacity:.6}

.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 8px 2px 7px; border-radius:999px; font-size:10.5px;
  font-weight:600; border:1px solid transparent; line-height:1.6; white-space:nowrap}
.pill.win{color:var(--up); background:color-mix(in srgb,var(--up) 11%,transparent); border-color:color-mix(in srgb,var(--up) 24%,transparent)}
.pill.loss{color:var(--down); background:color-mix(in srgb,var(--down) 11%,transparent); border-color:color-mix(in srgb,var(--down) 24%,transparent)}
.pill.be{color:var(--accent); background:color-mix(in srgb,var(--accent) 11%,transparent); border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.pill.open{color:var(--ink2); background:var(--wash); border-color:var(--hair)}
.pill.open i{width:5px; height:5px; border-radius:50%; background:var(--accent); display:inline-block}
.pill svg{width:10px; height:10px; stroke-width:3}
.side{display:inline-block; padding:1px 6px; border-radius:6px; font-size:10.5px; font-weight:650; letter-spacing:.02em; text-transform:uppercase}
.side.long{color:var(--up); background:color-mix(in srgb,var(--up) 11%,transparent)}
.side.short{color:var(--down); background:color-mix(in srgb,var(--down) 11%,transparent)}
.conf{display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%}
.conf.yes{color:var(--up); background:color-mix(in srgb,var(--up) 13%,transparent)}
.conf.no{color:var(--ink3); background:var(--wash)}
.conf svg{width:10px; height:10px; stroke-width:3}
.tag{font-size:10.5px; font-weight:600; color:var(--ink3); padding:1px 7px; border-radius:999px; border:1px solid var(--hair)}
.tag.good{color:var(--up); border-color:color-mix(in srgb,var(--up) 30%,transparent)}
.tag.mid{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 34%,transparent)}

/* ================================================================
   OVERVIEW — hero, KPIs, equity chart
   ================================================================ */
.hero{padding:20px 20px 12px}
.hero-top{display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap}
.big{font-family:var(--f-num); font-stretch:112.5%; font-weight:560; font-size:clamp(34px,5.4vw,56px); line-height:1;
  letter-spacing:-.045em; font-variant-numeric:tabular-nums; margin-top:8px}
.hero-sub{margin-top:10px; font-size:12.5px; color:var(--ink2); display:flex; gap:14px; flex-wrap:wrap; min-height:19px}
.hero-sub .n{color:var(--ink)}
.hero-sub .sep{color:var(--ink3)}
.chart{position:relative; margin-top:14px; height:220px}
.chart svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; display:block}
.chart .ax{position:absolute; font-family:var(--f-num); font-stretch:87.5%; font-size:10px; color:var(--ink3); pointer-events:none; white-space:nowrap}
.chart .hit{position:absolute; inset:0; cursor:crosshair}
.chart.sm{height:120px; margin-top:6px}
.line-draw{stroke-dasharray:1; stroke-dashoffset:0}
.entering .line-draw{animation:draw 1.1s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}}
.wi-ghost{animation:ghostin .6s var(--ease) both}
@keyframes ghostin{from{opacity:0}}
.empty-chart{display:grid; place-items:center; height:100%; border:1px dashed var(--hair2); border-radius:10px;
  color:var(--ink3); font-size:12.5px; text-align:center; padding:16px}

.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px}
@media (max-width:820px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px} }
.kpi{padding:14px 16px 12px; display:flex; flex-direction:column; gap:3px; min-width:0}
.kpi .v{font-family:var(--f-num); font-stretch:100%; font-weight:540; font-size:22px; letter-spacing:-.035em; font-variant-numeric:tabular-nums; line-height:1.2}
.kpi .s{font-size:11.5px; color:var(--ink3)}
.kpi .s .n{color:var(--ink2)}
.kpi svg.spark{width:100%; height:26px; margin-top:6px; overflow:visible}

/* ================================================================
   CALENDAR — single hue per sign, magnitude = tint strength
   ================================================================ */
.cal{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.15fr); gap:4px}
.cal .dow{font-size:10px; color:var(--ink3); text-align:center; padding-bottom:3px; font-weight:600; letter-spacing:.06em}
.day{position:relative; aspect-ratio:1/0.86; border-radius:var(--r-cell); padding:5px 6px; display:flex; flex-direction:column;
  justify-content:space-between; min-width:0; border:0; text-align:left; background:var(--wash); color:var(--ink3);
  transition:opacity .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease)}
.day .d{font-size:10px; font-family:var(--f-num); font-stretch:87.5%}
.day .p{font-family:var(--f-num); font-stretch:75%; font-size:11px; font-weight:600; letter-spacing:-.02em; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.day.pad{background:transparent}
.day.has{cursor:pointer}
.day.has:hover,.day.has:focus-visible{box-shadow:inset 0 0 0 1.5px var(--c); transform:scale(1.04); z-index:2}
.day.today .d{color:var(--accent); font-weight:700}
.day.empty-day{cursor:pointer}
.day.empty-day:hover,.day.empty-day:focus-visible{box-shadow:inset 0 0 0 1px var(--hair2); background:color-mix(in srgb,var(--ink) 7%,transparent)}
.cal.hovering .day:not(.hot):not(.wk-hot){opacity:.34}
.wk{appearance:none; cursor:pointer; font:inherit; color:inherit; border-radius:var(--r-cell); padding:5px 7px; display:flex; flex-direction:column; justify-content:center; align-items:flex-end;
  background:transparent; border:1px dashed var(--hair); min-width:0; transition:background .15s var(--ease), border-color .15s}
.wk:hover,.wk:focus-visible{background:var(--wash); border-color:var(--hair2)}
.wk .p{font-family:var(--f-num); font-stretch:75%; font-size:11.5px; font-weight:650}
.wk .t{font-size:9.5px; color:var(--ink3)}
.entering .day,.entering .wk{animation:settle .42s var(--ease) both; animation-delay:var(--d,0ms)}
@keyframes settle{from{opacity:0; transform:scale(.72)}}
.cal-nav{display:flex; align-items:center; gap:4px; margin-left:auto}
.cal-nav b{font-size:12.5px; font-weight:600; min-width:92px; text-align:center}

/* ================================================================
   INSIGHTS
   ================================================================ */
.ins{display:flex; flex-direction:column}
.in{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; padding:14px 18px; border-top:1px solid var(--hair)}
.in:first-child{border-top:0}
.in .k{grid-column:1/-1; display:flex; align-items:center; gap:8px}
.in .k .label{font-size:10px}
.in .k i{width:6px; height:6px; border-radius:2px; display:inline-block}
.in p{font-size:13px; line-height:1.5; color:var(--ink2); max-width:48ch}
.in p b{color:var(--ink); font-weight:600}
.in .fig{font-family:var(--f-num); font-stretch:100%; font-size:17px; font-weight:560; letter-spacing:-.03em; align-self:start; text-align:right; white-space:nowrap}
.in .act{grid-column:1/-1; display:flex; gap:10px; align-items:center; margin-top:2px}
.entering .in{animation:rise .5s var(--ease) both; animation-delay:calc(var(--k,0) * 70ms + 120ms)}
@keyframes rise{from{opacity:0; transform:translateY(8px)}}

/* ================================================================
   EDGE — setup matrix, hour bars, what-if, splits
   ================================================================ */
.mx{display:grid; grid-template-columns:minmax(118px,1.1fr) repeat(var(--cols,5),minmax(0,1fr)); gap:4px}
.mx .ch{font-size:10.5px; color:var(--ink3); font-weight:600; text-align:center; padding:0 2px 4px; line-height:1.25}
.mx .rh{font-size:12.5px; color:var(--ink); display:flex; align-items:center; padding-right:8px; line-height:1.25}
.cell{border:0; border-radius:6px; padding:10px 6px; min-height:64px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; background:var(--wash); color:var(--ink); transition:opacity .2s var(--ease), box-shadow .2s, transform .2s var(--ease)}
.cell .a{font-family:var(--f-num); font-stretch:87.5%; font-size:13px; font-weight:620; letter-spacing:-.02em}
.cell .c{font-size:10px; color:var(--ink2)}
.cell.none{background:transparent; border:1px dashed var(--hair); color:var(--ink3); cursor:default}
.cell.has{cursor:pointer}
.cell.has:hover,.cell.has:focus-visible{box-shadow:inset 0 0 0 1.5px var(--c); transform:scale(1.03)}
.mx.hovering .cell:not(.hot){opacity:.36}
.entering .cell{animation:settle .45s var(--ease) both; animation-delay:var(--d,0ms)}
@media (max-width:640px){ .mx{grid-template-columns:minmax(84px,1fr) repeat(var(--cols,5),minmax(0,1fr)); gap:3px} .cell{min-height:52px; padding:7px 2px} .cell .a{font-size:11px} .mx .rh{font-size:11px} .mx .ch{font-size:9.5px} }

.hours{position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:5px; height:170px; padding-bottom:20px}
.hours .zero{position:absolute; left:0; right:0; height:1px; background:var(--hair2)}
.hr{position:relative; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; cursor:default}
.hr .bar{position:absolute; left:12%; right:12%; border-radius:3px; transition:opacity .2s}
.hr .t{position:absolute; bottom:-20px; font-family:var(--f-num); font-stretch:75%; font-size:10px; color:var(--ink3)}
.hr.ny .t{color:var(--ink2)}
.hours.hovering .hr:not(.hot) .bar{opacity:.3}
.nyband{position:absolute; top:-6px; bottom:14px; border-radius:6px; background:color-mix(in srgb,var(--accent) 7%,transparent);
  border:1px dashed color-mix(in srgb,var(--accent) 26%,transparent)}
.nyband span{position:absolute; top:4px; left:6px; font-size:9.5px; font-weight:700; letter-spacing:.08em; color:var(--accent)}
.entering .hr .bar{animation:grow .6s var(--ease) both; animation-delay:var(--d,0ms)}
@keyframes grow{from{transform:scaleY(0)}}

.wi{display:grid; grid-template-columns:minmax(0,1fr); gap:18px}
@media (min-width:980px){ .wi{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)} }
.wi-group{display:flex; flex-direction:column; gap:7px}
.wi-group + .wi-group{margin-top:14px}
.wi-res{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:10px; overflow:hidden}
.wi-res > div{background:var(--surface); padding:11px 13px}
.wi-res .v{font-family:var(--f-num); font-stretch:100%; font-size:20px; font-weight:560; letter-spacing:-.035em; margin-top:2px}
.wi-res .s{font-size:11px; color:var(--ink3)}
.wi-delta{grid-column:1/-1}

.split{display:grid; grid-template-columns:96px minmax(0,1fr) 78px; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--hair)}
.split:first-of-type{border-top:0}
.split .l{font-size:12.5px}
.split .l small{display:block; font-family:var(--f-num); font-stretch:87.5%; font-size:10.5px; color:var(--ink3)}
.split .trk{position:relative; height:10px}
.split .trk::before{content:''; position:absolute; left:50%; top:-4px; bottom:-4px; width:1px; background:var(--hair2)}
.split .trk i{position:absolute; top:0; height:10px; border-radius:3px; transition:width .5s var(--ease), left .5s var(--ease)}
.split .v{text-align:right; font-family:var(--f-num); font-stretch:87.5%; font-size:12.5px; font-weight:620}

.duo{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--hair); border-radius:10px; overflow:hidden; border:1px solid var(--hair)}
.duo > div{background:var(--surface); padding:12px 14px}
.duo .v{font-family:var(--f-num); font-stretch:100%; font-size:21px; font-weight:560; letter-spacing:-.035em; margin:2px 0}
.duo .s{font-size:11px; color:var(--ink3)}

/* ================================================================
   JOURNAL — day groups in the ink register
   ================================================================ */
.jbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.search{display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; border:1px solid var(--hair2);
  background:var(--surface); color:var(--ink3); min-width:220px; flex:1; max-width:360px; transition:border-color .15s, box-shadow .15s}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.search input{border:0; outline:0; background:transparent; flex:1; min-width:0; font-size:13px; color:var(--ink)}
.jfilters{display:flex; flex-direction:column; gap:10px}
.jfilters .chips{gap:5px}
.jf-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.jf-row .label{min-width:78px}
.day-h{display:flex; align-items:baseline; gap:10px; padding:16px 18px 7px; border-top:1px solid var(--hair)}
.day-h:first-child,.jhead + .day-h{border-top:0}
.day-h h3{font-size:12.5px; font-weight:650}
.day-h .c{font-size:11.5px; color:var(--ink3)}
.day-h .p{margin-left:auto; font-family:var(--f-num); font-stretch:87.5%; font-size:12.5px; font-weight:620}
.tr{display:grid; grid-template-columns:58px 54px minmax(96px,1fr) minmax(120px,1.4fr) 26px 46px 104px 64px; gap:12px; align-items:center;
  padding:9px 18px; border-top:1px solid color-mix(in srgb,var(--ink) 4.5%,transparent); cursor:pointer;
  transition:background .15s var(--ease)}
.tr:hover,.tr:focus-visible{background:var(--wash)}
.tr .tm{font-family:var(--f-num); font-stretch:87.5%; font-size:11.5px; color:var(--ink3)}
.tr .b{font-size:12.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr .ct{font-size:12.5px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tr .pnl{text-align:right; font-family:var(--f-num); font-stretch:87.5%; font-size:13px; font-weight:620}
.tr .oc{display:flex; justify-content:flex-end}
.thumb{display:block; width:46px; height:30px; border-radius:5px; overflow:hidden; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair)}
.thumb img{width:100%; height:100%; object-fit:cover; display:block}
.jhead{display:grid; grid-template-columns:58px 54px minmax(96px,1fr) minmax(120px,1.4fr) 26px 46px 104px 64px; gap:12px;
  padding:14px 18px 8px; font-size:10px; color:var(--ink3); font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  border-bottom:1px solid var(--hair)}
.jhead .r{text-align:right}
.entering .tr{animation:rise .45s var(--ease) both; animation-delay:calc(min(var(--k,0), 16) * 22ms)}
@media (max-width:760px){
  .jhead{display:none}
  .tr{grid-template-columns:50px minmax(0,1fr) auto; grid-template-areas:"tm b pnl" "side ct oc"; row-gap:3px; padding:11px 16px}
  .tr .tm{grid-area:tm} .tr .b{grid-area:b} .tr .pnl{grid-area:pnl} .tr .sd{grid-area:side} .tr .ct{grid-area:ct}
  .tr .oc{grid-area:oc} .tr .cf,.tr .th{display:none}
}

/* ================================================================
   FORMS, SHEET, TOAST, LIGHTBOX, ALERTS
   ================================================================ */
.f{display:flex; flex-direction:column; gap:7px; min-width:0}
.f > .label{display:flex; justify-content:space-between; gap:8px}
.f .hint{font-size:11.5px; color:var(--ink3)}
input.in,textarea.in{width:100%; border:1px solid var(--hair2); background:var(--raised); color:var(--ink); border-radius:var(--r-ctl);
  padding:9px 11px; font-size:14px; transition:border-color .15s, box-shadow .15s}
input.in:focus,textarea.in:focus{outline:0; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
textarea.in{resize:vertical; min-height:84px; line-height:1.55}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.amount{display:flex; align-items:center; gap:6px; border:1px solid var(--hair2); background:var(--raised); border-radius:10px; padding:4px 14px;
  transition:border-color .15s, box-shadow .15s}
.amount:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.amount span{font-family:var(--f-num); font-stretch:100%; font-size:24px; color:var(--ink3)}
.amount input{border:0; outline:0; background:transparent; flex:1; min-width:0; font-family:var(--f-num); font-stretch:100%;
  font-size:30px; font-weight:560; letter-spacing:-.04em; padding:6px 0; color:var(--ink)}
.amount.win input,.amount.win span{color:var(--up)} .amount.loss input,.amount.loss span{color:var(--down)}
.amount.open,.amount.be{opacity:.45; pointer-events:none}
.switch{display:flex; align-items:center; gap:12px; padding:11px 13px; border:1px solid var(--hair2); border-radius:10px; background:var(--raised);
  cursor:pointer; user-select:none; transition:border-color .15s, background .2s}
.switch:hover{border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.switch .tg{position:relative; width:34px; height:20px; border-radius:999px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair2);
  flex:0 0 auto; transition:background .25s var(--ease)}
.switch .tg::after{content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--raised);
  box-shadow:0 1px 2px rgba(0,0,0,.3); transition:transform .3s var(--ease)}
.switch[aria-checked="true"] .tg{background:var(--up)}
.switch[aria-checked="true"] .tg::after{transform:translateX(14px)}
.switch .t{font-size:13px; line-height:1.4}
.switch .t small{display:block; color:var(--ink3); font-size:11.5px}
.qreview{border:1px solid var(--hair2); border-radius:var(--r-ctl); background:var(--raised); flex-shrink:0}
.qreview > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; padding:11px 13px; font-size:13px; font-weight:600; color:var(--ink)}
.qreview > summary::-webkit-details-marker{display:none}
.qreview > summary::before{content:'▸'; display:inline-block; color:var(--ink3); font-size:11px; transition:transform .2s var(--ease)}
.qreview[open] > summary::before{transform:rotate(90deg)}
.qreview > summary .sub{margin-left:auto; font-weight:500; color:var(--ink3); font-size:11.5px}
.qreview .inner{padding:2px 13px 14px; border-top:1px solid var(--hair)}
.drop{border:1.5px dashed var(--hair2); border-radius:10px; padding:18px 14px; text-align:center; color:var(--ink3); font-size:12.5px;
  cursor:pointer; transition:border-color .15s, background .15s, color .15s}
.drop:hover,.drop.over{border-color:var(--accent); color:var(--ink); background:color-mix(in srgb,var(--accent) 6%,transparent)}
.drop b{display:block; color:var(--ink); font-weight:600; font-size:13px; margin-bottom:2px}
.shotbox{position:relative; border-radius:10px; overflow:hidden; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair)}
.shotbox img{display:block; width:100%; max-height:260px; object-fit:contain; cursor:zoom-in}
.shotbox .rm{position:absolute; top:8px; right:8px}

.scrim{position:fixed; inset:0; z-index:60; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .3s var(--ease)}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; z-index:70; top:10px; right:10px; bottom:10px; width:min(468px,calc(100vw - 20px)); display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--hair); border-radius:18px; box-shadow:0 30px 80px -30px rgba(0,0,0,.6);
  transform:translateX(calc(100% + 24px)); transition:transform .5s var(--ease), visibility 0s linear .5s; visibility:hidden}
.sheet.on{transform:none; visibility:visible; transition:transform .5s var(--ease), visibility 0s}
.sheet-h{display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--hair)}
.sheet-h h2{font-size:15px}
.sheet-b{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:18px; overscroll-behavior:contain}
.sheet-f{display:flex; gap:10px; align-items:center; padding:13px 18px; border-top:1px solid var(--hair)}
.sheet-f kbd{font-family:var(--f-num); font-size:10.5px; color:var(--ink3)}
@media (max-width:640px){
  .sheet{top:auto; left:0; right:0; bottom:0; width:100%; max-height:92dvh; border-radius:18px 18px 0 0;
    transform:translateY(100%); padding-bottom:env(safe-area-inset-bottom,0px)}
}
.facts{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:10px; overflow:hidden}
.facts > div{background:var(--surface); padding:10px 12px}
.facts .fv{font-size:13px; font-weight:550; margin-top:1px}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:90; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px; padding:10px 16px; border-radius:12px; background:var(--ink); color:var(--ground);
  font-size:13px; font-weight:550; box-shadow:0 14px 40px -12px rgba(0,0,0,.5); animation:toast .45s var(--ease) both}
@media (max-width:900px){ .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
.toast button{appearance:none; border:0; background:none; color:var(--accent); font-weight:700; font-size:12.5px; padding:0}
@keyframes toast{from{opacity:0; transform:translate(-50%,12px) scale(.96)}}
.lightbox{position:fixed; inset:0; z-index:95; display:grid; place-items:center; padding:28px; background:rgba(6,6,5,.9); cursor:zoom-out; animation:fade .2s both}
.lightbox img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 30px 80px -20px #000}
.lightbox .cap{position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:12px; color:#bdbab1}
@keyframes fade{from{opacity:0}}
.alert{display:flex; gap:12px; align-items:flex-start; padding:12px 15px; border-radius:12px; font-size:13px; line-height:1.5}
.alert b{display:block; font-weight:650}
.alert.bad{background:color-mix(in srgb,var(--down) 12%,transparent); color:var(--down); border:1px solid color-mix(in srgb,var(--down) 30%,transparent)}
.alert.warn{background:color-mix(in srgb,var(--accent) 10%,transparent); color:var(--accent); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.alert .btn{margin-left:auto; flex:0 0 auto}

.status{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:10px; overflow:hidden}
.status > div{background:var(--surface); padding:12px 14px}
.status .sv{font-size:13.5px; font-weight:600; margin-top:3px}
.status .sv small{display:block; font-weight:400; font-size:11.5px; color:var(--ink3)}
.kbd-list{display:grid; grid-template-columns:auto 1fr; gap:8px 16px; font-size:13px; color:var(--ink2)}
.kbd-list kbd{font-family:var(--f-num); font-size:11px; padding:2px 7px; border-radius:5px; border:1px solid var(--hair2); color:var(--ink); background:var(--raised); justify-self:start}

.welcome{padding:34px 26px; display:grid; gap:24px; grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){ .welcome{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:center} }
.welcome h2{font-size:clamp(22px,2.8vw,30px); letter-spacing:-.03em; line-height:1.15}
.welcome p{color:var(--ink2); margin-top:10px; max-width:52ch}
.ladder{display:flex; flex-direction:column; gap:1px; background:var(--hair); border:1px solid var(--hair); border-radius:12px; overflow:hidden}
.ladder > div{background:var(--surface); padding:12px 14px; display:grid; grid-template-columns:44px minmax(0,1fr); gap:12px; align-items:baseline}
.ladder .n{font-size:12px; color:var(--accent); font-weight:650}
.ladder b{font-weight:600; font-size:13px; display:block}
.ladder span{font-size:12px; color:var(--ink2)}
.ladder > div.reached .n{color:var(--up)}

/* ================================================================
   DAY SHEET · SCREENSHOTS · POSITION SIZE
   ================================================================ */
.dlist{display:flex; flex-direction:column; border:1px solid var(--hair); border-radius:12px; overflow:hidden}
.dr{appearance:none; display:grid; grid-template-columns:46px minmax(0,1fr) 84px 46px; gap:12px; align-items:center; text-align:left;
  padding:11px 13px; border:0; border-top:1px solid var(--hair); background:transparent; color:var(--ink); transition:background .15s var(--ease)}
.dr:first-child{border-top:0}
.dr:hover,.dr:focus-visible{background:var(--wash)}
.dr .tm{font-family:var(--f-num); font-stretch:87.5%; font-size:11.5px; color:var(--ink3)}
.dr .drm{display:flex; flex-direction:column; gap:2px; min-width:0}
.dr .drm b{font-weight:600; font-size:13px}
.dr .drm small{font-size:11.5px; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dr .pnl{font-family:var(--f-num); font-stretch:87.5%; font-weight:620; font-size:13px; text-align:right}

.shots{display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.shot-card{appearance:none; display:flex; flex-direction:column; padding:0; text-align:left; color:var(--ink); border:1px solid var(--hair);
  background:var(--surface); border-radius:var(--r-card); overflow:hidden; box-shadow:var(--lift); transition:transform .4s var(--ease), border-color .2s}
.shot-card:hover,.shot-card:focus-visible{transform:translateY(-3px); border-color:var(--hair2)}
.shot-card .im{position:relative; display:block; aspect-ratio:16/10; background:var(--sunken); overflow:hidden}
.shot-card img{display:block; width:100%; height:100%; object-fit:cover; transition:transform .7s var(--ease)}
.shot-card:hover img{transform:scale(1.045)}
.shot-card .res{position:absolute; top:10px; right:10px}
.shot-card .res .pill{background:color-mix(in srgb,var(--surface) 86%,transparent); backdrop-filter:blur(6px)}
.shot-card .meta{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; padding:11px 14px 13px}
.shot-card .meta b{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.shot-card .meta .pnl{font-family:var(--f-num); font-stretch:87.5%; font-weight:620; font-size:13px}
.shot-card .meta small{grid-column:1/-1; font-size:11.5px; color:var(--ink3)}
.entering .shot-card{animation:rise .55s var(--ease) both; animation-delay:calc(min(var(--k,0), 12) * 45ms)}

.gallery{--up:#4CC38A; --down:#E8665B; --ink:#ECEAE3; --surface:#141412; --raised:#1B1B18; --hair2:rgba(255,255,255,.16);
  position:fixed; inset:0; z-index:95; display:grid; grid-template-rows:minmax(0,1fr) auto; background:rgba(7,7,6,.95); cursor:default; padding:0; animation:fade .2s both}
.gallery .stage{position:relative; display:grid; place-items:center; min-height:0; padding:28px 76px 14px}
.gallery .stage img{max-width:100%; max-height:100%; object-fit:contain; border-radius:10px; box-shadow:0 30px 80px -20px #000}
.gallery .nav-b{position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#eee; transition:background .15s}
.gallery .nav-b:hover{background:rgba(255,255,255,.15)}
.gallery .prev{left:18px} .gallery .next{right:18px}
.gallery .close{top:30px; right:18px; transform:none}

/* ================================================================
   SKIN — HTC Vault
   ================================================================ */
/* ---------- tokens: "Solarin" — deep teal glass, copper light, ice mint ----------
   From Luca's reference palette: #2C3531 slate · #116466 teal · #D9B08C copper ·
   #FFCB9A peach · #D1E8E2 ice. Two gradients carry everything:
     warm  — peach → copper → bronze   (actions: log a trade, primary buttons)
     cool  — glow cyan → deep teal     (identity: the app icon, rings, light rays)
   Green/red stay outcome colours only, tuned to sit inside the palette. */
:root{
  color-scheme: light;
  --ground:#E6F0EC; --surface:#FFFFFF; --raised:#FFFFFF; --sunken:#D9E7E2;
  --ink:#0F2A26; --ink2:#4B6A63; --ink3:#86A29B;
  --accent:#116466; --accent-ink:#FFFFFF; --violet:#1A9AA6;
  --up:#0E8F6A; --down:#C4553B;
  --hair:rgba(15,42,38,.08); --hair2:rgba(15,42,38,.15); --wash:rgba(15,42,38,.045);
  --lift:0 1px 2px rgba(15,42,38,.05), 0 14px 34px -16px rgba(15,42,38,.22); --scrim:rgba(15,42,38,.3);
  --warm:linear-gradient(145deg,#FFCB9A 0%,#D9B08C 55%,#B07A50 100%);
  --cool:linear-gradient(145deg,#3FE0D0 0%,#1B8A8A 45%,#0B4546 100%);
  --warm-glow:rgba(217,176,140,.75); --cool-glow:rgba(63,224,208,.55); --warm-ink:#2A1A0C;
  --card-bg:#FFFFFF; --card-edge:rgba(255,255,255,.9);
  --atmos-a:rgba(17,100,102,.14); --atmos-b:rgba(217,176,140,.18);
  --f-ui:'Figtree',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-num:'Figtree',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r-card:26px; --r-ctl:14px; --r-cell:9px;
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.5,.5,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#0A1412; --surface:#13211E; --raised:#1A2C28; --sunken:#07100E;
  --ink:#E6F2EE; --ink2:#A6C2BA; --ink3:#6C8983; --accent:#FFCB9A; --accent-ink:#2A1A0C; --violet:#46D5E0;
  --up:#6FDDA6; --down:#F0806A;
  --hair:rgba(209,232,226,.07); --hair2:rgba(209,232,226,.14); --wash:rgba(209,232,226,.05);
  --lift:0 1px 0 rgba(209,232,226,.04) inset, 0 22px 44px -24px rgba(0,0,0,.85); --scrim:rgba(2,8,7,.6);
  --card-bg:linear-gradient(165deg,#172824 0%,#111E1B 100%); --card-edge:rgba(209,232,226,.09);
  --atmos-a:rgba(17,100,102,.38); --atmos-b:rgba(217,176,140,.14);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0A1412; --surface:#13211E; --raised:#1A2C28; --sunken:#07100E;
  --ink:#E6F2EE; --ink2:#A6C2BA; --ink3:#6C8983; --accent:#FFCB9A; --accent-ink:#2A1A0C; --violet:#46D5E0;
  --up:#6FDDA6; --down:#F0806A;
  --hair:rgba(209,232,226,.07); --hair2:rgba(209,232,226,.14); --wash:rgba(209,232,226,.05);
  --lift:0 1px 0 rgba(209,232,226,.04) inset, 0 22px 44px -24px rgba(0,0,0,.85); --scrim:rgba(2,8,7,.6);
  --card-bg:linear-gradient(165deg,#172824 0%,#111E1B 100%); --card-edge:rgba(209,232,226,.09);
  --atmos-a:rgba(17,100,102,.38); --atmos-b:rgba(217,176,140,.14);
}
body{font-size:14.5px; background:var(--ground)}
.n,.big,.kpi .v,.day .p,.wk .p,.cell .a,.tr .pnl,.dr .pnl,.size-big,.amount input,.tr .tm,.dr .tm{font-stretch:normal !important; letter-spacing:-.01em}

/* labels are spaced capitals, like the reference's S O L A R I N — quiet, instrument-like */
.label{font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink3)}

/* the room the journal sits in: teal light from above, a copper ember below, faint rays */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 82% -8%, var(--atmos-a), transparent 70%),
    radial-gradient(50vmax 40vmax at -6% 108%, var(--atmos-b), transparent 70%);}

/* ---------- header ---------- */
.pu-top{max-width:none; margin:0; display:flex; align-items:center; gap:16px; padding:18px clamp(16px,2vw,32px) 4px}
.pu-brand{display:flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none}

  background:var(--cool); box-shadow:0 8px 20px -8px var(--cool-glow), inset 0 1px 0 rgba(209,232,226,.45), inset 0 0 0 1px rgba(209,232,226,.12)}
.pu-icon .logo-mark{width:22px; height:22px; filter:drop-shadow(0 0 4px rgba(255,203,154,.8))}
.pu-brand b{font-size:15px; font-weight:800; letter-spacing:.22em}

.pu-greet small{font-size:12.5px; color:var(--ink3)}

/* ---------- floating dock ---------- */
.pu-dockwrap{position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:40; display:flex; justify-content:center; pointer-events:none}
.pu-dock{pointer-events:auto; display:flex; align-items:center; gap:8px; padding:7px; border-radius:26px;
  background:color-mix(in srgb,var(--surface) 74%,transparent); backdrop-filter:blur(22px) saturate(1.5); -webkit-backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:0 1px 0 var(--card-edge) inset, 0 24px 50px -18px rgba(0,0,0,.5), 0 0 0 1px var(--hair2);
  animation:dockin .7s var(--spring) both .1s}
@keyframes dockin{from{transform:translateY(40px) scale(.9); opacity:0}}
.pu-nav{display:flex; flex-direction:row; gap:2px; position:relative}
.pu-nav a{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:66px; height:52px; justify-content:center;
  padding:0 8px; border-radius:19px; color:var(--ink3); text-decoration:none; font-size:11px; font-weight:650; transition:color .25s}
.pu-nav a .nl,.pu-nav a kbd{display:none}

.pu-nav a svg{width:20px; height:20px; stroke-width:1.9}
.pu-nav a:hover{color:var(--ink)}

.pu-nav .pill{top:0; left:0; right:auto; border-radius:19px; background:var(--raised); box-shadow:0 6px 16px -8px rgba(0,0,0,.45), 0 0 0 1px var(--hair2);
  transition:transform .5s var(--spring), width .5s var(--spring)}
.pu-nav .pill::before{display:none}
.pu-plus{appearance:none; width:52px; height:52px; border-radius:19px; border:0; display:grid; place-items:center; color:var(--warm-ink);
  background:var(--warm); box-shadow:0 10px 24px -8px var(--warm-glow), inset 0 1px 0 rgba(255,255,255,.55); transition:transform .35s var(--spring)}
.pu-plus svg{width:24px; height:24px; stroke:currentColor; stroke-width:2.4; fill:none; stroke-linecap:round}
.pu-plus:hover{transform:scale(1.07) rotate(90deg)}
.pu-plus:active{transform:scale(.94)}

/* ---------- page + bento ---------- */
/* the interface fills the whole window — no fixed max width, only a slim gutter */
.pu-main{max-width:none; margin:0; padding:16px clamp(16px,2vw,32px) 124px}
.view{max-width:none; gap:20px}
.demobar{max-width:none; margin:0 0 18px; border-radius:18px; border:0; background:var(--surface); box-shadow:var(--lift); padding:12px 16px}
.demobar .btn{border-radius:999px}
.head h1{font-size:clamp(26px,3.2vw,34px); letter-spacing:-.035em}
.head p{font-size:14px}
/* cards: dark glass with a lit top edge */
.card{border:0; border-radius:var(--r-card); background:var(--card-bg); box-shadow:var(--lift), inset 0 1px 0 var(--card-edge), inset 0 0 0 1px var(--hair)}
.card-h{padding:20px 22px 0}
.card-h h2{font-size:16px; font-weight:750}
.card-b{padding:16px 22px 22px}
.cols{gap:20px}
.bento{display:grid; gap:20px; grid-template-columns:repeat(12,minmax(0,1fr))}
.tile{padding:22px; display:flex; flex-direction:column; gap:4px; min-width:0}
.t-hero{grid-column:span 8; grid-row:span 2; position:relative}
.t-rings{grid-column:span 4; grid-row:span 2}
.t-a,.t-b,.t-c{grid-column:span 4}
.t-cal{grid-column:span 7} .t-focus{grid-column:span 5; padding:0} .t-latest{grid-column:span 12; padding:0}
.t-cal > .card{height:100%}
/* HUD corner brackets on the hero, after the reference's framing lines */
.t-hero::before,.t-hero::after{content:""; position:absolute; width:18px; height:18px; pointer-events:none; opacity:.55}
.t-hero::before{top:12px; right:12px; border-top:1.5px solid #3FE0D0; border-right:1.5px solid #3FE0D0; border-top-right-radius:6px}
.t-hero::after{bottom:12px; left:12px; border-bottom:1.5px solid #D9B08C; border-left:1.5px solid #D9B08C; border-bottom-left-radius:6px}
.tile .v{font-size:30px; font-weight:750; letter-spacing:-.035em; margin-top:4px}
.tile .s{font-size:12.5px; color:var(--ink3)}
.tile svg.spark{width:100%; height:34px; margin-top:auto; padding-top:10px}
.t-hero .big{font-size:clamp(40px,5.4vw,64px); font-weight:800; letter-spacing:-.05em; margin-top:6px}
.t-hero .big.up{text-shadow:0 0 32px color-mix(in srgb,var(--up) 35%,transparent)}
.t-hero .chart{flex:1; min-height:230px; height:auto}
.hero{padding:22px}
.hero-sub{font-size:13px}
.big{font-weight:800; letter-spacing:-.05em}
.pu-rings{display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:10px; flex:1; justify-content:center}

.pu-arc{transition:stroke-dashoffset 1.4s var(--ease); transition-delay:calc(var(--k) * 150ms + 200ms)}
.pu-rings ul{list-style:none; margin:0; padding:0; width:100%; display:flex; flex-direction:column; gap:9px}
.pu-rings li{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink2)}
.pu-rings li i{width:10px; height:10px; border-radius:50%; color:inherit}
.pu-rings li b{margin-left:auto; font-size:16px; color:var(--ink); font-weight:750}
.kpis{gap:20px}
.kpi .v{font-size:28px; font-weight:750}

.btn{border-radius:999px; font-weight:650; padding:9px 16px}
.btn.primary{background:var(--warm); color:var(--warm-ink); border:0; box-shadow:0 8px 20px -10px var(--warm-glow), inset 0 1px 0 rgba(255,255,255,.5)}
.link{font-weight:650; color:var(--accent)}
.seg{border-radius:999px; background:var(--sunken); box-shadow:inset 0 0 0 1px var(--hair)}
.seg::before{border-radius:999px; background:var(--raised); box-shadow:0 2px 8px -2px rgba(0,0,0,.35), inset 0 1px 0 var(--card-edge); transition:transform .5s var(--spring)}
.seg button{font-family:var(--f-ui); font-stretch:normal; font-weight:700}
.seg.lg{border-radius:16px} .seg.lg::before{border-radius:12px} .seg.lg button{border-radius:12px}
.chip{border-radius:999px; border:0; background:var(--sunken); font-weight:650; padding:8px 14px; transition:transform .3s var(--spring), background .2s}

.side{border-radius:7px}

.cal{gap:6px}
.day{border-radius:10px}
.day.has:hover{transform:scale(1.07)}
.wk{border-radius:10px; border-style:solid; border-color:var(--hair)}

.mx{gap:6px}
.in{padding:16px 22px}

.duo,.facts,.status,.opts,.targets,.wi-res{border-radius:18px}

.money-in{border-radius:14px}

/* ---------- sheet: an iOS-style card ---------- */
/* the log / detail sheet comes out to half the window */
.sheet{width:min(max(468px, calc(50vw - 14px)), calc(100vw - 28px)); border-radius:30px; border:0; top:14px; right:14px; bottom:14px; background:var(--surface); box-shadow:0 40px 90px -30px rgba(0,0,0,.7), inset 0 1px 0 var(--card-edge); transition:transform .6s var(--spring), visibility 0s linear .6s}
.sheet.on{transition:transform .6s var(--spring), visibility 0s}
.sheet-h{padding:20px 22px}
.sheet-b{padding:20px 22px}

@media (max-width:1080px){

/* ---------- opening ---------- */
.pu-splash{position:fixed; inset:0; z-index:200; overflow:hidden; display:grid; place-items:center; background:var(--ground); cursor:pointer;
  clip-path:circle(150% at var(--ox,50%) var(--oy,50%)); transition:clip-path .85s cubic-bezier(.76,0,.24,1)}
.pu-splash.out{clip-path:circle(0px at var(--ox) var(--oy)); pointer-events:none}
.pu-splash.out .sp-core{transform:scale(.9); opacity:0; filter:blur(6px); transition:transform .6s cubic-bezier(.5,0,.75,0), opacity .5s, filter .5s}
.sp-hold,.sp-hold body{overflow:hidden}
.sp-hold .pu-dock{animation:none; opacity:0}
.sp-hold .pu-top{opacity:0}
.pu-top{transition:opacity .6s .25s}

/* the opening is always night: bull and bear read best on black, in either theme */
.pu-splash{--ground:#030605; --ink:#EEF4F1; --ink2:#A9BDB6; --ink3:#6E857E; --surface:#0E1614;
  --hair:rgba(230,240,236,.07); --hair2:rgba(230,240,236,.14); --card-edge:rgba(230,240,236,.08);
  --lift:0 22px 44px -24px rgba(0,0,0,.9); --up:#57E39A; --down:#FF6B5E; color:var(--ink)}

/* bear haze on the left, bull haze on the right */
.sp-aurora{position:absolute; inset:-20%; filter:blur(80px); opacity:.75}
.sp-aurora i{position:absolute; width:44vmax; height:44vmax; border-radius:50%; animation:spDrift 5s ease-in-out infinite alternate}
.sp-aurora i:nth-child(1){background:radial-gradient(circle,rgba(220,30,40,.5),transparent 62%); left:4%; top:22%}
.sp-aurora i:nth-child(2){background:radial-gradient(circle,rgba(30,200,110,.42),transparent 62%); right:4%; top:18%; animation-delay:-2.5s}
@keyframes spDrift{from{transform:translate(-3%,2%) scale(.92)} to{transform:translate(3%,-3%) scale(1.1)}}

/* the face-off: one picture, split down the black gap so each animal moves on its own */
