const icon = (k, cls) => `<svg class="i ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${P_ICON[k] || ''}</svg>`;

const pct = x => Math.round(x * 100) + '%';
const kmoney = n => {                               // compact money for tight cells: +$1.2k
  const a = Math.abs(n);
  const s = a >= 10000 ? Math.round(a / 1000) + 'k' : a >= 1000 ? (a / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(a));
  return sign(n) + CCY.symbol + s;
};
const tone = n => n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
const toneVar = n => n >= 0 ? 'var(--up)' : 'var(--down)';
const tint = (c, p) => `color-mix(in srgb, ${c} ${Math.round(p)}%, transparent)`;
const fmtDay = s => { const d = new Date(s + 'T12:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const FMT = { int: n => String(Math.round(n)), money0: n => money(n, 0), money: n => money(n), pct: n => Math.round(n) + '%', pf: n => n === Infinity ? '∞' : n.toFixed(2) };

/* numbers roll from where they were to where they are */
const ROLL = new Map();
function rolls(root) {
  root.querySelectorAll('[data-roll]').forEach(el => {
    const key = el.dataset.roll, to = +el.dataset.to, f = FMT[el.dataset.fmt] || FMT.money0;
    if (!isFinite(to)) { el.textContent = f(to); ROLL.set(key, to); return; }
    const from = ROLL.has(key) ? ROLL.get(key) : (ENTER ? 0 : to);
    ROLL.set(key, to);
    if (REDUCED || from === to) { el.textContent = f(to); return; }
    if (document.visibilityState !== 'visible') { el.textContent = f(to); return; }
    const t0 = performance.now(), dur = 950;
    el.textContent = f(from);
    setTimeout(() => { el.textContent = f(to); }, dur + 80);   // rAF pauses in hidden tabs — always land on the real value
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
      el.textContent = f(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* controls — a segmented radio with a sliding indicator, and toggle chips */
function seg(options, cur, handler, cls) {
  const i = Math.max(0, options.findIndex(o => o[0] === cur));
  return `<div class="seg ${cls || ''}" role="radiogroup" style="--n:${options.length};--i:${i}">` +
    options.map(([v, l]) => `<button type="button" role="radio" data-v="${esc(v)}" aria-checked="${v === cur}" onclick="${handler}('${esc(v)}', this)">${l}</button>`).join('') + '</div>';
}
/* slide the indicator without rebuilding the control, so focus and typing survive */
function segSet(btn) {
  const g = btn.parentElement, bs = Array.from(g.children);
  bs.forEach(b => b.setAttribute('aria-checked', b === btn));
  g.style.setProperty('--i', bs.indexOf(btn));
}
const rangeSeg = () => seg(RANGES.map(r => [r[0], r[0]]), UI.range, 'setRange');

function spark(vals, color, h) {
  h = h || 26;
  if (vals.length < 2) return `<svg class="spark" viewBox="0 0 100 ${h}" preserveAspectRatio="none"></svg>`;
  const lo = Math.min(...vals), hi = Math.max(...vals), sp = (hi - lo) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * 100).toFixed(2)},${(2 + (1 - (v - lo) / sp) * (h - 4)).toFixed(2)}`);
  return `<svg class="spark" viewBox="0 0 100 ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ---------------------------------------------------------------
   One chart engine for every line on the page. Measured at real
   width (no stretched text), redrawn on resize, crosshair on hover.
     values  — numbers to plot, oldest first
     ghost   — optional second series on the same x positions
     emph    — 'main' | 'ghost': which line gets the accent
     read(i) — returns the header readout for the hovered point
   --------------------------------------------------------------- */
const CHARTS = [];
const ro = new ResizeObserver(es => es.forEach(e => { const c = CHARTS.find(x => x.host === e.target); if (c) c.draw(); }));
function lineChart(hostId, cfg) {
  const host = document.getElementById(hostId);
  if (!host) return;
  const draw = () => {
    const vals = cfg.values;
    if (!vals || vals.length < 2) { host.innerHTML = `<div class="empty-chart">${cfg.empty || 'Two closed trades draw the first line.'}</div>`; return; }
    const W = host.clientWidth || 600, H = host.clientHeight || 200;
    const PL = 4, PR = 58, PT = 10, PB = 20;
    const all = vals.concat(cfg.ghost || []).concat(cfg.zero === false ? [] : [0]);
    let lo = Math.min(...all), hi = Math.max(...all);
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const X = i => PL + i / (vals.length - 1) * (W - PL - PR);
    const Y = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);
    const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    /* DESIGN.chart.smooth: monotone cubic through the same points (never overshoots) */
    const smoothPath = arr => {
      const P = arr.map((v, i) => [X(i), Y(v)]), n = P.length;
      if (n < 3) return path(arr);
      const dx = k => P[k + 1][0] - P[k][0], sl = k => (P[k + 1][1] - P[k][1]) / dx(k);
      const m = P.map((_, k) => k === 0 ? sl(0) : k === n - 1 ? sl(n - 2) : (sl(k - 1) * sl(k) <= 0 ? 0 : (sl(k - 1) + sl(k)) / 2));
      for (let k = 0; k < n - 1; k++) {
        const d = sl(k);
        if (d === 0) { m[k] = m[k + 1] = 0; continue; }
        const a = m[k] / d, b = m[k + 1] / d, h = a * a + b * b;
        if (h > 9) { const t = 3 / Math.sqrt(h); m[k] = t * a * d; m[k + 1] = t * b * d; }
      }
      let out = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
      for (let k = 0; k < n - 1; k++) {
        const h = dx(k) / 3;
        out += ` C${(P[k][0] + h).toFixed(1)} ${(P[k][1] + m[k] * h).toFixed(1)} ${(P[k + 1][0] - h).toFixed(1)} ${(P[k + 1][1] - m[k + 1] * h).toFixed(1)} ${P[k + 1][0].toFixed(1)} ${P[k + 1][1].toFixed(1)}`;
      }
      return out;
    };
    const line = arr => DESIGN.chart.smooth ? smoothPath(arr) : path(arr);
    const main = line(vals), z = Y(0);
    const accentMain = cfg.emph !== 'ghost';
    const mainStroke = accentMain ? 'var(--chart-line)' : 'var(--ink3)';
    const fo = DESIGN.chart.fill ? DESIGN.chart.fillOpacity : 0;
    const gid = 'g' + hostId;
    /* signed: above zero the line and its fill are green, below zero red — the colour
       flips exactly where the line crosses the zero line (two clips split at zero) */
    const signed = DESIGN.chart.signed && accentMain && cfg.zero !== false;
    const signTone = v => v >= 0 ? 'var(--up)' : 'var(--down)';
    const lastV = vals[vals.length - 1], lastG = cfg.ghost ? cfg.ghost[cfg.ghost.length - 1] : null;
    const labels = [[hi - pad, 'top'], [0, 'zero'], [lo + pad, 'bot']]
      .filter(([v, k]) => k !== 'zero' || cfg.zero !== false)
      .map(([v]) => v).filter((v, i, a) => a.findIndex(w => Math.abs(Y(w) - Y(v)) < 14) === i);
    host.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label || 'Line chart')}">
        <defs><filter id="${gid}gb" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="${(DESIGN.chart.width * 1.5).toFixed(1)}"/></filter><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${accentMain ? 'var(--chart-fill)' : 'var(--ink3)'}" stop-opacity="${fo}"/>
          <stop offset="1" stop-color="${accentMain ? 'var(--chart-fill)' : 'var(--ink3)'}" stop-opacity="0"/></linearGradient></defs>
        ${labels.map(v => `<line x1="${PL}" x2="${W - PR + 6}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--hair)" stroke-width="1"/>`).join('')}
        ${cfg.zero === false ? '' : `<line x1="${PL}" x2="${W - PR + 6}" y1="${z.toFixed(1)}" y2="${z.toFixed(1)}" stroke="var(--hair2)" stroke-dasharray="3 4"/>`}
        ${signed ? (() => {
          /* smooth: a monotone cubic through every point — it never overshoots a trade's
             value, so peaks, troughs and zero crossings stay honest */
          const P = vals.map((v, k) => [X(k), Y(v)]), n = P.length;
          const dx = k => P[k + 1][0] - P[k][0], sl = k => (P[k + 1][1] - P[k][1]) / dx(k);
          const m = P.map((_, k) => k === 0 ? sl(0) : k === n - 1 ? sl(n - 2) : (sl(k - 1) * sl(k) <= 0 ? 0 : (sl(k - 1) + sl(k)) / 2));
          for (let k = 0; k < n - 1; k++) {
            const d = sl(k);
            if (d === 0) { m[k] = m[k + 1] = 0; continue; }
            const a = m[k] / d, b = m[k + 1] / d, h = a * a + b * b;
            if (h > 9) { const t = 3 / Math.sqrt(h); m[k] = t * a * d; m[k + 1] = t * b * d; }
          }
          let curve = `M${P[0][0].toFixed(1)} ${P[0][1].toFixed(1)}`;
          for (let k = 0; k < n - 1; k++) {
            const h = dx(k) / 3;
            curve += ` C${(P[k][0] + h).toFixed(1)} ${(P[k][1] + m[k] * h).toFixed(1)} ${(P[k + 1][0] - h).toFixed(1)} ${(P[k + 1][1] - m[k + 1] * h).toFixed(1)} ${P[k + 1][0].toFixed(1)} ${P[k + 1][1].toFixed(1)}`;
          }
          const area = `${curve} L${X(n - 1).toFixed(1)} ${z.toFixed(1)} L${X(0).toFixed(1)} ${z.toFixed(1)} Z`;
          const w = DESIGN.chart.width, x0 = X(0).toFixed(1), x1 = X(n - 1).toFixed(1), top = Y(hi - pad), bot = Y(lo + pad);
          const lines = side => `
            <path class="line-draw eq-glow" pathLength="1" d="${curve}" fill="none" stroke="url(#${gid}s${side})" stroke-width="${w * 4}" stroke-linecap="round" filter="url(#${gid}b)" clip-path="url(#${gid}${side.toUpperCase()})"/>
            <path class="line-draw" pathLength="1" d="${curve}" fill="none" stroke="url(#${gid}s${side})" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${gid}${side.toUpperCase()})"/>`;
          return `<defs>
              <clipPath id="${gid}U"><rect x="0" y="-20" width="${W}" height="${Math.max(0, z + 20).toFixed(1)}"/></clipPath>
              <clipPath id="${gid}D"><rect x="0" y="${z.toFixed(1)}" width="${W}" height="${Math.max(0, H - z + 20).toFixed(1)}"/></clipPath>
              <filter id="${gid}b" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="${(w * 1.6).toFixed(1)}"/></filter>
              <linearGradient id="${gid}su" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">
                <stop offset="0" stop-color="#2FC79B"/><stop offset=".55" stop-color="var(--up)"/><stop offset="1" stop-color="#C9F7DD"/></linearGradient>
              <linearGradient id="${gid}sd" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">
                <stop offset="0" stop-color="#FFB38A"/><stop offset=".5" stop-color="var(--down)"/><stop offset="1" stop-color="#FF5E7E"/></linearGradient>
              <linearGradient id="${gid}u" gradientUnits="userSpaceOnUse" x1="0" y1="${top.toFixed(1)}" x2="0" y2="${z.toFixed(1)}">
                <stop offset="0" stop-color="var(--up)" stop-opacity="${fo * 1.6}"/><stop offset=".55" stop-color="#2FC79B" stop-opacity="${fo * .55}"/><stop offset="1" stop-color="#2FC79B" stop-opacity="0"/></linearGradient>
              <linearGradient id="${gid}d" gradientUnits="userSpaceOnUse" x1="0" y1="${z.toFixed(1)}" x2="0" y2="${bot.toFixed(1)}">
                <stop offset="0" stop-color="#FF5E7E" stop-opacity="0"/><stop offset=".45" stop-color="#FF5E7E" stop-opacity="${fo * .55}"/><stop offset="1" stop-color="var(--down)" stop-opacity="${fo * 1.6}"/></linearGradient>
              <pattern id="${gid}h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink)" stroke-opacity=".06" stroke-width="2"/></pattern></defs>
            <g class="eq-area">
              <path d="${area}" fill="url(#${gid}u)" clip-path="url(#${gid}U)"/>
              <path d="${area}" fill="url(#${gid}d)" clip-path="url(#${gid}D)"/>
              <path d="${area}" fill="url(#${gid}h)"/>
            </g>
            ${lines('u')}${lines('d')}
            <path class="eq-comet" pathLength="1" d="${curve}" fill="none" stroke="#FFFFFF" stroke-width="${w * .8}" stroke-linecap="round" filter="url(#${gid}b)"/>
            <path class="eq-comet" pathLength="1" d="${curve}" fill="none" stroke="#FFFFFF" stroke-width="${w * .45}" stroke-linecap="round"/>
            ${(cfg.marks || []).map((tn, k) => !tn || k === n - 1 ? '' : `<circle class="eq-mark" cx="${X(k).toFixed(1)}" cy="${Y(vals[k]).toFixed(1)}" r="4.2" fill="var(--${tn})" stroke="var(--surface)" stroke-width="2" style="--t:${(0.25 + k / (n - 1) * 1.05).toFixed(2)}s"/>`).join('')}
            <circle class="eq-ping" cx="${X(n - 1).toFixed(1)}" cy="${Y(lastV).toFixed(1)}" r="5" fill="none" stroke="${signTone(lastV)}" stroke-width="2"/>`;
        })() : `
        <path d="${main} L${X(vals.length - 1).toFixed(1)} ${(cfg.zero === false ? H - PB : z).toFixed(1)} L${X(0).toFixed(1)} ${(cfg.zero === false ? H - PB : z).toFixed(1)} Z" fill="url(#${gid})"/>
        ${DESIGN.chart.glow && accentMain ? `<path class="line-draw" pathLength="1" d="${main}" fill="none" stroke="${mainStroke}" stroke-width="${DESIGN.chart.width * 3.5}" stroke-linecap="round" opacity=".45" filter="url(#${gid}gb)"/>` : ''}
        <path class="line-draw" pathLength="1" d="${main}" fill="none" stroke="${mainStroke}" stroke-width="${accentMain ? DESIGN.chart.width : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>
        ${DESIGN.chart.glow && accentMain ? `<path class="eq-comet" pathLength="1" d="${main}" fill="none" stroke="#FFFFFF" stroke-width="${DESIGN.chart.width * .7}" stroke-linecap="round"/>` : ''}`}
        ${!cfg.ghost ? '' : accentMain
          ? `<path d="${line(cfg.ghost)}" fill="none" stroke="var(--ink2)" stroke-width="1.6" stroke-dasharray="4 4" stroke-linejoin="round"/>`
          : `${DESIGN.chart.glow ? `<path class="line-draw" pathLength="1" d="${line(cfg.ghost)}" fill="none" stroke="var(--chart-line)" stroke-width="${DESIGN.chart.width * 3.5}" stroke-linecap="round" opacity=".45" filter="url(#${gid}gb)"/>` : ''}<path class="line-draw wi-ghost" pathLength="1" d="${line(cfg.ghost)}" fill="none" stroke="var(--chart-line)" stroke-width="${DESIGN.chart.width + .2}" stroke-linejoin="round" stroke-linecap="round"/>`}
        <circle cx="${X(vals.length - 1).toFixed(1)}" cy="${Y(lastV).toFixed(1)}" r="${signed ? 5.5 : 4}" fill="${signed ? signTone(lastV) : mainStroke}" stroke="var(--surface)" stroke-width="${signed ? 2.5 : 2}"/>
        ${cfg.ghost ? `<circle cx="${X(vals.length - 1).toFixed(1)}" cy="${Y(lastG).toFixed(1)}" r="4" fill="${accentMain ? 'var(--ink2)' : 'var(--accent)'}" stroke="var(--surface)" stroke-width="2"/>` : ''}
        <line class="xh" x1="0" x2="0" y1="${PT}" y2="${H - PB}" stroke="var(--ink3)" stroke-width="1" opacity="0"/>
        <circle class="xd" r="4.5" fill="var(--surface)" stroke="${cfg.emph === 'ghost' ? 'var(--chart-line)' : mainStroke}" stroke-width="2" opacity="0"/>
      </svg>
      ${labels.map(v => `<span class="ax" style="right:0;top:${(Y(v) - 7).toFixed(1)}px">${esc((cfg.fmt || kmoney)(v))}</span>`).join('')}
      ${cfg.xl ? `<span class="ax" style="left:${PL}px;bottom:0">${esc(cfg.xl[0])}</span><span class="ax" style="right:${PR}px;bottom:0">${esc(cfg.xl[1])}</span>` : ''}
      <div class="hit"></div>`;
    const hit = host.querySelector('.hit'), xh = host.querySelector('.xh'), xd = host.querySelector('.xd');
    const track = cfg.emph === 'ghost' && cfg.ghost ? cfg.ghost : vals;
    const move = e => {
      const r = host.getBoundingClientRect(), x = e.clientX - r.left;
      const i = Math.max(0, Math.min(vals.length - 1, Math.round((x - PL) / (W - PL - PR) * (vals.length - 1))));
      xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('opacity', '.5');
      xd.setAttribute('cx', X(i)); xd.setAttribute('cy', Y(track[i])); xd.setAttribute('opacity', '1');
      if (signed) xd.setAttribute('stroke', signTone(track[i]));
      if (cfg.read) cfg.read(i);
    };
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', move);
    hit.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); xd.setAttribute('opacity', '0'); if (cfg.read) cfg.read(null); });
  };
  CHARTS.push({ host, draw });
  ro.observe(host);
  draw();
}

function toast(msg, label, fn) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (label) { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { fn(); el.remove(); }; el.appendChild(b); }
  document.body.appendChild(el);
  setTimeout(() => el.remove(), label ? 6000 : 3200);
}
function setRead(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

const VIEWS = [['overview', 'Overview', 'Overview'], ['journal', 'Journal', 'Journal'], ['shots', 'Screenshots', 'Shots'],
  ['edge', 'Edge', 'Edge'], ['size', 'Position size', 'Size'], ['rules', 'Rules', 'Rules'], ['reviews', 'Reviews', 'Reviews'], ['feedback', 'Feedback', 'Feedback'], ['data', 'Data', 'Data']];
const UI = {
  sf: { res: '', type: '' },                      // screenshot filters
  view: 'overview', range: 'All', calMonth: null,
  jf: { q: '', side: '', type: '', bias: '', conf: '', day: '', hour: '' },
  off: new Set()                                  // what-if exclusions
};
let ENTER = true;                                 // true while a view is being entered — plays entrance motion

function render(entering) {
  ENTER = !!entering;
  CHARTS.length = 0; ro.disconnect();
  renderNav();
  const view = document.getElementById('view');
  view.innerHTML = ({ overview: vOverview, journal: vJournal, shots: vShots, edge: vEdge, size: vSize, data: vData,
    rules: () => typeof vRules === 'function' ? vRules() : '',

    feedback: () => typeof vFeedback === 'function' ? vFeedback() : '' })[UI.view]();   // the rules checklist lives in the design
  if (entering && !REDUCED) { view.classList.remove('entering'); void view.offsetWidth; view.classList.add('entering'); setTimeout(() => view.classList.remove('entering'), 1400); }
  AFTER.splice(0).forEach(f => f());

}
/* nav is built once and only updated, so the highlight can slide between items */
function renderNav() {
  const nav = document.getElementById('nav'), tabs = document.getElementById('tabs');
  if (nav && !nav.dataset.built) {
    nav.innerHTML = '<div class="pill"></div>' + VIEWS.map(([v, l, sh], i) =>
      `<a href="#/${v}" data-v="${v}" data-k="${i + 1}">${icon(v)}<span class="nl">${l}</span><span class="ns">${sh}</span><kbd>${i + 1}</kbd></a>`).join('');
    nav.dataset.built = '1';
  }
  if (tabs && !tabs.dataset.built) {
    tabs.innerHTML = VIEWS.map(([v, l, sh]) => `<a href="#/${v}" data-v="${v}">${icon(v)}<span>${sh}</span></a>`).join('');
    tabs.dataset.built = '1';
  }
  document.querySelectorAll('#nav a, #tabs a').forEach(a => a.dataset.v === UI.view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  placePill();
}
/* the highlight takes the active link's own box, so it slides correctly in a
   sidebar, a top bar or a floating dock alike */
function placePill() {
  const nav = document.getElementById('nav'); if (!nav) return;
  const pill = nav.querySelector('.pill'), a = nav.querySelector('a[aria-current]');
  if (!pill || !a) return;
  pill.style.transform = `translate(${a.offsetLeft}px, ${a.offsetTop}px)`;
  pill.style.width = a.offsetWidth + 'px'; pill.style.height = a.offsetHeight + 'px';
}
window.addEventListener('resize', () => placePill());
const AFTER = [];                                 // work that needs the DOM: charts, measurements
const after = f => AFTER.push(f);
function go(v, patch) { if (patch) Object.assign(UI.jf, patch); if (location.hash !== '#/' + v) location.hash = '#/' + v; else { UI.view = v; render(true); } }

/* ---------------- OVERVIEW ---------------- */
function vOverview() {

    <div class="label">Net result${UI.range === 'All' ? '' : ' · last ' + UI.range.replace('D', ' days')}</div>

    ${kpi('Per trade', `<span class="${tone(S.avg)}" data-roll="avg" data-to="${S.avg}" data-fmt="money0">${money(S.avg, 0)}</span>`, `win <span class="n">${money(S.avgWin, 0)}</span> · loss <span class="n">${money(S.avgLoss, 0)}</span>`, spark(avgRoll, 'var(--accent)'))}
    ${kpi('Max drawdown', `<span class="down" data-roll="dd" data-to="${S.dd}" data-fmt="money0">${money(S.dd, 0)}</span>`, `worst run <span class="n">${S.worstRun}</span> losses`, spark(S.under, 'var(--down)'))}
    ${kpi('Streak', S.streak ? `<span class="${S.streakKind === 'W' ? 'up' : 'down'}">${S.streak}${S.streakKind}</span>` : '<span class="faint">—</span>',
      `best <span class="n">${S.bestRun}</span>W · worst <span class="n">${S.worstRun}</span>L`, formStrip(form))}
  </div>
  <div class="cols c-cal">
    ${calendarCard()}
    <section class="card"><div class="card-h"><h2>Where to focus</h2><span class="read">${esc(UI.range === 'All' ? 'all trades' : 'last ' + UI.range)}</span></div>

/* ---------------- CALENDAR — daily P&L, one hue per sign ---------------- */
function calendarCard() {
  const days = {};
  trades.filter(isClosed).forEach(t => { const d = days[t.date] || (days[t.date] = { p: 0, n: 0 }); d.p += pOf(t); d.n++; });
  const newest = trades.reduce((m, t) => t.date > m ? t.date : m, '') || ymd(new Date());
  const ym = UI.calMonth || newest.slice(0, 7);
  const [Y, M] = ym.split('-').map(Number);
  const first = new Date(Y, M - 1, 1), dim = new Date(Y, M, 0).getDate();
  const lead = (first.getDay() + 6) % 7;                        // Monday-first
  const gridStart = new Date(Y, M - 1, 1 - lead);                // the Monday the grid opens on
  const inMonth = Object.entries(days).filter(([d]) => d.startsWith(ym));
  const max = Math.max(1, ...inMonth.map(([, v]) => Math.abs(v.p)));
  const mTot = sum(inMonth.map(([, v]) => v.p)), greens = inMonth.filter(([, v]) => v.p > 0).length;
  const todayS = ymd(new Date());
  let cells = '', row = 0, col = 0, wk = { p: 0, n: 0 };
  const flushWeek = () => {
    const monday = ymd(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + row * 7));
    cells += `<button type="button" class="wk" data-row="${row}" style="--d:${(row * 8 + 7) * 13}ms" onclick="openWeek('${monday}')"
        aria-label="Week of ${fmtDay(monday)}: ${wk.n ? money(wk.p, 0) + ' over ' + plural(wk.n, 'trade') : 'no trades'}">
      <span class="p ${wk.n ? tone(wk.p) : 'faint'}">${wk.n ? kmoney(wk.p) : '—'}</span><span class="t">${wk.n ? plural(wk.n, 'trade') : 'week'}</span></button>`;
    row++; col = 0; wk = { p: 0, n: 0 };
  };
  for (let i = 0; i < lead; i++) { cells += `<div class="day pad" data-row="${row}"></div>`; col++; }
  for (let d = 1; d <= dim; d++) {
    const ds = `${ym}-${String(d).padStart(2, '0')}`, v = days[ds];
    const delay = `--d:${(row * 8 + col) * 13}ms`;
    if (v) {
      wk.p += v.p; wk.n += v.n;
      const c = toneVar(v.p), s = Math.min(Math.abs(v.p) / max, 1) * 46 + 9;
      cells += `<button type="button" class="day has ${ds === todayS ? 'today' : ''}" data-row="${row}" data-date="${ds}" data-p="${v.p}" data-n="${v.n}"
        style="${delay};--c:${c};background:${tint(c, s)}" aria-label="${fmtDay(ds)}: ${money(v.p, 0)} over ${plural(v.n, 'trade')}"
        onclick="openDay('${ds}')"><span class="d">${d}</span><span class="p">${kmoney(v.p)}</span></button>`;
    } else cells += `<button type="button" class="day empty-day ${ds === todayS ? 'today' : ''}" data-row="${row}" style="${delay}" onclick="openDay('${ds}')"
        aria-label="${fmtDay(ds)}: no trades"><span class="d">${d}</span></button>`;
    col++;
    if (col === 7) flushWeek();
  }
  if (col) { while (col < 7) { cells += `<div class="day pad" data-row="${row}"></div>`; col++; } flushWeek(); }
  after(() => {
    const cal = document.getElementById('cal');
    if (!cal) return;
    const idle = `<b class="n ${tone(mTot)}">${money(mTot, 0)}</b> · ${greens}/${inMonth.length} green days`;
    setRead('calRead', inMonth.length ? idle : 'no trades this month');
    cal.addEventListener('pointerover', e => {
      const c = e.target.closest('.day.has'); if (!c) return;
      cal.classList.add('hovering');
      cal.querySelectorAll('.hot,.wk-hot').forEach(x => x.classList.remove('hot', 'wk-hot'));
      c.classList.add('hot'); cal.querySelector(`.wk[data-row="${c.dataset.row}"]`)?.classList.add('wk-hot');
      setRead('calRead', `<b>${fmtDay(c.dataset.date)}</b> · <b class="n ${tone(+c.dataset.p)}">${money(+c.dataset.p, 0)}</b> · ${plural(+c.dataset.n, 'trade')}`);
    });
    cal.addEventListener('pointerleave', () => { cal.classList.remove('hovering'); cal.querySelectorAll('.hot,.wk-hot').forEach(x => x.classList.remove('hot', 'wk-hot')); setRead('calRead', inMonth.length ? idle : 'no trades this month'); });
  });
  const label = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  return `<section class="card" id="calCard"><div class="card-h"><h2>Calendar</h2>
      <div class="cal-nav"><button class="iconbtn" onclick="calShift(-1)" aria-label="Previous month">${icon('left')}</button><b>${label}</b>
      <button class="iconbtn" onclick="calShift(1)" aria-label="Next month">${icon('right')}</button></div></div>
    <div class="card-b"><div class="row" style="justify-content:space-between;align-items:baseline;margin:-4px 0 10px;gap:10px">
        <div class="read" id="calRead" style="font-size:11.5px;color:var(--ink3);min-height:18px"></div>
        <button class="link" onclick="openWeek(mondayOf('${todayS}'))">This week ${icon('arrow')}</button></div>
      <div class="cal" id="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun', 'Week'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div></section>`;
}
function calShift(k) {
  const newest = trades.reduce((m, t) => t.date > m ? t.date : m, '') || ymd(new Date());
  const [Y, M] = (UI.calMonth || newest.slice(0, 7)).split('-').map(Number);
  const d = new Date(Y, M - 1 + k, 1);
  UI.calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const card = document.getElementById('calCard');
  const tmp = document.createElement('div'); ENTER = false; AFTER.length = 0;
  tmp.innerHTML = calendarCard();
  card.replaceWith(tmp.firstElementChild);
  AFTER.splice(0).forEach(f => f());
  const cal = document.getElementById('cal');
  if (!REDUCED && cal) { cal.classList.add('entering'); setTimeout(() => cal.classList.remove('entering'), 900); }
}

          <div class="wi-delta"><div class="s">${UI.off.size ? `Skipping ${plural(cut, 'trade')} would have <b class="n ${tone(d)}">${d >= 0 ? 'added' : 'cost'} ${amt(d, 0)}</b>${K.n ? ` — ${money(K.avg, 0)} a trade instead of ${money(S.avg, 0)}` : ''}.` : 'Nothing switched off yet.'}</div></div>
        </div>

      </div>
    </div></section>`;
}
function toggleOff(k) { UI.off.has(k) ? UI.off.delete(k) : UI.off.add(k); render(false); }

function disciplineCard(list) {
  const w = summarise(list.filter(t => t.confirmed)), nw = summarise(list.filter(t => !t.confirmed));
  const cl = closedOf(list), share = rolling(cl.map(t => t.confirmed ? 100 : 0), 20), last = cl.slice(-20);
  const lastShare = last.length ? last.filter(t => t.confirmed).length / last.length : 0;
  const d = w.avg - nw.avg, ok = w.n >= 3 && nw.n >= 3;
  after(() => lineChart('discChart', { values: share, zero: false, fmt: v => Math.round(v) + '%', label: 'Share of trades that waited for confirmation', empty: 'Needs two closed trades.',
    read: i => setRead('discRead', i === null ? `last 20: <b>${pct(lastShare)}</b> waited` : `${fmtDay(cl[i].date)} · <b>${Math.round(share[i])}%</b> of the 20 before waited`) }));
  after(() => setRead('discRead', `last 20: <b>${pct(lastShare)}</b> waited`));
  return `<section class="card"><div class="card-h"><h2>Discipline dividend</h2><span class="read" id="discRead"></span></div>
    <div class="card-b"><div class="duo">
      <div><div class="label">Waited</div><div class="v ${tone(w.avg)}">${w.n ? money(w.avg, 0) : '—'}</div><div class="s">${plural(w.n, 'trade')}${w.n ? ' · ' + pct(w.winRate) + ' win' : ''}</div></div>
      <div><div class="label">Did not wait</div><div class="v ${tone(nw.avg)}">${nw.n ? money(nw.avg, 0) : '—'}</div><div class="s">${plural(nw.n, 'trade')}${nw.n ? ' · ' + pct(nw.winRate) + ' win' : ''}</div></div>
    </div>
    <p style="font-size:13px;color:var(--ink2);margin-top:12px">${ok ? (d >= 0 ? `Waiting is worth <b class="n up">${amt(d, 0)}</b> a trade.` : `Entering early is ahead by <b class="n down">${amt(d, 0)}</b> a trade — ${confidence(Math.min(w.n, nw.n))[0]}.`) : 'Three closed trades on each side are needed to compare.'}</p>
    <div class="chart sm" id="discChart"></div></div></section>`;
}

function progressCard(list) {
  const S = summarise(list), r = rolling(S.P, 10), cl = S.cl;
  const last10 = S.P.slice(-10), prev10 = S.P.slice(-20, -10);
  const a = last10.length ? sum(last10) / last10.length : 0, b = prev10.length ? sum(prev10) / prev10.length : null;
  const ymNow = cl.length ? cl[cl.length - 1].date.slice(0, 7) : null;
  const prevD = ymNow ? new Date(+ymNow.slice(0, 4), +ymNow.slice(5) - 2, 1) : null;
  const ymPrev = prevD ? `${prevD.getFullYear()}-${String(prevD.getMonth() + 1).padStart(2, '0')}` : null;
  const mA = summarise(list.filter(t => ymNow && t.date.startsWith(ymNow))), mB = summarise(list.filter(t => ymPrev && t.date.startsWith(ymPrev)));
  after(() => lineChart('progChart', { values: r, label: 'Rolling ten-trade average profit', empty: 'Needs two closed trades.',
    read: i => setRead('progRead', i === null ? 'ten-trade rolling average' : `${fmtDay(cl[i].date)} · <b class="n ${tone(r[i])}">${money(r[i], 0)}</b> a trade over the last ${Math.min(10, i + 1)}`) }));
  after(() => setRead('progRead', 'ten-trade rolling average'));
  const monthName = ym => ym ? new Date(ym + '-15').toLocaleDateString(undefined, { month: 'short' }) : '';
  return `<section class="card"><div class="card-h"><h2>Are you improving?</h2><span class="read" id="progRead"></span></div>
    <div class="card-b"><div class="duo">
      <div><div class="label">Last 10 trades</div><div class="v ${tone(a)}">${last10.length ? money(a, 0) : '—'}</div>
        <div class="s">${b === null ? 'per trade' : `per trade · was <span class="n">${money(b, 0)}</span>`}</div></div>
      <div><div class="label">${monthName(ymNow) || 'This month'}</div><div class="v ${tone(mA.total)}">${mA.n ? money(mA.total, 0) : '—'}</div>
        <div class="s">${mB.n ? `${monthName(ymPrev)}: <span class="n">${money(mB.total, 0)}</span> · ${pct(mA.winRate)} vs ${pct(mB.winRate)} win` : 'no earlier month to compare'}</div></div>
    </div>
    <p style="font-size:13px;color:var(--ink2);margin-top:12px">${b === null ? 'Twenty closed trades are needed to compare your last ten against the ten before.'
      : a > b ? `Your last ten trades are averaging <b class="n up">${amt(a - b, 0)}</b> more per trade than the ten before.`
      : `Your last ten are averaging <b class="n down">${amt(b - a, 0)}</b> less per trade than the ten before.`}</p>
    <div class="chart sm" id="progChart"></div></div></section>`;
}

function hoursCard(list) {
  const g = groupStats(list, hourOf);
  if (g.length < 1) return '';
  const m = new Map(g.map(c => [c.key, c.s]));
  const hs = g.map(c => c.key), h0 = Math.min(...hs), h1 = Math.max(...hs);
  const span = []; for (let h = h0; h <= h1; h++) span.push(h);
  const avgs = g.map(c => c.s.avg), top = Math.max(0, ...avgs), bot = Math.min(0, ...avgs), rng = (top - bot) || 1;
  const zeroPct = top / rng * 100;
  const nyA = span.indexOf(9), nyB = span.indexOf(15);
  const band = nyA >= 0 || nyB >= 0 ? (() => {
    const a = nyA >= 0 ? nyA : 0, b = nyB >= 0 ? nyB : span.length - 1;
    const n = span.length, col = `((100% - ${(n - 1) * 5}px) / ${n})`;
    return `<div class="nyband" style="left:calc(${a} * (${col} + 5px));width:calc(${b - a + 1} * ${col} + ${(b - a) * 5}px)"><span>NY</span></div>`; })() : '';
  const bars = span.map((h, i) => {
    const s = m.get(h), hh = String(h).padStart(2, '0');
    if (!s) return `<div class="hr ${h >= 9 && h <= 15 ? 'ny' : ''}"><span class="t">${hh}</span></div>`;
    const hgt = Math.abs(s.avg) / rng * 100, c = toneVar(s.avg);
    const pos = s.avg >= 0 ? `bottom:${(100 - zeroPct).toFixed(2)}%;height:${hgt.toFixed(2)}%` : `top:${zeroPct.toFixed(2)}%;height:${hgt.toFixed(2)}%`;
    return `<div class="hr has ${h >= 9 && h <= 15 ? 'ny' : ''}" data-read="${esc(`<b>${hh}:00</b> New York · ${plural(s.n, 'trade')} · ${pct(s.winRate)} win · <b class="${tone(s.avg)}">${money(s.avg, 0)}</b> a trade`)}">
      <div class="bar ${s.avg >= 0 ? 'pos' : 'neg'}" style="${pos};background:${tint(c, 78)};transform-origin:${s.avg >= 0 ? 'bottom' : 'top'};--d:${i * 30}ms"></div><span class="t">${hh}</span></div>`;
  }).join('');
  after(() => {
    const el = document.getElementById('hours'); if (!el) return;
    const idle = 'average profit per trade by entry hour';
    setRead('hrRead', idle);
    el.addEventListener('pointerover', e => { const c = e.target.closest('.hr.has'); if (!c) return; el.classList.add('hovering');
      el.querySelectorAll('.hot').forEach(x => x.classList.remove('hot')); c.classList.add('hot'); setRead('hrRead', c.dataset.read); });
    el.addEventListener('pointerleave', () => { el.classList.remove('hovering'); el.querySelectorAll('.hot').forEach(x => x.classList.remove('hot')); setRead('hrRead', idle); });
  });
  return `<section class="card"><div class="card-h"><h2>Time of day</h2><span class="read" id="hrRead"></span></div>
    <div class="card-b"><div class="hours" id="hours">${band}<div class="zero" style="top:calc((100% - 20px) * ${zeroPct / 100})"></div>${bars}</div></div></section>`;
}

function splitsCard(list) {
  const rowsFor = (title, pairs) => {
    const ss = pairs.map(([k, l, fn]) => [l, summarise(list.filter(fn))]).filter(([, s]) => s.n);
    if (!ss.length) return '';
    const max = Math.max(1, ...ss.map(([, s]) => Math.abs(s.avg)));
    return `<div class="label" style="margin:6px 0 2px">${title}</div>` + ss.map(([l, s]) => {
      const w = Math.abs(s.avg) / max * 50, c = toneVar(s.avg);
      return `<div class="split"><div class="l">${esc(l)}<small>${s.n} · ${pct(s.winRate)} win</small></div>
        <div class="trk"><i class="${s.avg >= 0 ? 'pos' : 'neg'}" style="${s.avg >= 0 ? 'left:50%' : `left:${50 - w}%`};width:${w}%;background:${tint(c, 80)}"></i></div>
        <div class="v ${tone(s.avg)}">${money(s.avg, 0)}</div></div>`;
    }).join('');
  };
  const body = rowsFor('Side', [['long', 'Long', t => t.direction === 'long'], ['short', 'Short', t => t.direction === 'short']]) +
    rowsFor('Entry timeframe', TFS.map(tf => [tf, tf, t => t.tf === tf]));
  return body ? `<section class="card"><div class="card-h"><h2>Splits</h2><span class="read">average per trade</span></div><div class="card-b">${body}</div></section>` : '';
}

/* ---------------- DATA — storage, cloud, backup, preferences ---------------- */

/* ---------------- DAY — one day's trades, opened from the calendar ---------------- */
const fmtDayLong = s => { const d = new Date(s + 'T12:00'); return isNaN(d) ? s : d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }); };
function dayRow(t) {
  const p = pOf(t);
  return `<button type="button" class="dr" onclick="openTrade(${t.id})" aria-label="${esc(t.direction)} ${esc(t.type || '')} at ${esc(t.time || '')}, ${p === null ? 'open' : money(p)}">
    <span class="tm">${esc(t.time || '—')}</span>

  </button>`;
}
function daySheet(ds) {

  const hasPrev = days.some(d => d < ds), hasNext = days.some(d => d > ds);
  return `
    <div class="sheet-h"><div><div class="label">${ts.length ? plural(ts.length, 'trade') : 'No trades'}</div><h2 id="sheetTitle">${fmtDayLong(ds)}</h2></div>
      <span class="grow"></span>
      <button class="iconbtn" onclick="dayStep(-1)" ${hasPrev ? '' : 'disabled style="opacity:.3"'} aria-label="Previous trading day" title="Previous trading day (←)">${icon('left')}</button>
      <button class="iconbtn" onclick="dayStep(1)" ${hasNext ? '' : 'disabled style="opacity:.3"'} aria-label="Next trading day" title="Next trading day (→)">${icon('right')}</button>
      <button class="iconbtn" onclick="closeSheet()" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">
      ${ts.length ? `
        <div><div class="big ${S.n ? tone(S.total) : 'faint'}" style="font-size:40px;margin-top:0">${S.n ? money(S.total) : 'Open'}</div>
          <div class="hero-sub">${S.n ? `<span><span class="n">${pct(S.winRate)}</span> win</span><span class="sep">·</span><span><span class="n">${S.wins}</span>W <span class="n">${S.losses}</span>L${S.be ? ` <span class="n">${S.be}</span>BE` : ''}</span>` : ''}
            ${S.open ? `<span class="sep">·</span><span><span class="n">${S.open}</span> open</span>` : ''}</div></div>

      <span class="grow"></span><button class="btn primary" type="button" onclick="openLog({date:'${ds}'})">${icon('plus')} Log a trade on this day</button></div>`;
}

/* ---------------- WEEK — one week's trades, best/worst, and takeaways ---------------- */
const mondayOf = ds => { const d = new Date(ds + 'T12:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
let WEEKS = (() => { try { return JSON.parse(localStorage.getItem(KEY + '.weeks') || '{}'); } catch (e) { return {}; } })();
function saveWeeks() { try { localStorage.setItem(KEY + '.weeks', JSON.stringify(WEEKS)); } catch (e) { /* a convenience only — never a data loss risk */ } }
/* debounced so a fast typist does not write to storage on every keystroke */
function weekNoteInput(monday, val) {
  clearTimeout(window._wkTimer);
  window._wkTimer = setTimeout(() => {
    WEEKS[monday] = { note: val, updatedAt: Date.now() };
    saveWeeks();
    setRead('weekSaved', 'Saved ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }));
  }, 400);
}
function openWeek(monday) { editing = null; BACK = null; SHEET = 'week:' + monday; renderSheet(); showSheet(); }
function weekStep(k) {
  const cur = SHEET && SHEET.startsWith('week:') ? SHEET.slice(5) : null; if (!cur) return;
  const d = new Date(cur + 'T12:00'); d.setDate(d.getDate() + k * 7);
  SHEET = 'week:' + ymd(d); renderSheet();
  const b = document.querySelector('#sheet .sheet-b'); if (b && !REDUCED) b.animate([{ opacity: 0, transform: `translateX(${k * 14}px)` }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.16,1,.3,1)' });
}
function weekRangeLabel(monday) {
  const start = new Date(monday + 'T12:00'), end = new Date(start); end.setDate(end.getDate() + 6);
  const s = start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const e = end.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  return `${s} – ${e}`;
}
function weekDayGroup(g) {
  const gp = sum(g.ts.filter(isClosed).map(pOf));
  return `<div class="day-h"><h3>${fmtDay(g.date)}</h3><span class="c">${plural(g.ts.length, 'trade')}</span><span class="p ${tone(gp)}">${money(gp, 0)}</span></div>${g.ts.map(dayRow).join('')}`;
}
function weekSheet(monday) {
  const start = new Date(monday + 'T12:00'), endD = new Date(start); endD.setDate(endD.getDate() + 6);
  const end = ymd(endD);
  const ts = trades.filter(t => t.date >= monday && t.date <= end).sort(byTime), S = summarise(ts), cl = S.cl;
  const best = cl.length ? cl.reduce((a, b) => pOf(b) > pOf(a) ? b : a) : null;
  const worst = cl.length ? cl.reduce((a, b) => pOf(b) < pOf(a) ? b : a) : null;
  const byDay = [];
  ts.forEach(t => { const g = byDay[byDay.length - 1]; if (g && g.date === t.date) g.ts.push(t); else byDay.push({ date: t.date, ts: [t] }); });
  const w = WEEKS[monday] || {};
  return `
    <div class="sheet-h"><div><div class="label">${plural(ts.length, 'trade')}</div><h2 id="sheetTitle">Week of ${weekRangeLabel(monday)}</h2></div>
      <span class="grow"></span>
      <button class="iconbtn" onclick="weekStep(-1)" aria-label="Previous week" title="Previous week (←)">${icon('left')}</button>
      <button class="iconbtn" onclick="weekStep(1)" aria-label="Next week" title="Next week (→)">${icon('right')}</button>
      <button class="iconbtn" onclick="closeSheet()" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">
      <div><div class="big ${S.n ? tone(S.total) : 'faint'}" style="font-size:40px;margin-top:0">${S.n ? money(S.total) : ts.length ? 'Open' : '—'}</div>
        <div class="hero-sub">${S.n ? `<span><span class="n">${pct(S.winRate)}</span> win</span><span class="sep">·</span><span><span class="n">${S.wins}</span>W <span class="n">${S.losses}</span>L${S.be ? ` <span class="n">${S.be}</span>BE` : ''}</span>` : ''}
          ${S.open ? `<span class="sep">·</span><span><span class="n">${S.open}</span> open</span>` : ''}</div></div>
      ${best && worst && best.id !== worst.id ? `<div class="duo">
          <div><div class="label">Best trade</div><div class="v up">${money(pOf(best))}</div>
            <div class="s"><button class="link" onclick="openTrade(${best.id})">${esc(best.type || best.direction)} · ${esc(fmtDay(best.date))} ${icon('arrow')}</button></div></div>
          <div><div class="label">Worst trade</div><div class="v down">${money(pOf(worst))}</div>
            <div class="s"><button class="link" onclick="openTrade(${worst.id})">${esc(worst.type || worst.direction)} · ${esc(fmtDay(worst.date))} ${icon('arrow')}</button></div></div>
        </div>` : ''}
      ${byDay.length ? `<div><div class="label" style="margin-bottom:6px">Day by day</div><div class="dlist">${byDay.map(weekDayGroup).join('')}</div></div>`
        : `<div class="empty-chart" style="height:110px">Nothing logged this week.</div>`}
      <div class="f"><label class="label" for="weekNote">Takeaways</label>
        <textarea class="in" id="weekNote" rows="5" placeholder="What worked this week, what didn't, what to change next week." oninput="weekNoteInput('${monday}', this.value)">${esc(w.note || '')}</textarea>
        <span class="hint faint" id="weekSaved">${w.updatedAt ? 'Saved ' + new Date(w.updatedAt).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : 'Kept on this device only'}</span></div>
    </div>

/* ---------------- POSITION SIZE — NQ / MNQ from a fixed risk budget ---------------- */
const FUT = { NQ: { pt: 20, tick: 0.25 }, MNQ: { pt: 2, tick: 0.25 } };   // $ per index point; both tick in 0.25
const CALC_DEFAULTS = { account: '50000', riskMode: 'pct', riskPct: '1', riskUsd: '500', stopMode: 'prices', entry: '', stop: '', pts: '20', contract: 'MNQ' };
let SIZE_NOTE = null;
let CALC = (() => { try { return Object.assign({}, CALC_DEFAULTS, JSON.parse(localStorage.getItem(KEY + '.calc') || '{}')); } catch (e) { return Object.assign({}, CALC_DEFAULTS); } })();
function saveCalc() { try { localStorage.setItem(KEY + '.calc', JSON.stringify(CALC)); } catch (e) { /* a convenience only */ } }
const toTick = x => Math.round(x / 0.25) * 0.25;
const px = x => x.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function sizing() {
  const acct = parseAmount(CALC.account);
  const budget = CALC.riskMode === 'pct' ? acct * parseAmount(CALC.riskPct) / 100 : parseAmount(CALC.riskUsd);
  let pts, dir = null, entry = null, stop = null;
  if (CALC.stopMode === 'prices') {
    entry = parseAmount(CALC.entry); stop = parseAmount(CALC.stop);
    pts = isFinite(entry) && isFinite(stop) ? Math.abs(entry - stop) : NaN;
    if (pts > 0) dir = stop < entry ? 'long' : 'short';
  } else pts = parseAmount(CALC.pts);
  const out = { acct, budget, pts, dir, entry, stop, ok: budget > 0 && pts > 0 };
  if (!out.ok) return out;
  const per = { NQ: pts * FUT.NQ.pt, MNQ: pts * FUT.MNQ.pt };
  const fit = r => Math.floor(r + 1e-9);
  const nq = fit(budget / per.NQ), mnq = fit(budget / per.MNQ), mixM = fit((budget - nq * per.NQ) / per.MNQ);
  return Object.assign(out, { per, ticks: pts / 0.25,
    options: [
      { key: 'NQ', label: 'NQ only', q: `${nq} NQ`, n: nq, risk: nq * per.NQ },
      { key: 'MNQ', label: 'MNQ only', q: `${mnq} MNQ`, n: mnq, risk: mnq * per.MNQ },
      { key: 'MIX', label: 'Closest fit', q: nq && mixM ? `${nq} NQ + ${mixM} MNQ` : nq ? `${nq} NQ` : `${mixM} MNQ`, n: nq + mixM, risk: nq * per.NQ + mixM * per.MNQ }
    ] });
}
function sizeResult() {
  const r = sizing();
  if (!r.ok) return `<div class="empty-chart" style="height:220px">${!(r.budget > 0) ? 'Set the account size and how much of it to risk.' : CALC.stopMode === 'prices' ? 'Enter the entry and the stop.' : 'Enter the stop distance in points.'}</div>`;
  const chosen = r.options.find(o => o.key === CALC.contract), n = chosen.n, risk = chosen.risk;
  const used = Math.min(1, risk / r.budget);
  const best = r.options.reduce((a, b) => b.risk > a.risk ? b : a);
  const unit = CALC.contract === 'NQ' ? 'NQ' : 'MNQ';
  const warn = n === 0 ? `<div class="alert warn"><div><b>Below one ${unit} at this stop.</b>One ${unit} risks ${amt(r.per[unit], 0)} and your budget is ${amt(r.budget, 0)}.
      ${unit === 'NQ' && r.options[1].n ? `Use ${r.options[1].q} instead.` : 'Widen the budget or tighten the stop.'}</div></div>` : '';
  const targets = r.dir && n ? [1, 2, 3].map(R => {
    const price = toTick(r.entry + (r.dir === 'long' ? 1 : -1) * R * r.pts);
    return `<div><div class="label">${R}R</div><div class="n" style="font-size:14px;font-weight:600;margin-top:2px">${px(price)}</div><div class="s up n" style="font-size:12px">${money(R * risk, 0)}</div></div>`;
  }).join('') : '';
  SIZE_NOTE = { direction: r.dir || 'long', notes: `${chosen.q} · stop ${r.pts} pts · risk ${amt(risk, 0)}` };
  return `
    <div class="label">Contracts${r.dir ? ` · <span class="side ${r.dir}" style="font-size:10px">${r.dir}</span>` : ''}</div>
    <div class="size-big" style="margin-top:6px">${CALC.contract === 'MIX'
      ? `<span style="font-size:.62em;letter-spacing:-.04em">${esc(chosen.q)}</span>`
      : `<span data-roll="sz" data-to="${n}" data-fmt="int">${n}</span><small>${CALC.contract}</small>`}</div>
    <div style="margin-top:14px"><div class="meter"><i style="width:${(used * 100).toFixed(1)}%"></i></div>
      <div class="row" style="justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink2)">
        <span>risk <b class="n" style="color:var(--ink)">${amt(risk, 0)}</b> of ${amt(r.budget, 0)}</span><span class="n">${Math.round(used * 100)}% used</span></div></div>
    ${warn}
    <div class="opts">${r.options.map(o => `<div class="opt ${o === best && best.risk > risk + 0.005 ? 'best' : ''}" ${o === best && best.risk > risk + 0.005 ? 'title="Uses more of your budget than your pick"' : ''}>
        <span class="faint">${o.label}</span><span class="q">${o.q}</span><span class="n" style="text-align:right">${amt(o.risk, 0)}<small class="faint" style="margin-left:6px">${Math.round(o.risk / r.budget * 100)}%</small></span></div>`).join('')}</div>
    <div class="row faint" style="font-size:12px;gap:14px">
      <span>${amt(r.per.NQ, 0)} per NQ</span><span>${amt(r.per.MNQ, 0)} per MNQ</span><span>${r.pts} pts = ${Number.isInteger(r.ticks) ? r.ticks : r.ticks.toFixed(1)} ticks</span></div>
    ${targets ? `<div><div class="label" style="margin-bottom:7px">Targets for ${chosen.q}</div><div class="targets">${targets}</div></div>` : ''}
    ${n || chosen.key === 'MIX' ? `<div class="row"><span class="grow"></span><button class="btn primary" onclick="openLog(SIZE_NOTE)">${icon('plus')} Log this trade</button></div>` : ''}`;
}
function calcSet(k, v) { CALC[k] = v; saveCalc(); const o = document.getElementById('sizeOut'); if (o) { o.innerHTML = sizeResult(); rolls(o); } paintCalcHints(); }
function calcSeg(k) { return (v, btn) => { CALC[k] = v; saveCalc(); if (btn) segSet(btn); setTimeout(() => render(false), 140); }; }

  return `

  <div class="calc">

      <div class="f"><span class="label">Account size</span>${inp('account', CCY.symbol, '50,000')}</div>

        ${seg([['pct', '% of account'], ['usd', 'Fixed amount']], CALC.riskMode, 'calcRisk', 'lg')}
        ${CALC.riskMode === 'pct' ? inp('riskPct', '', '1', '%') : inp('riskUsd', CCY.symbol, '500')}</div>
      <div class="f"><span class="label">Stop <span id="stopHint" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink2)"></span></span>
        ${seg([['prices', 'Entry & stop'], ['points', 'Distance']], CALC.stopMode, 'calcStop', 'lg')}
        ${CALC.stopMode === 'prices' ? `<div class="pair">${inp('entry', '', 'Entry')}${inp('stop', '', 'Stop')}</div>` : inp('pts', '', '20', 'pts')}</div>
      <div class="f"><span class="label">Contract</span>${seg([['NQ', 'NQ · $20/pt'], ['MNQ', 'MNQ · $2/pt'], ['MIX', 'Closest fit']], CALC.contract, 'calcContract', 'lg')}</div>

    </div></section>

function nyNow() {
  try {
    const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
    const g = k => p.find(x => x.type === k).value;
    return { date: `${g('year')}-${g('month')}-${g('day')}`, time: `${g('hour') === '24' ? '00' : g('hour')}:${g('minute')}` };
  } catch (e) { return { date: today(), time: '09:45' }; }
}
const DEFAULTS = () => { const n = nyNow(); return { date: n.date, time: n.time, direction: 'long', bias: '', tf: tfFor(sessionOf(n.time)), type: '', outcome: 'win', amount: '', confirmed: false, notes: '',
  reviewSaw: '', reviewPlan: '', reviewChange: '', reviewOpen: false, shotPending: null, shotOf: null }; };
let ED = DEFAULTS(), PENDING_URL = null, SHEET = null, CARRY = null, BACK = null;

function openLog(pre) {

function openTrade(id) {

  BACK = sheetOpen() && SHEET && (SHEET.startsWith('day:') || SHEET.startsWith('week:')) ? SHEET : null;   // opened from a day or week — offer the way back
  editing = null; SHEET = 'detail:' + id; renderSheet(); showSheet();
}
function openDay(ds) { editing = null; BACK = null; SHEET = 'day:' + ds; renderSheet(); showSheet(); }
/* step to the previous / next day that has trades */
function dayStep(k) {
  const cur = SHEET && SHEET.startsWith('day:') ? SHEET.slice(4) : null; if (!cur) return;
  const days = Array.from(new Set(trades.map(t => t.date))).sort();
  const next = k > 0 ? days.find(d => d > cur) : days.filter(d => d < cur).pop();
  if (!next) return toast(k > 0 ? 'No later trading day' : 'No earlier trading day');
  SHEET = 'day:' + next; renderSheet();
  const b = document.querySelector('#sheet .sheet-b'); if (b && !REDUCED) b.animate([{ opacity: 0, transform: `translateX(${k * 14}px)` }, { opacity: 1, transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.16,1,.3,1)' });
}

  ED = Object.assign(DEFAULTS(), { date: t.date, time: t.time || '', direction: t.direction || 'long', bias: t.bias || '', tf: t.tf || '15m', type: t.type || '',
    outcome: p === null ? 'open' : p < 0 ? 'loss' : p === 0 ? 'be' : 'win', amount: p === null || p === 0 ? '' : String(Math.abs(p)), confirmed: !!t.confirmed, notes: t.notes || '',
    reviewSaw: t.reviewSaw || '', reviewPlan: t.reviewPlan || '', reviewChange: t.reviewChange || '', reviewOpen: !!(t.reviewSaw || t.reviewPlan || t.reviewChange),

/* 430 · 430.50 · 1,200 · 12,5 · 1.200,50 — a comma followed by one or two digits is a decimal comma */
function parseAmount(raw) {
  let s = String(raw || '').trim().replace(/[^\d.,]/g, '');
  if (!s) return NaN;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > ld) { const dec = s.length - lc - 1; s = dec > 0 && dec <= 2 ? s.slice(0, lc).replace(/[.,]/g, '') + '.' + s.slice(lc + 1) : s.replace(/,/g, ''); }
  else s = s.replace(/,/g, '');
  return Math.abs(parseFloat(s));
}

async function submitTrade(e) {
  if (e) e.preventDefault();
  syncDraft();
  if (!ED.bias) { toast('Pick the bias first'); document.getElementById('biasChips')?.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 260 }); return; }
  const amt = parseAmount(ED.amount);
  if (ED.outcome !== 'open' && ED.outcome !== 'be' && !isFinite(amt)) { toast('Enter the amount, or mark it Break even or Open'); document.getElementById('f-amount')?.focus(); return; }
  const t = { date: ED.date, time: ED.time, direction: ED.direction, bias: ED.bias, tf: ED.tf, type: ED.type,
    profit: ED.outcome === 'open' ? null : ED.outcome === 'be' ? 0 : ED.outcome === 'loss' ? -Math.abs(amt) : Math.abs(amt),
    confirmed: !!ED.confirmed, notes: (ED.notes || '').trim(),
    reviewSaw: (ED.reviewSaw || '').trim(), reviewPlan: ED.reviewPlan || '', reviewChange: (ED.reviewChange || '').trim() };
  const pending = ED.shotPending, keptShot = !!ED.shotOf;
  const wasEditing = editing, id = editing || Date.now();
  if (pending) { try { await putShot(id, pending); t.shot = true; } catch (err) { t.shot = false; toast('The trade saved, but the chart would not store'); } }
  else t.shot = keptShot;
  if (wasEditing) {
    const i = trades.findIndex(x => x.id === wasEditing);
    if (!pending && !keptShot && trades[i].shot) await dropShot(id);
    if (pending) { const u = SHOT_URL.get(String(id)); if (u) { URL.revokeObjectURL(u); SHOT_URL.delete(String(id)); } }
    trades[i] = Object.assign(trades[i], t, { updatedAt: Date.now(), synced: null });
    if (pending || !t.shot) trades[i].asset = null;          // a replaced or removed chart must not be served from the cloud copy
    PENDING_URL = null; ED.shotPending = null;
    save(); closeSheet(); render(false);
    return toast('Trade updated');
  }
  t.id = id; t.updatedAt = Date.now();
  trades.push(t);
  CARRY = { date: t.date, time: t.time, bias: t.bias, tf: t.tf, direction: t.direction };
  PENDING_URL = null; ED.shotPending = null;
  save(); closeSheet(); render(false);
  toast(t.profit === null ? 'Logged — still open' : t.profit === 0 ? 'Logged — break even' : 'Logged ' + money(t.profit));
}
function del(id) {
  const i = trades.findIndex(t => t.id === id); if (i < 0) return;
  const [gone] = trades.splice(i, 1);
  PENDING_DELETES.add(String(id));
  closeSheet(); save(); render(false);
  let undone = false;
  toast('Trade deleted', 'Undo', () => { undone = true; PENDING_DELETES.delete(String(id)); gone.synced = null; trades.splice(i, 0, gone); save(); render(false); });
  if (gone.shot) setTimeout(() => { if (!undone) dropShot(id); }, 6200);   // the chart goes only once undo is off the table
}

/* =====================================================================
   7. DEMO — sample trades held in memory only
   ---------------------------------------------------------------------
   An empty journal opens on made-up trades so every screen has something
   to show. Nothing about them can reach storage or the cloud: save,
   weekly notes, sync and backup are all switched off while they show.
   The first real trade you log clears them.
   ===================================================================== */
let DEMO = false, DEMO_SET = null;

/* a candlestick chart that looks like a real screenshot of the setup:
   impulse, pullback into equilibrium, failure swing, continuation */
function demoChart(dir, won, seedN) {
  let sd = seedN * 7919 + 13;
  const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const W = 960, H = 540, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#121418'; x.fillRect(0, 0, W, H);
  x.strokeStyle = 'rgba(255,255,255,.045)'; x.lineWidth = 1;
  for (let g = 1; g < 9; g++) { x.beginPath(); x.moveTo(0, g * 60); x.lineTo(W, g * 60); x.stroke(); }
  for (let g = 1; g < 12; g++) { x.beginPath(); x.moveTo(g * 80, 0); x.lineTo(g * 80, H); x.stroke(); }
  const s = dir === 'long' ? 1 : -1, N = 72, px = []; let p = 0;
  for (let i = 0; i < N; i++) {
    let drift;
    if (i < 24) drift = 1.25 * s;                        // impulse
    else if (i < 42) drift = -0.62 * s;                  // pullback into EQ
    else if (i < 47) drift = (i < 45 ? -0.9 : 0.4) * s;  // the failure swing
    else drift = won ? 1.35 * s : -0.55 * s;             // continuation — or not
    p += drift + (r() - .5) * 2.4; px.push(p);
  }
  const lo = Math.min(...px) - 6, hi = Math.max(...px) + 6, Y = v => 40 + (1 - (v - lo) / (hi - lo)) * (H - 90);
  const hiA = s > 0 ? Math.max(...px.slice(0, 26)) : Math.min(...px.slice(0, 26)), loA = px[0];
  const eq = (hiA + loA) / 2;
  x.setLineDash([6, 6]); x.strokeStyle = 'rgba(227,160,66,.55)'; x.beginPath(); x.moveTo(0, Y(eq)); x.lineTo(W, Y(eq)); x.stroke(); x.setLineDash([]);
  x.fillStyle = 'rgba(227,160,66,.8)'; x.font = '600 13px ui-monospace, Menlo, monospace'; x.fillText('EQ', W - 36, Y(eq) - 6);
  let prev = px[0];
  for (let i = 0; i < N; i++) {
    const o = prev, cl = px[i], h = Math.max(o, cl) + r() * 2.2, l = Math.min(o, cl) - r() * 2.2, cx = 20 + i * 12.9;
    const up = cl >= o; x.strokeStyle = x.fillStyle = up ? '#26a69a' : '#ef5350';
    x.beginPath(); x.moveTo(cx, Y(h)); x.lineTo(cx, Y(l)); x.stroke();
    x.fillRect(cx - 4, Y(Math.max(o, cl)), 8, Math.max(1.5, Math.abs(Y(o) - Y(cl))));
    prev = cl;
  }
  const ei = 47, ex = 20 + ei * 12.9, ey = Y(px[ei]);
  x.fillStyle = '#e8eaed'; x.beginPath();
  if (s > 0) { x.moveTo(ex, ey + 14); x.lineTo(ex - 7, ey + 26); x.lineTo(ex + 7, ey + 26); } else { x.moveTo(ex, ey - 14); x.lineTo(ex - 7, ey - 26); x.lineTo(ex + 7, ey - 26); }
  x.fill();
  x.fillStyle = 'rgba(232,234,237,.82)'; x.font = '600 15px ui-sans-serif, system-ui, sans-serif'; x.fillText('NQ1!  ·  5  ·  CME', 22, 28);
  return c.toDataURL('image/jpeg', 0.8);
}

function makeDemo() {
  let sd = 20260928;
  const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const BW = ['Bullish · expanding', 'Bullish · expanding', 'Bullish · expanding', 'Bullish · choppy', 'Bullish · choppy',
              'Bearish · expanding', 'Bearish · expanding', 'Bearish · choppy', 'Bearish · choppy', 'Range-bound'];
  const edge = { 'Continuation out of EQ': .63, 'Reversion to EQ': .5, 'Premature continuation': .3 };
  const notes = ['Clean sweep of the prior high, then the failure swing held.', 'Waited through two fake-outs; third push confirmed.',
    'Took it early off the first wick — should have waited.', 'EQ held to the tick. Textbook continuation.',
    'Chopped around the open, only entered after the 10:00 range broke.', 'News spike took the stop, then the move went without me.',
    'Scaled out too fast at 1R, runner would have paid 3R.', 'Bias was right, location was not — entered from premium.'];
  const saw = ['Higher timeframe impulse, pullback into EQ, failure swing on the 5m.', 'Range-bound open, then displacement through the Asia high.',
    'Clean retest of the breakout level with a rejection wick.', 'Liquidity taken below the prior low, then a strong reclaim.'];
  const change = ['Nothing — this is the setup.', 'Wait for the candle to close before entering.', 'Size down on choppy bias days.',
    'Leave a runner instead of closing everything at 1R.', 'Skip it — premature continuations keep costing me.'];
  const out = [], end = new Date(); end.setHours(12, 0, 0, 0);
  const d = new Date(end); d.setDate(d.getDate() - 96);
  let id = 1700000000000, k = 0;
  const days = [];
  while (d < end) { d.setDate(d.getDate() + 1); if (d.getDay() % 6 !== 0) days.push(new Date(d)); }
  days.forEach((day, di) => {
    const n = rnd() < .26 ? 0 : rnd() < .68 ? 1 : 2;
    for (let j = 0; j < n; j++) {
      const bias = pick(BW), type = pick(CONT_TYPES);
      const dir = bias.startsWith('Bull') ? 'long' : bias.startsWith('Bear') ? 'short' : (rnd() < .5 ? 'long' : 'short');
      const ny = rnd() < .8;
      const h = ny ? 9 + Math.floor(rnd() * 6) : 3 + Math.floor(rnd() * 5);
      const m = ny && h === 9 ? 30 + Math.floor(rnd() * 29) : Math.floor(rnd() * 59);
      const conf = rnd() < .7, progress = di / days.length;
      const p = edge[type] + (bias.includes('expanding') ? .1 : bias === 'Range-bound' ? -.22 : -.04) + (conf ? .08 : -.15) + progress * .1;
      const won = rnd() < p, last = di === days.length - 1 && j === 0;
      const profit = last ? null : won ? Math.round((180 + rnd() * 520) / 5) * 5 : -Math.round((120 + rnd() * 160) / 5) * 5;
      const tf = rnd() < .92 ? (ny ? '5m' : '15m') : (ny ? '15m' : '5m');
      const t = { id: id + k * 60000, date: ymd(day), time: String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'),
        direction: dir, bias, tf, type, profit, confirmed: conf, notes: rnd() < .36 ? pick(notes) : '', shot: false,
        reviewSaw: '', reviewPlan: '', reviewChange: '', updatedAt: id + k };
      if (rnd() < .55) { t.reviewSaw = pick(saw); t.reviewPlan = conf ? (rnd() < .85 ? 'yes' : 'partial') : pick(['partial', 'no', 'no']); t.reviewChange = pick(change); }
      out.push(t); k++;
    }
  });
  const shots = new Map();
  out.filter((t, i) => i % 4 === 1).slice(-16).forEach((t, i) => { t.shot = true; shots.set(t.id, demoChart(t.direction, (t.profit || 0) > 0, i + 1)); });
  const weeks = {}, wk = mondayOf(ymd(end));
  const wnotes = ['Best week in a month. Every winner was an expanding-bias continuation out of EQ — the premature ones are still the leak.',
    'Two revenge trades after the Tuesday loss. Rule for next week: one loss on a choppy day ends the day.',
    'Quiet week, fewer trades, better trades. Waited for confirmation on every single entry.'];
  [0, 7, 14].forEach((back, i) => { const m = new Date(wk + 'T12:00'); m.setDate(m.getDate() - back); weeks[ymd(m)] = { note: wnotes[i], updatedAt: Date.now() - back * 864e5 }; });
  return { trades: out, shots, weeks };
}

function enterDemo() {
  if (!DEMO_SET) DEMO_SET = makeDemo();
  DEMO = true;
  trades = DEMO_SET.trades.map(t => Object.assign({}, t));
  DEMO_SET.shots.forEach((u, id) => SHOT_URL.set(String(id), u));
  WEEKS = Object.assign({}, DEMO_SET.weeks);
  document.documentElement.classList.add('is-demo');
  paintDemoBar();
}
function exitDemo() {
  if (!DEMO) return;
  DEMO = false; trades = []; editing = null;
  PENDING_DELETES.clear();
  if (DEMO_SET) DEMO_SET.shots.forEach((u, id) => SHOT_URL.delete(String(id)));
  try { WEEKS = JSON.parse(localStorage.getItem(KEY + '.weeks') || '{}'); } catch (e) { WEEKS = {}; }
  ROLL.clear(); UI.off.clear(); UI.calMonth = null;
  document.documentElement.classList.remove('is-demo');

}
function clearDemo() { exitDemo(); render(true); toast('Samples cleared — this journal is yours now'); }
function paintDemoBar() {
  let bar = document.getElementById('demobar');

    <button class="btn sm" type="button" onclick="clearDemo()">Start empty</button>` : '';
}

/* while samples show, nothing can be written, synced or backed up */
const _save = save;             save = function () { return DEMO ? true : _save(); };
const _saveWeeks = saveWeeks;   saveWeeks = function () { if (!DEMO) _saveWeeks(); };
const _syncPush = syncPush;     syncPush = async function (m) { if (DEMO) { if (m) toast('Sample trades are never synced'); return; } return _syncPush(m); };
const _copyBackup = copyBackup; copyBackup = async function (w) { if (DEMO) return toast('Nothing to back up yet — these are sample trades'); return _copyBackup(w); };

const _wipe = wipe;             wipe = function () { return DEMO ? clearDemo() : _wipe(); };

/* editing a sample trade keeps any attached chart in memory, never in real image storage */
const _putShot = putShot;       putShot = async function (id, blob) {
  if (!DEMO) return _putShot(id, blob);
  SHOT_URL.set(String(id), await blobToDataURL(blob)); return true;
};

/* =====================================================================
   8. START — after the design's own script has had its say
   ===================================================================== */
function boot() {
  const realEmpty = !trades.length;
  if (realEmpty && DESIGN.demo) enterDemo();
  paintDemoBar();
  applyTheme();
  route();
  checkStorage(true).then(() => { if (UI.view === 'data') render(false); });
  (async () => {
    const cdb = await cap('db');
    if (!cdb) { SYNC = { state: 'off' }; return paintSync(); }
    SYNC = { state: 'ok', at: null }; paintSync();
    if (realEmpty) {
      const wasDemo = DEMO; if (wasDemo) exitDemo();
      const n = await syncPull(false);           // a cleared browser adopts the cloud copy
      if (n) { toast(`Restored ${plural(n, 'trade')} from your cloud backup`); render(true); }

<script>
/* Pulse: a greeting, a bento overview and activity rings */

/* The greeting follows Luca's own clock (Melbourne), not the market's:
   morning 6:00–11:59, afternoon 11:59–21:00, evening 21:00–6:00. */
function melGreeting() {
  try {
    const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Australia/Melbourne', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    const g = k => +p.find(x => x.type === k).value, m = g('hour') * 60 + g('minute');
    return m >= 360 && m < 719 ? 'Good morning' : m >= 719 && m < 1260 ? 'Good afternoon' : 'Good evening';
  } catch (e) { return 'Welcome back'; }
}
/* the header keeps the market's side of the clock: which New York session is live */
function puGreet() {
  const set = (id, t) => { const e = document.getElementById(id); if (e) e.textContent = t; };
  set('puHello', sessionOf(nyNow().time) + ' session');
  set('puDate', new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }));
  set('puTitle', melGreeting() + ', Luca');
}
setInterval(puGreet, 30000);
const _puRender = render;
render = function (e) { _puRender(e); puGreet(); };

/* Rings get the equity chart's treatment: a gradient arc on a textured track, a
   blurred glow under it, a light that runs the length of the arc every few
   seconds, and a ping where the arc ends. Each ring: [tone, light end, deep end]. */
const RING_TONES = [['var(--up)', '#C9F7DD', '#2FC79B'], ['var(--accent)', '#FFE3C8', '#D9955F'], ['var(--violet)', '#C8F6FA', '#1A9AA6']];
const RING_W = 15;
function ringDefs() {
  return `<defs><filter id="rgBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    ${RING_TONES.map(([, a, b], k) => `<linearGradient id="rgG${k}" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="150" y2="150"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`).join('')}</defs>`;
}
function ring(r, v, _color, k) {
  v = Math.max(0, Math.min(1, v || 0));
  const C = 2 * Math.PI * r, off = C * (1 - v), [tone] = RING_TONES[k];
  const arc = extra => `<circle class="pu-arc" cx="80" cy="80" r="${r}" fill="none" stroke="url(#rgG${k})" stroke-width="${RING_W}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-off="${off.toFixed(2)}" style="--k:${k}" transform="rotate(-90 80 80)" ${extra}/>`;
  const a = (-90 + 360 * v) * Math.PI / 180, ex = 80 + r * Math.cos(a), ey = 80 + r * Math.sin(a);
  const seg = Math.min(C * .08, C * v);
  return `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${tone}" stroke-opacity=".1" stroke-width="${RING_W}"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${tone}" stroke-opacity=".22" stroke-width="${RING_W - 6}" stroke-dasharray="1 4.2" transform="rotate(-90 80 80)"/>
    ${v ? arc(`filter="url(#rgBlur)" opacity=".55"`) : ''}${v ? arc('') : ''}
    ${v > .04 ? `<circle class="rg-comet" cx="80" cy="80" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="${RING_W - 7}" stroke-linecap="round" transform="rotate(-90 80 80)"
      style="--k:${k}; --c0:${seg.toFixed(2)}; --c1:${(-(C * v - seg)).toFixed(2)}" stroke-dasharray="${seg.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${seg.toFixed(2)}"/>` : ''}
    ${v ? `<circle class="rg-ping" cx="${ex.toFixed(2)}" cy="${ey.toFixed(2)}" r="${(RING_W / 2).toFixed(1)}" fill="none" stroke="${tone}" stroke-width="2" style="--k:${k}"/>` : ''}`;
}
function vOverview() {
  if (!trades.length) return welcome();
  const list = inRange(trades, UI.range), S = summarise(list), cl = S.cl;
  const eq = []; cl.reduce((a, t) => { a += pOf(t); eq.push(a); return a; }, 0);
  const waited = cl.length ? cl.filter(t => t.confirmed).length / cl.length : 0;
  const rev = list.filter(t => t.reviewPlan), plan = rev.length ? rev.filter(t => t.reviewPlan === 'yes').length / rev.length : null;
  const sub = `<span><span class="n">${S.n}</span> closed</span><span class="sep">·</span><span><span class="n">${S.pf === Infinity ? '∞' : S.pf.toFixed(2)}</span> profit factor</span>${S.open ? `<span class="sep">·</span><span><span class="n">${S.open}</span> open</span>` : ''}`;
  after(() => lineChart('eqChart', {
    /* one point per closed trade, in the order they were taken — each trade is a dot in its own result colour */
    values: [0].concat(eq), label: `Cumulative profit after each of ${S.n} closed trades`,
    marks: [null].concat(cl.map(t => pOf(t) > 0 ? 'up' : pOf(t) < 0 ? 'down' : 'accent')),
    xl: cl.length ? [`#1 · ${dshow(cl[0].date)}`, `#${cl.length} · ${dshow(cl[cl.length - 1].date)}`] : null,

      const t = cl[i - 1];
      return `<span>Trade <span class="n">${i}</span> of <span class="n">${cl.length}</span></span><span class="sep">·</span><span><span class="n">${fmtDay(t.date)}</span> ${esc(t.time || '')}</span><span class="sep">·</span><span>${esc(t.type || t.direction)}</span><span class="sep">·</span><span class="n ${tone(pOf(t))}">${money(pOf(t))}</span><span class="sep">→</span><span class="n">${money(eq[i - 1], 0)}</span>`;
    })())
  }));
  after(() => requestAnimationFrame(() => document.querySelectorAll('.pu-arc').forEach(a => a.style.strokeDashoffset = a.dataset.off)));
  const stat = (cls, label, v, s, extra) => `<section class="card tile ${cls}"><div class="label">${label}</div><div class="v">${v}</div><div class="s">${s}</div>${extra || ''}</section>`;
  return `
  <div class="head"><div><div class="label">Overview</div><h1 id="puTitle">${melGreeting()}, Luca</h1></div><span class="grow"></span>${rangeSeg()}</div>
  <div class="bento">
    <section class="card tile t-hero">
      <div class="label">Net result${UI.range === 'All' ? '' : ' · last ' + UI.range.replace('D', ' days')}</div>
      <div class="big ${tone(S.total)}" data-roll="net" data-to="${S.total}" data-fmt="money0">${money(S.total, 0)}</div>
      <div class="hero-sub" id="heroSub">${sub}</div>
      <div class="chart" id="eqChart"></div>
    </section>
    <section class="card tile t-rings">
      <div class="label">Your rings</div>
      <div class="pu-rings">
        <svg viewBox="0 0 160 160" role="img" aria-label="Win rate ${pct(S.winRate)}, waited for confirmation ${pct(waited)}, followed the plan ${plan === null ? 'not reviewed' : pct(plan)}">
          ${ringDefs()}${ring(66, S.winRate, 'var(--up)', 0)}${ring(49, waited, 'var(--accent)', 1)}${ring(32, plan || 0, 'var(--violet)', 2)}</svg>
        <ul>
          <li><i style="background:var(--up); color:var(--up)"></i><span>Win rate</span><b class="n">${pct(S.winRate)}</b></li>
          <li><i style="background:var(--accent); color:var(--accent)"></i><span>Waited to confirm</span><b class="n">${pct(waited)}</b></li>
          <li><i style="background:var(--violet); color:var(--violet)"></i><span>Followed the plan</span><b class="n">${plan === null ? '—' : pct(plan)}</b></li>
        </ul>
      </div>
    </section>
    ${stat('t-a', 'Per trade', `<span class="${tone(S.avg)}" data-roll="avg" data-to="${S.avg}" data-fmt="money0">${money(S.avg, 0)}</span>`, `win ${money(S.avgWin, 0)} · loss ${money(S.avgLoss, 0)}`, spark(rolling(S.P, 10), 'var(--accent)', 38, true))}
    ${stat('t-b', 'Max drawdown', `<span class="down">${money(S.dd, 0)}</span>`, `worst run ${S.worstRun} losses`, spark(S.under, 'var(--down)', 38))}
    ${stat('t-c' + (S.streakKind === 'W' && S.streak >= 2 ? ' hot' : ''), 'Streak', S.streak ? `<span class="${S.streakKind === 'W' ? 'up' : 'down'}">${S.streak}${S.streakKind}</span>` : '—', `best ${S.bestRun}W · worst ${S.worstRun}L`, formStrip(S.P.slice(-14)))}
    <div class="t-cal">${calendarCard()}</div>
    <section class="card tile t-focus"><div class="card-h"><h2>Where to focus</h2></div><div class="ins">${insights(list).map((x, k) => insightRow(x, k)).join('')}</div></section>
    ${reelCard()}
    <section class="card tile t-latest"><div class="card-h"><h2>Latest trades</h2><span class="grow"></span><button class="link" onclick="go('journal')">See all ${icon('arrow')}</button></div>
      <div style="padding-top:6px">${trades.slice().sort(byTime).reverse().slice(0, 5).map((t, k) => tradeRow(t, k, true)).join('')}</div></section>
  </div>`;
}


/* =====================================================================
   Opening — plays once each time the journal opens. The mark draws itself,
   pulses, Luca is greeted, his real equity curve sweeps across behind, the
   numbers count up, and then the whole scene folds back into the header icon.
   Click or press any key to skip. Skipped entirely under reduced motion.
   ===================================================================== */
(function puSplash() {
  if (REDUCED) return;
  const real = (() => { try { return (JSON.parse(localStorage.getItem(KEY) || '{}').trades || []).length > 0; } catch (e) { return false; } })();
  const S = real ? summarise(trades) : null;

  /* the equity curve behind the greeting — his own, or a gentle rising line before there is one */
  const pts = [0];
  if (S && S.P.length > 1) S.P.forEach(p => pts.push(pts[pts.length - 1] + p));
  else [3, 1, 5, 4, 8, 6, 11, 10, 14].forEach(v => pts.push(v));
  const lo = Math.min(...pts), hi = Math.max(...pts), span = (hi - lo) || 1;
  const W = Math.max(320, innerWidth), H = Math.max(300, innerHeight), padX = W * .04;
  const xy = pts.map((v, i) => [padX + i * ((W - 2 * padX) / (pts.length - 1)), H * .82 - ((v - lo) / span) * H * .6]);
  let d = `M${xy[0][0]},${xy[0][1]}`;
  for (let i = 1; i < xy.length; i++) {                     // smooth: midpoint curves
    const [x0, y0] = xy[i - 1], [x1, y1] = xy[i], mx = (x0 + x1) / 2;
    d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`;
  }
  const end = xy[xy.length - 1];

  const hello = melGreeting();
  const letters = (txt, start) => Array.from(txt).map((c, i) =>
    c === ' ' ? ' ' : `<span class="sp-l" style="--i:${start + i}">${esc(c)}</span>`).join('');
  const week = S ? (() => {
    const mon = mondayOf(nyNow().date);
    return sum(S.cl.filter(t => t.date >= mon).map(pOf));
  })() : 0;
  const chip = (label, to, fmt, cls, k) =>
    `<div class="sp-chip" style="--k:${k}"><small>${label}</small><b class="${cls}" data-to="${to}" data-fmt="${fmt}">${fmt === 'money' ? money(0, 0) : '0'}</b></div>`;
  const chips = S ? chip('Net result', S.total, 'money', tone(S.total), 0)
      + chip('This week', week, 'money', tone(week), 1)
      + chip('Win rate', Math.round(S.winRate * 100), 'pct', '', 2)
      + chip('Trades', trades.length, 'int', '', 3)
    : `<div class="sp-chip" style="--k:0"><small>Ready when you are</small><b>Log your first trade</b></div>`;

  /* embers: red rise on the bear's side, green on the bull's */
  const embers = Array.from({ length: 30 }, (_, i) => {
    const bear = i % 2 === 0, x = bear ? 3 + Math.random() * 40 : 57 + Math.random() * 40;
    return `<i class="${bear ? 'r' : 'g'}" style="left:${x.toFixed(1)}%; --s:${(1.5 + Math.random() * 2.5).toFixed(1)}px; --t:${(3 + Math.random() * 3).toFixed(1)}s; --d:${(Math.random() * 2.5).toFixed(2)}s; --dx:${((Math.random() - .5) * 80).toFixed(0)}px"></i>`;
  }).join('');

  const el = document.createElement('div');
  el.id = 'puSplash'; el.className = 'pu-splash'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `
    <div class="sp-aurora"><i></i><i></i></div>
    <div class="sp-beasts"><div class="sp-bear"></div><div class="sp-bull"></div></div>
    <div class="sp-hush"></div>
    <div class="sp-embers">${embers}</div>
    <svg class="sp-curve" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="spG" x1="0" x2="1"><stop offset="0" stop-color="#FF4A3D"/><stop offset=".48" stop-color="#E6F0EC"/><stop offset="1" stop-color="#3DFF95"/></linearGradient>
        <linearGradient id="spF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DFF95" stop-opacity=".12"/><stop offset="1" stop-color="#3DFF95" stop-opacity="0"/></linearGradient></defs>
      <path class="sp-line" d="${d}" pathLength="1" fill="none" stroke="url(#spG)"/>

    </svg>
    <div class="sp-core">
      <div class="sp-icon">
        <span class="sp-ring"></span><span class="sp-ring r2"></span><span class="sp-ring r3"></span>
        <div class="sp-tile sp-vault"></div>

      <p class="sp-sub">${esc(new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }))}<i></i>${esc(sessionOf(nyNow().time))} session</p>

    </div>

  document.body.appendChild(el);
  document.documentElement.classList.add('sp-hold');

  /* numbers count up once their chip has landed */
  setTimeout(() => el.querySelectorAll('.sp-chip b[data-to]').forEach((b, k) => {
    const to = +b.dataset.to, f = b.dataset.fmt, t0 = performance.now() + k * 110, dur = 900;
    const tick = now => {
      const x = Math.min(1, Math.max(0, (now - t0) / dur)), v = to * (1 - Math.pow(1 - x, 4));

      if (x < 1) requestAnimationFrame(tick);

    requestAnimationFrame(tick);

  let gone = false;

    if (gone) return; gone = true;
    clearTimeout(auto);
    /* fold the scene into the header icon it came from */
    const ic = document.querySelector('.pu-icon'), r = ic ? ic.getBoundingClientRect() : { left: 40, top: 40, width: 0, height: 0 };
    el.style.setProperty('--ox', (r.left + r.width / 2) + 'px');

  el.addEventListener('pointerdown', leave);
  addEventListener('keydown', leave, true);
})();

/* =====================================================================
   Rules — Luca's pre-trade checklist. Five rules, 20 points each, a score

const RULES = [

  return s === 100 ? ['A+ setup', 'All five rules are there.']
    : s === 80 ? ['Strong', 'One rule missing — know which one.']
    : s === 60 ? ['Borderline', 'Two rules missing. Be honest with yourself.']

    : ['Start ticking', 'Go through each rule before you enter.'];
}

function vRules() {
  after(() => setTimeout(() => paintScore(true), 60));

    const a = -Math.PI / 2 + k * (2 * Math.PI / 5);

  }).join('');
  return `
  <div class="head"><div><div class="label">Rules</div><h1>Pre-trade checklist</h1><p class="muted">Tick what this setup has. Each rule is worth 20.</p></div></div>
  <div class="ru-grid">

      <div class="ru-ringwrap">

function ruleRow([id, name, sub], i) {

}
function paintScore(first) {
  const arc = document.getElementById('ruArc'), num = document.getElementById('ruNum');

  const n = P.length;
  if (n < 2) return '';
  const dx = k => P[k + 1][0] - P[k][0], sl = k => (P[k + 1][1] - P[k][1]) / (dx(k) || 1);
