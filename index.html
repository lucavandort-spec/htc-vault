/* =====================================================================
   Trade order — arrange trades by hand. Drag a row by its grip, or use
   the arrows. The new order is stored on the trades themselves (`order`),
   reusing the existing sequence keys, so a trade logged later still lands
   at the end. "Back to upload order" clears every manual placement.
   ===================================================================== */
const _vJournalO = vJournal;
vJournal = function () {
  return _vJournalO().replace(
    /(<span class="grow"><\/span>)(<div class="seg)/, `$1<button class="btn ord-open" type="button" onclick="openOrder()">${ORD_ICON.grip} Arrange order</button>$2`);
};
const ORD_ICON = {
  grip: '<svg viewBox="0 0 24 24" class="ord-grip-i"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>',
  up: '<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};
function openOrder() { SHEET = 'order'; renderSheet(); showSheet(); }
const _renderSheetO = renderSheet;
renderSheet = function () {
  if (SHEET !== 'order') return _renderSheetO();
  const el = document.getElementById('sheet'), list = trades.slice().sort(byTime);
  const manual = trades.some(t => t.order !== undefined && t.order !== null);
  el.innerHTML = `
    <div class="sheet-h"><div><div class="label">Trade order</div><h2 id="sheetTitle">Arrange your trades</h2></div><span class="grow"></span>
      <button class="iconbtn" onclick="closeSheet()" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">
      <p class="muted" style="font-size:13px; margin:0">First logged at the top, most recent at the bottom. Drag a trade by its grip, or use the arrows — the equity graph, streaks and every list follow this order.</p>
      <ol class="ord-list" id="ordList">${list.map((t, k) => ordRow(t, k, list.length)).join('')}</ol>
      <div class="row"><button class="btn" type="button" onclick="resetOrder()" ${manual ? '' : 'disabled'}>Back to upload order</button><span class="grow"></span>
        <button class="btn primary" type="button" onclick="closeSheet()">Done</button></div>
    </div>`;
  ordWire();
};
function ordRow(t, k, n) {
  const p = pOf(t);
  return `<li class="ord-row" data-id="${t.id}" style="--k:${k}">
    <span class="ord-grip" title="Drag to move" aria-hidden="true">${ORD_ICON.grip}</span>
    <span class="ord-no">${k + 1}</span>
    <span class="ord-main"><b>${esc(t.type || 'Trade')}</b><small>${esc(dshow(t.date))}${t.time ? ' · ' + esc(t.time) : ''} · <span class="side ${t.direction}">${esc(t.direction)}</span></small></span>
    <span class="ord-pnl n ${p === null ? 'faint' : tone(p)}">${p === null ? 'Open' : money(p, 0)}</span>
    <span class="ord-btns">
      <button class="iconbtn" type="button" onclick="ordMove(${t.id}, -1)" ${k === 0 ? 'disabled' : ''} aria-label="Move earlier">${ORD_ICON.up}</button>
      <button class="iconbtn" type="button" onclick="ordMove(${t.id}, 1)" ${k === n - 1 ? 'disabled' : ''} aria-label="Move later">${ORD_ICON.down}</button></span>
  </li>`;
}
/* give the trades in `ids` (new order) the existing sequence keys, smallest first */
function ordApply(ids) {
  const keys = trades.map(seqKey).sort((a, b) => a - b), now = Date.now();
  ids.forEach((id, i) => {
    const t = trades.find(x => String(x.id) === String(id));
    if (t && seqKey(t) !== keys[i]) { t.order = keys[i]; t.updatedAt = now; }
  });
  save();
  render(false);                                   // the graph behind the sheet redraws in the new order
}
function ordIds() { return [...document.querySelectorAll('#ordList .ord-row')].map(r => r.dataset.id); }
function ordMove(id, dir) {
  const ids = ordIds(), i = ids.indexOf(String(id)), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  ordFlip(() => { ordApply(ids); renderSheet(); }, String(id));
}
function resetOrder() {
  const now = Date.now();
  trades.forEach(t => { if (t.order !== undefined && t.order !== null) { delete t.order; t.updatedAt = now; } });
  ordFlip(() => { save(); render(false); renderSheet(); });
  toast('Back to upload order');
}
/* animate rows from where they were to where they land */
function ordFlip(change, hot) {
  const before = new Map([...document.querySelectorAll('#ordList .ord-row')].map(r => [r.dataset.id, r.getBoundingClientRect().top]));
  change();
  if (REDUCED) return;
  document.querySelectorAll('#ordList .ord-row').forEach(r => {
    const was = before.get(r.dataset.id); if (was === undefined) return;
    const dy = was - r.getBoundingClientRect().top;
    if (r.dataset.id === hot) r.classList.add('moved');
    if (dy) r.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.34,1.3,.5,1)' });
  });
}
/* drag by the grip: the row follows the pointer, the others slide out of its way */
function ordWire() {
  const list = document.getElementById('ordList');
  if (!list) return;
  list.querySelectorAll('.ord-grip').forEach(g => g.addEventListener('pointerdown', e => {
    e.preventDefault();
    const row = g.closest('.ord-row'), rows = [...list.children], from = rows.indexOf(row);
    const tops = rows.map(r => r.getBoundingClientRect().top), step = rows.length > 1 ? tops[1] - tops[0] : row.offsetHeight;
    const y0 = e.clientY; let to = from;
    row.classList.add('dragging'); list.classList.add('sorting');
    g.setPointerCapture(e.pointerId);
    const move = ev => {
      const dy = ev.clientY - y0;
      row.style.transform = `translateY(${dy}px) scale(1.02)`;
      to = Math.max(0, Math.min(rows.length - 1, from + Math.round(dy / step)));
      rows.forEach((r, k) => {
        if (r === row) return;
        const shift = (from < to && k > from && k <= to) ? -step : (from > to && k < from && k >= to) ? step : 0;
        r.style.transform = shift ? `translateY(${shift}px)` : '';
      });
    };
    const up = () => {
      g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
      row.classList.remove('dragging'); list.classList.remove('sorting');
      rows.forEach(r => { r.style.transform = ''; });
      if (to === from) return;
      const ids = rows.map(r => r.dataset.id);
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      ordApply(ids); renderSheet();
      document.querySelector(`#ordList .ord-row[data-id="${row.dataset.id}"]`)?.classList.add('moved');
    };
    g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
  }));
}

/* =====================================================================
   Dictation — a mic button in every note box. Tap, speak, and the words

   app does the listening (Apple's Speech framework, on-device where the Mac
   supports it); in a plain browser the buttons don't appear.

const MIC_OK = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.speech);

    b.innerHTML = `${MIC_SVG}<span class="mic-eq"><i></i><i></i><i></i><i></i></span><span class="mic-tag">Listening…</span>`;

function toggleMic(ta, btn) {

/* =====================================================================
   Loss awareness — trades taken within 30 minutes of a losing trade on the
   same day carry a small "after loss" flag wherever trades are listed.
   (The pre-market plan card that also lived here was removed at Luca's request.)
   ===================================================================== */
const COOL_MIN = 30;

function afterLoss(t) {
  if (clockMin(t) === null) return false;
  const at = tradeMs(t);
  return trades.some(o => o !== t && o.date === t.date && pOf(o) !== null && pOf(o) < 0 && clockMin(o) !== null
    && tradeMs(o) < at && at - tradeMs(o) <= COOL_MIN * 60000);
}
/* rows taken within 30 minutes of a loss carry a small flag, everywhere trades are listed */
const _tradeRowPM = tradeRow;
tradeRow = function (t, k, withDate) {
  const h = _tradeRowPM(t, k, withDate);

/* =====================================================================
   Reviews — the weekly and monthly reviews that Claude's scheduled tasks
   write to Documents › LVDHTC Reviews, read and shown here. The app lists
   them through lvdhtc://journal/__reviews; outside the app the tab explains
   where reviews come from.
   ===================================================================== */
const RV = { list: null, open: null, text: '', kind: 'all', loading: false };
function mdInline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/(^|[\s(])([+−-]\$[\d,]+(?:\.\d+)?)/g, (m, a, n) => `${a}<span class="n ${n[0] === '+' ? 'up' : 'down'}">${n}</span>`);
}
/* a small markdown renderer: headings, paragraphs, lists, quotes, tables, rules */
function mdRender(md) {
  const L = md.replace(/\r/g, '').split('\n'), out = [];
  let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(l))) { out.push(`<h${m[1].length + 1} class="md-h">${mdInline(m[2])}</h${m[1].length + 1}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { out.push('<hr>'); i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < L.length && /^\s*\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push(`<div class="md-tw"><table>${body.map((r, k) => `<tr>${cells(r).map(c => k ? `<td>${mdInline(c)}</td>` : `<th>${mdInline(c)}</th>`).join('')}</tr>`).join('')}</table></div>`);
      continue;
    }
    if (/^\s*>/.test(l)) { const q = []; while (i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, '')); out.push(`<blockquote>${mdInline(q.join(' '))}</blockquote>`); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ord = /^\s*\d+\./.test(l), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) {
        let it = L[i++].replace(/^\s*([-*]|\d+\.)\s+/, '');
        while (i < L.length && /^\s{2,}\S/.test(L[i]) && !/^\s*([-*]|\d+\.)\s+/.test(L[i])) it += ' ' + L[i++].trim();
        items.push(`<li>${mdInline(it)}</li>`);
      }
      out.push(ord ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      continue;
    }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s|\s*\||\s*>|\s*([-*]|\d+\.)\s+|-{3,})/.test(L[i])) p.push(L[i++]);
    out.push(`<p>${mdInline(p.join(' '))}</p>`);
  }
  return out.join('');
}

/* =====================================================================
   Feedback (2026-09-29) — Claude's read of the journal, rebuilt from the
   trades each time the tab opens. The big button reads a short brief aloud
   (the app's native voice, or the browser's outside the app); the full
   rundown is written out underneath. Every figure is computed here from the
   trades; judgements only quote Luca's own notes and rules — nothing invented.
   ===================================================================== */
const FB = { speaking: false, voice: '', brief: '' };
const fbS = list => {
  const P = list.map(pOf), w = P.filter(p => p > 0), l = P.filter(p => p < 0);
  return { n: P.length, net: sum(P), w: w.length, l: l.length, aw: w.length ? sum(w) / w.length : 0, al: l.length ? sum(l) / l.length : 0 };
};
const fbRec = s => `${s.w}W / ${s.l}L`;
const fbM = n => `<span class="n ${n > 0 ? 'up' : n < 0 ? 'down' : ''}">${money(n, 0)}</span>`;
const fbD = n => Math.round(Math.abs(n)).toLocaleString('en-US') + ' dollars';          // spoken money
const fbPnL = n => n >= 0 ? `made ${fbD(n)}` : `lost ${fbD(n)}`;
const fbNum = n => ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'][n] ?? String(n);
function fbWilson(k, n) {
  const z = 1.96, p = k / n, d = 1 + z * z / n, c = p + z * z / (2 * n), r = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n));
  return [(c - r) / d, (c + r) / d];
}
const fbQuote = s => { s = String(s || '').trim().replace(/\s+/g, ' '); return s.length > 120 ? s.slice(0, 117).replace(/\s\S*$/, '') + '…' : s; };
const fbText = t => [t.notes, t.reviewSaw, t.reviewChange].filter(Boolean).join(' ');

function fbAnalyse() {
  const cl = closedOf(trades), open = trades.filter(t => !isClosed(t)), S = fbS(cl);
  const F = [], MISSED = [], DO = [];
  if (!cl.length) return { S, F, MISSED, DO, open };

  /* 1. confirmation — the trigger rule says the failure swing must be confirmed */
  const C = fbS(cl.filter(t => t.confirmed)), U = fbS(cl.filter(t => !t.confirmed));
  const openU = open.filter(t => !t.confirmed);
  if (C.n && U.n) {
    const gap = C.net / C.n - U.net / U.n;
    F.push(gap > 0 ? {
      tone: 'good', w: 100, title: 'Confirmation is what separates your winners from your losers',
      body: `Confirmed trades: ${fbM(C.net)} (${fbRec(C)}). Unconfirmed: ${fbM(U.net)} (${fbRec(U)}). Your own trigger rule says the failure swing must be confirmed, not anticipated — the numbers agree.${openU.length ? ` Heads up: ${openU.length === 1 ? 'your open trade is' : openU.length + ' open trades are'} marked unconfirmed.` : ''}`,
      say: `The biggest thing: when you waited for confirmation you ${fbPnL(C.net)}. When you didn't, you ${fbPnL(U.net)}.`
    } : {
      tone: 'info', w: 40, title: 'Unconfirmed trades are holding up — for now',
      body: `Confirmed ${fbM(C.net)} (${fbRec(C)}) vs unconfirmed ${fbM(U.net)} (${fbRec(U)}). Your rule still says wait for confirmation; keep watching this split.`,
      say: ''
    });
    if (gap > 0) DO.push('Make confirmation a hard gate — no confirmed failure swing, no trade.');
  }

  /* 2. the trade straight after a loss, same day */
  const re = [];
  cl.forEach((t, i) => { const p = cl[i - 1]; if (p && p.date === t.date && pOf(p) < 0) re.push([p, t]); });
  if (re.length >= 2) {
    const R = fbS(re.map(x => x[1])), pairs = re.map(([p, t]) => `${dshow(t.date)} (${money(pOf(p), 0)} → ${money(pOf(t), 0)})`).join(', ');
    F.push(R.net > 0 ? {
      tone: 'good', w: 90, title: 'The first attempt fails, the re-entry pays',
      body: `Trades taken right after a same-day loss: ${fbM(R.net)} (${fbRec(R)}) — ${pairs}. Your read is right; the first entry is early. Treat that first attempt as the anticipation your trigger rule forbids.`,
      say: `Your re-entries after a loss went ${fbNum(R.w)} for ${fbNum(R.n)}. Your read is right, your first entry is just early.`
    } : {
      tone: 'bad', w: 90, title: 'Trades after a loss are costing you',
      body: `Straight after a same-day loss: ${fbM(R.net)} (${fbRec(R)}) — ${pairs}. Consider a pause rule after a loss.`,
      say: `Trades straight after a loss have ${fbPnL(R.net)}. Consider a pause after a loss.`
    });
    if (R.net > 0) DO.push('Wait for the re-entry quality on the first attempt: if it isn’t confirmed yet, it isn’t the entry.');
  }

  /* 3. continuation type */
  const byType = CONT_TYPES.map(k => [k, fbS(cl.filter(t => t.type === k))]).filter(x => x[1].n);
  const unused = CONT_TYPES.filter(k => !cl.some(t => t.type === k));
  if (byType.length) {
    const s = byType.slice().sort((a, b) => b[1].net - a[1].net), best = s[0];
    F.push({
      tone: 'good', w: 70, title: `${best[0]} is carrying the book`,
      body: s.map(([k, x]) => `${esc(k)} ${fbM(x.net)} (${fbRec(x)})`).join(' · ') + '.' +
        (unused.length ? ` Never logged: ${unused.map(esc).join(', ')} — either it isn't part of your game, or it isn't being recognised.` : ''),
      say: `${best[0]} is carrying the book at ${fbD(best[1].net)}${s.length > 1 ? `, while ${s[s.length - 1][0]} has ${fbPnL(s[s.length - 1][1].net)}` : ''}.`
    });
  }

  /* 4. bias state — choppy vs expanding */
  const byBias = BIASES.map(k => [k, fbS(cl.filter(t => t.bias === k))]).filter(x => x[1].n >= 2).sort((a, b) => a[1].net / a[1].n - b[1].net / b[1].n);
  const chop = fbS(cl.filter(t => /choppy/.test(t.bias || ''))), exp = fbS(cl.filter(t => /expanding/.test(t.bias || '')));
  if (chop.n >= 2 && exp.n >= 2) {
    const worse = chop.net / chop.n < exp.net / exp.n;
    F.push({
      tone: worse ? 'warn' : 'info', w: 55, title: worse ? 'Choppy conditions underperform' : 'Choppy conditions are holding up',
      body: `Choppy bias ${fbM(chop.net)} (${fbRec(chop)}) vs expanding ${fbM(exp.net)} (${fbRec(exp)}).` +
        (byBias.length ? ` Weakest bias with 2+ trades: ${esc(byBias[0][0])} ${fbM(byBias[0][1].net)} (${fbRec(byBias[0][1])}).` : ''),
      say: worse ? `Choppy days are weaker: ${fbPnL(chop.net)} there, against ${fbD(exp.net)} on expanding days.` : ''
    });

  }

  /* 5. direction and counter-bias */

  if (L.n && Sh.n) {

      tone: 'info', w: 45, title: `Shorts ${fbRec(Sh)}, longs ${fbRec(L)}`,
      body: `Shorts ${fbM(Sh.net)}, longs ${fbM(L.net)}.` + (ctr.length ? ` ${ctr.length} trade${ctr.length > 1 ? 's were' : ' was'} taken against the logged bias (${fbM(K.net)}, ${fbRec(K)}). Decide whether “bias” is the market's state or the side you're allowed to trade — right now the journal can't tell a disciplined reversion from a counter-bias trade.` : ''),
      say: ''

  }

  /* 6. timeframe rule — 15m, 5m in New York */
  const drift = cl.concat(open).filter(t => t.tf && t.time && t.tf !== tfFor(sessionOf(t.time)));
  if (drift.length) {
    const D = fbS(drift.filter(isClosed));
    MISSED.push(`<b>Timeframe drift.</b> Your rule is 15m, 5m only in New York. ${drift.length} trade${drift.length > 1 ? 's' : ''} broke it: ${drift.map(t => `${dshow(t.date)} ${esc(t.time)} ${esc(t.tf)} in ${sessionOf(t.time)}`).join(', ')}${D.n ? ` (${fbM(D.net)})` : ''}. Amend the rule or hold to it.`);
  }

  /* 7. management — what the notes say about stops and exits */
  const MG = /\b(sl|stop)\b.{0,40}\b(moved|move|kept|keep|should|where it was)|\b(should have|shouldn'?t have)\b.{0,30}\b(sl|stop|held|hold)|clos(ed|e) early|early close|secure a/i, mg = cl.filter(t => MG.test(fbText(t)));
  const mgLine = t => [t.notes, t.reviewSaw, t.reviewChange].find(x => x && MG.test(x)) || fbText(t);
  if (mg.length) {
    F.push({
      tone: 'warn', w: 80, title: 'Your losses come from management, not your read',
      body: `Your notes say it: ${mg.map(t => `<q>${esc(fbQuote(mgLine(t)))}</q> <span class="fb-when">${dshow(t.date)} ${esc(t.time || '')}, ${money(pOf(t), 0)}</span>`).join(' ')} Stop placement and targets are still the unwritten parts of your HTC rules — this is where money leaks.`,
      say: `Your notes keep pointing at trade management: moving the stop, closing early. Stop placement and targets are still unwritten in your rules.`
    });
    DO.push('Write your stop-placement and target rules this week, starting from the mistakes your notes describe.');
  }

  /* 8. size — mentioned in notes, never logged */
  const sz = trades.filter(t => /\bsiz(e|ing)\b|\bscale\b|heavier/i.test(fbText(t)));
  if (sz.length && !trades.some(t => t.contracts || t.qty || t.size)) {
    MISSED.push(`<b>P&amp;L is mixed up with size.</b> You wrote about sizing up (${sz.map(t => dshow(t.date)).join(', ')}), but contracts aren't logged — a bigger dollar result will no longer tell a better trade from a bigger one. Log contracts or dollars at risk per trade.`);
    DO.push('Log contracts (or dollars at risk) on every trade.');
  }

  /* 9. sample size */
  if (S.n < 30) {

    MISSED.push(`<b>The sample is small.</b> ${S.w} wins in ${S.n} closed trades is consistent with a true win rate anywhere from ${pct(lo)} to ${pct(hi)}. The results can't separate edge from luck until around 30 trades — not a reason to size up yet.`);

  const noNotes = cl.filter(t => !String(t.notes || '').trim()), noRev = cl.filter(t => !(t.reviewSaw || t.reviewPlan || t.reviewChange));
  if (noNotes.length) MISSED.push(`<b>Silent trades.</b> ${noNotes.map(t => `${dshow(t.date)} (${money(pOf(t), 0)})`).join(', ')} ${noNotes.length > 1 ? 'have' : 'has'} no notes — a trade with no note teaches nothing.`);
  if (noRev.length) MISSED.push(`<b>Reviews.</b> ${cl.length - noRev.length} of ${cl.length} closed trades have a post-trade review.`);
  if (!Object.values(WEEKS || {}).some(w => w && String(w.note || '').trim())) MISSED.push(`<b>No weekly notes yet.</b> The week view has a takeaways box — one line per week is enough.`);
  const ltf = trades.filter(t => t.bias === 'Low TF reversal');
  if (ltf.length) MISSED.push(`<b>“Low TF reversal” is undefined.</b> ${ltf.length} trade${ltf.length > 1 ? 's use' : ' uses'} it, but it isn't written into your rules yet.`);
  MISSED.push(`<b>Checklist scores aren't saved.</b> The Rules tab scores each setup out of 100, but the score doesn't travel with the trade — so “do A+ setups pay more?” can't be answered yet.`);
  if (ltf.length) DO.push('Write down what “Low TF reversal” means before logging more under it.');

  F.sort((a, b) => b.w - a.w);
  return { S, F, MISSED, DO, open };
}

function fbBrief(A) {
  const g = melGreeting() + ', Luca.';
  if (!A.S.n) return `${g} There are no closed trades yet. Log a few and I'll have something to say.`;
  const S = A.S, parts = [g,
    `You're ${S.net >= 0 ? 'up' : 'down'} ${fbD(S.net)} across ${S.n} closed trades, winning ${Math.round(S.w / S.n * 100)} percent of them. Your average win is ${fbD(S.aw)}, against an average loss of ${fbD(S.al)}.`];
  A.F.filter(f => f.say).slice(0, 4).forEach(f => parts.push(f.say));
  if (A.DO.length) parts.push(`If you do one thing: ${A.DO[0].replace(/\s*—\s*/g, ', ').replace(/[“”]/g, '')}`);
  parts.push('The full rundown is written below.');
  return parts.join(' ');
}

function vFeedback() {
  const A = fbAnalyse(), S = A.S;
  FB.brief = fbBrief(A);
  let at = 0;
  const words = FB.brief.split(/(\s+)/).map(w => { const s = at; at += w.length; return /\S/.test(w) ? `<span data-a="${s}" data-b="${at}">${esc(w)}</span>` : w; }).join('');
  const tones = { good: 'Working', warn: 'Watch', bad: 'Costing you', info: 'Worth knowing' };

  return `
  <div class="head"><div><div class="label">Feedback</div><h1>${melGreeting()}, Luca</h1>
    <p>Claude's read of your journal — ${S.n} closed trade${S.n === 1 ? '' : 's'}${A.open.length ? ` and ${A.open.length} open` : ''}, rebuilt every time you open this tab.</p></div></div>
  <section class="card fb-hero${FB.speaking ? ' on' : ''}" id="fbHero">
    <button type="button" class="fb-btn" id="fbBtn" onclick="fbToggle()" aria-label="${FB.speaking ? 'Stop the brief' : 'Play your brief'}">
      <span class="fb-aura"></span><span class="fb-ring"></span><span class="fb-ring"></span><span class="fb-ring"></span>
      <span class="fb-core">
        <svg class="fb-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <span class="fb-bars">${bars}</span>
      </span>
    </button>
    <div class="fb-hero-t">
      <div class="label">Your brief <span class="fb-st" id="fbSt">${FB.speaking ? '· playing' : '· tap to listen'}</span></div>
      <p class="fb-cap" id="fbCap">${words}</p>
      <small class="faint" id="fbVoice">${FB.voice ? 'Voice: ' + esc(FB.voice) : ''}</small>
    </div>
  </section>
  ${S.n ? `
  <div class="fb-kpis">
    <div class="card fb-kpi" style="--k:0"><div class="label">Net</div><b class="n ${S.net >= 0 ? 'up' : 'down'}">${money(S.net, 0)}</b><small>${S.n} closed</small></div>
    <div class="card fb-kpi" style="--k:1"><div class="label">Win rate</div><b class="n">${pct(S.w / S.n)}</b><small>${fbRec(S)}</small></div>
    <div class="card fb-kpi" style="--k:2"><div class="label">Avg win / loss</div><b class="n">${amt(S.aw, 0)} <span class="faint">/</span> ${amt(S.al, 0)}</b><small>payoff ${S.al ? (S.aw / Math.abs(S.al)).toFixed(2) : '∞'}×</small></div>
  </div>
  <h2 class="fb-sec">Key findings</h2>
  <div class="fb-grid">${A.F.map((f, k) => `<article class="card fb-f ${f.tone}" style="--k:${k}"><span class="fb-tag">${tones[f.tone]}</span><h3>${esc(f.title)}</h3><p>${f.body}</p></article>`).join('')}</div>
  ${A.MISSED.length ? `<h2 class="fb-sec">Things you may have missed</h2><section class="card fb-list"><ul>${A.MISSED.map(m => `<li>${m}</li>`).join('')}</ul></section>` : ''}
  ${A.DO.length ? `<h2 class="fb-sec">What to do next</h2><section class="card fb-list fb-do"><ol>${A.DO.map(m => `<li>${esc(m)}</li>`).join('')}</ol></section>` : ''}
  <p class="faint fb-foot">Numbers are computed from your journal; judgements quote your own notes and rules. This is a process review, not financial advice.</p>` : ''}`;
}

/* ---- the voice: the app's native one, else the browser's ---- */
function fbPaint(on) {
  FB.speaking = on;
  document.getElementById('fbHero')?.classList.toggle('on', on);
  const st = document.getElementById('fbSt'); if (st) st.textContent = on ? '· playing' : '· tap to listen';
  const b = document.getElementById('fbBtn'); if (b) b.setAttribute('aria-label', on ? 'Stop the brief' : 'Play your brief');
  if (!on) document.querySelectorAll('#fbCap span').forEach(s => s.classList.remove('on', 'said'));
}
function fbWord(loc) {
  const hero = document.getElementById('fbHero');
  document.querySelectorAll('#fbCap span').forEach(s => {
    const a = +s.dataset.a, b = +s.dataset.b;
    s.classList.toggle('on', loc >= a && loc < b); s.classList.toggle('said', b <= loc);
  });
  if (hero) { hero.style.setProperty('--amp', (0.55 + Math.random() * 0.45).toFixed(2)); hero.classList.remove('beat'); void hero.offsetWidth; hero.classList.add('beat'); }
}
window.lvdVoice = e => {
  if (e.type === 'start') { if (e.voice) { FB.voice = e.voice; const v = document.getElementById('fbVoice'); if (v) v.textContent = 'Voice: ' + e.voice; } fbPaint(true); }
  else if (e.type === 'word') fbWord(e.loc);
  else if (e.type === 'end') fbPaint(false);
};
const FB_FEMALE = ['Zoe', 'Ava', 'Allison', 'Serena', 'Susan', 'Samantha', 'Karen', 'Moira', 'Tessa', 'Kate', 'Fiona'];
function fbWebVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const rank = v => { const i = FB_FEMALE.findIndex(n => v.name.startsWith(n)); return (i < 0 ? 99 : i) - (/premium|enhanced/i.test(v.name) ? 50 : 0); };
  return vs.sort((a, b) => rank(a) - rank(b))[0] || null;
}
function fbToggle() {
  const nat = window.webkit?.messageHandlers?.voice;
  if (FB.speaking) { nat ? nat.postMessage('stop') : window.speechSynthesis?.cancel(); fbPaint(false); return; }
  if (nat) { nat.postMessage(JSON.stringify({ say: FB.brief })); fbPaint(true); return; }
  if (!window.speechSynthesis) return toast('Speech isn’t available here — open the HTC Vault app.');
  const u = new SpeechSynthesisUtterance(FB.brief), v = fbWebVoice();
  if (v) { u.voice = v; FB.voice = v.name; }
  u.rate = 0.92; u.pitch = 0.94;
  u.onstart = () => window.lvdVoice({ type: 'start', voice: FB.voice });
  u.onboundary = e => window.lvdVoice({ type: 'word', loc: e.charIndex });
  u.onend = u.onerror = () => window.lvdVoice({ type: 'end' });
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
/* leaving the tab ends the brief */
window.addEventListener('hashchange', () => { if (FB.speaking && !/^#\/feedback/.test(location.hash)) fbToggle(); });

<script>

/* =====================================================================
   SYNC — the same journal on the Mac and the phone
   ---------------------------------------------------------------------
   Storage on each device stays exactly as it was: localStorage under
   htc.v2, charts in IndexedDB. On top of that, each device keeps a copy
   in one private GitHub repository and pulls the other's changes back:

     trades.json            every trade, the weekly notes, and a list of
                            deleted trade ids (so a delete travels too)
     shots/<id>-<rev>.jpg   one file per chart, never overwritten

   Nothing here is on the critical path. With no key, or no signal, the
   journal behaves as before and catches up the next time it can.

   The merge is three-way, per trade: each device remembers what a trade
   looked like when it last agreed with the repository. Changed on one
   side only → that side wins. Changed on both → the newer edit wins.
   A trade is only ever removed by an explicit delete on one device, and
   emptying a device pauses sync instead of emptying the other one.
   ===================================================================== */
const GS = (() => {
  const REPO = 'lucavandort-spec/htc-vault-data';
  const SKEY = KEY + '.sync';
  let API = 'https://api.github.com';                      // tests point this at a stand-in server with GS._api()
  const DEVICE = window.LVD_APP ? 'Mac' : window.LVD_MOBILE ? 'phone' : 'browser';

  /* what this device remembers between runs */
  let S = { on: false, fresh: false, token: '', sha: null, etag: null, at: null, docHash: null, known: {}, tomb: {}, have: {}, dirty: {} };
  try { S = Object.assign(S, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
  const keep = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

  let state = S.on ? 'idle' : 'off', note = '', busy = false, again = false, applying = false, timer = null, lastRun = 0, checked = false;

  /* ---------------- small tools ---------------- */
  const b64enc = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
  const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s+/g, '')), c => c.charCodeAt(0)));
  const clean = t => { const o = {}; Object.keys(t).sort().forEach(k => { if (k !== 'synced' && k !== 'asset' && t[k] !== undefined) o[k] = t[k]; }); return o; };
  const hash = str => {                                    // cyrb53 — change detection, not security
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  };
  const th = t => hash(JSON.stringify(clean(t)));
  const sortObj = o => { const r = {}; Object.keys(o || {}).sort().forEach(k => r[k] = o[k]); return r; };
  const docHash = d => hash(JSON.stringify({ t: d.trades.map(clean), d: sortObj(d.deleted), w: sortObj(d.weeks) }));
  const real = () => DEMO ? [] : trades;

  class GhError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
  async function gh(path, o = {}) {
    const headers = { Authorization: 'Bearer ' + (o.token || S.token), Accept: o.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (o.etag) headers['If-None-Match'] = o.etag;
    if (o.body) headers['Content-Type'] = 'application/json';
    let r;
    try { r = await fetch(API + '/repos/' + REPO + path, { method: o.method || 'GET', cache: 'no-store', headers, body: o.body ? JSON.stringify(o.body) : undefined }); }
    catch (e) { throw new GhError(0, 'no connection'); }
    return r;
  }
  const explain = e => e.status === 401 ? 'that sync key is not valid, or it has expired'
    : e.status === 404 ? 'that key cannot see the htc-vault-data repository — pick it when you create the key'
    : e.status === 403 ? 'GitHub refused — the key needs Contents: Read and write'
    : e.status === 0 ? 'no connection' : (e.message || 'something went wrong');

  /* ---------------- the repository's copy ---------------- */
  async function pull() {
    const r = await gh('/contents/trades.json', { etag: S.etag });
    if (r.status === 304) return null;                                   // nothing new since last time
    if (r.status === 404) return { doc: { trades: [], deleted: {}, weeks: {} }, sha: null, etag: null };
    if (!r.ok) throw new GhError(r.status, 'GitHub answered ' + r.status);
    const j = await r.json();
    let text;
    if (j.encoding === 'base64' && j.content) text = b64dec(j.content);
    else {                                                               // over 1 MB the content comes separately
      const b = await gh('/git/blobs/' + j.sha);
      if (!b.ok) throw new GhError(b.status, 'GitHub answered ' + b.status);
      text = b64dec((await b.json()).content);
    }
    const doc = JSON.parse(text);
    if (!doc || !Array.isArray(doc.trades)) throw new GhError(-1, 'the synced file is not readable');
    doc.deleted = doc.deleted || {}; doc.weeks = doc.weeks || {};
    return { doc, sha: j.sha, etag: r.headers.get('ETag') };
  }

  /* Local and remote, reconciled. Pure: returns what the journal should hold. */
  function reconcile(local, doc) {
    const now = Date.now(), tomb = Object.assign({}, S.tomb);
    Object.entries(doc.deleted).forEach(([id, at]) => { if (!(tomb[id] >= at)) tomb[id] = at; });
    const L = new Map(local.map(t => [String(t.id), t])), R = new Map(doc.trades.map(t => [String(t.id), t]));
    Object.keys(S.known).forEach(id => { if (!L.has(id) && !tomb[id]) tomb[id] = now; });         // deleted here since last time
    const out = [], removed = [], revived = [];
    let incoming = 0, updated = 0;
    new Set([...L.keys(), ...R.keys()]).forEach(id => {
      const l = L.get(id), r = R.get(id), dead = tomb[id], base = S.known[id];
      if (dead) {
        if (!l) return;
        /* A trade this device has never synced is one put back on purpose (undo, or a restored backup) and
           it wins — except on a device's very first sync, where an old copy must not undo a delete made since. */
        const edited = (+l.updatedAt || 0) > dead;
        if (base === undefined ? (!S.fresh || edited) : (th(l) !== base && edited)) { delete tomb[id]; revived.push(id); out.push(l); }
        else removed.push(id);
        return;
      }
      if (l && r) {
        const hl = th(l), hr = th(r);
        if (hl === hr || hr === base) return void out.push(l);
        if (hl === base || (+r.updatedAt || 0) >= (+l.updatedAt || 0)) { out.push(Object.assign({}, clean(r))); updated++; }
        else out.push(l);
      } else if (l) out.push(l);
      else { out.push(Object.assign({}, clean(r))); incoming++; }
    });
    return { trades: out, tomb, removed, revived, incoming, updated };
  }

  /* ---------------- charts ---------------- */
  const shotPath = t => `/contents/shots/${t.id}-${t.shotRev}.jpg`;
  async function uploadShots() {
    let n = 0;
    for (const t of real().filter(t => t.shot)) {
      const id = String(t.id);
      if (!S.dirty[id] && t.shotRev !== undefined) continue;
      const blob = await getShot(id);
      if (!blob) { delete S.dirty[id]; continue; }
      const rev = S.dirty[id] || Date.now();
      setNote(`sending charts… ${++n}`);
      const r = await gh(`/contents/shots/${id}-${rev}.jpg`, { method: 'PUT', body: { message: `chart ${id} from ${DEVICE}`, content: (await blobToDataURL(blob)).split(',')[1] } });
      if (!r.ok && r.status !== 422) throw new GhError(r.status, 'a chart would not upload');   // 422: that exact file is already there
      const cur = trades.find(x => String(x.id) === id);
      if (cur) cur.shotRev = rev;
      S.have[id] = rev; delete S.dirty[id]; keep();
    }
    Object.keys(S.dirty).forEach(id => { if (!real().some(t => String(t.id) === id && t.shot)) delete S.dirty[id]; });
    return n;
  }
  async function downloadShots() {
    let n = 0;
    for (const t of real().filter(t => t.shot && t.shotRev !== undefined)) {
      const id = String(t.id);
      if (S.have[id] === t.shotRev && (checked || await getShot(id))) continue;   // once per launch, make sure the image itself is still here
      if (S.have[id] === undefined && !S.dirty[id] && await getShot(id)) { S.have[id] = t.shotRev; continue; }   // the same chart, already here from a backup
      setNote(`fetching charts… ${++n}`);
      const r = await gh(shotPath(t), { accept: 'application/vnd.github.raw+json' });
      if (!r.ok) continue;                                               // not uploaded yet — next time
      await rawPutShot(id, new Blob([await r.arrayBuffer()], { type: 'image/jpeg' }));
      const u = SHOT_URL.get(id); if (u) { URL.revokeObjectURL(u); SHOT_URL.delete(id); }
      S.have[id] = t.shotRev; keep();
    }
    checked = true; keep();
    return n;
  }

  /* ---------------- one run ---------------- */
  async function run(manual) {
    if (!S.on || !S.token) return;
    if (busy) { again = true; return; }
    busy = true; lastRun = Date.now(); setState('syncing', '');
    try {
      for (let attempt = 0; ; attempt++) {
        const got = await pull();
        /* --- no waiting between reading the journal and writing it back --- */
        if (real().length === 0 && Object.keys(S.known).length > 1) return pause('This device was emptied, so sync is paused — your other device still has everything. Turn sync on again to bring the journal back.');
        const doc = got ? got.doc : null;                                // null: the repository has not changed, only this device may have
        if (DEMO && doc && doc.trades.length) exitDemo();               // the samples make way for the real journal
        const m = reconcile(real(), doc || { trades: [], deleted: {}, weeks: {} });
        if (m.removed.length > 5 && m.removed.length > real().length / 4 && !(manual && confirm(`${m.removed.length} trades were deleted on your other device. Delete them here too?`))) {
          return setState('held', `${m.removed.length} trades were deleted on your other device. Tap “Sync now” to apply that here.`);
        }
        let weeksChanged = false;
        if (doc && !DEMO) Object.entries(doc.weeks).forEach(([wk, w]) => { if (w && (!WEEKS[wk] || (+w.updatedAt || 0) > (+WEEKS[wk].updatedAt || 0))) { WEEKS[wk] = w; weeksChanged = true; } });
        const changedHere = m.incoming || m.updated || m.removed.length || m.revived.length;
        if (changedHere || weeksChanged) {
          applying = true;
          try {
            if (!DEMO) {
              const now = Date.now();
              m.revived.forEach(id => { const t = m.trades.find(x => String(x.id) === id); if (t) t.updatedAt = now; });
              trades = m.trades;
              m.removed.forEach(id => { dropShot(id); delete S.have[id]; delete S.dirty[id]; });
              if (changedHere && !save()) throw new GhError(-1, 'this device could not store the synced trades');
              if (weeksChanged) saveWeeks();
            }
          } finally { applying = false; }
          if (!['size', 'rules'].includes(UI.view)) render(false);
        }
        const seen = new Set([...Object.keys(S.known), ...real().map(t => String(t.id))]);
        if (got) { S.sha = got.sha; S.etag = got.etag; S.docHash = got.sha ? docHash(got.doc) : null; }
        S.tomb = m.tomb; keep();

        if (DEMO) { setState('ok', ''); if (manual) toast('Sync is on — nothing to bring over yet'); return; }   // samples never leave the device

        if (await uploadShots()) { applying = true; try { save(); } finally { applying = false; } }   // keeps the chart revisions just set

        /* --- snapshot what goes up; anything deleted while charts were uploading is recorded too --- */
        const nowIds = new Set(real().map(t => String(t.id))), at = Date.now();
        seen.forEach(id => { if (!nowIds.has(id) && !S.tomb[id]) S.tomb[id] = at; });
        const snap = { format: 'htc-vault-sync', version: 1, savedAt: new Date().toISOString(), by: DEVICE,
          trades: real().map(clean).sort((a, b) => a.id - b.id), deleted: sortObj(S.tomb), weeks: sortObj(WEEKS) };
        const h = docHash(snap);
        if (h !== S.docHash) {
          const r = await gh('/contents/trades.json', { method: 'PUT', body: Object.assign({ message: `sync from ${DEVICE} — ${snap.trades.length} trades`, content: b64enc(JSON.stringify(snap)) }, S.sha ? { sha: S.sha } : {}) });
          if (r.status === 409 || r.status === 422) {                    // the other device got there first — take its changes and go again
            S.etag = null; keep();
            if (attempt < 3) continue;
            throw new GhError(r.status, 'both devices were saving at once — it will try again');
          }
          if (!r.ok) throw new GhError(r.status, 'GitHub answered ' + r.status);
          S.sha = (await r.json()).content.sha; S.etag = null; S.docHash = h;
        }
        S.known = {}; snap.trades.forEach(t => S.known[String(t.id)] = th(t));
        S.at = new Date().toISOString(); S.fresh = false; keep();

        const fetched = await downloadShots();
        if (fetched) { render(false); }
        setState('ok', '');
        const news = [m.incoming && plural(m.incoming, 'new trade'), m.updated && plural(m.updated, 'update'), m.removed.length && plural(m.removed.length, 'delete')].filter(Boolean);
        if (news.length) toast(`Synced — ${news.join(', ')} from your other device`);
        else if (manual) toast('Everything is in sync');
        return;
      }
    } catch (e) {
      if (e.status === 401) { setState('error', 'That sync key is no longer valid. Turn sync off and paste a new one.'); }
      else setState(e.status === 0 ? 'offline' : 'error', e.status === 0 ? 'No connection — it will catch up when there is one.' : explain(e));
      if (manual) toast('Sync did not go through: ' + explain(e));
    } finally {
      busy = false;
      if (again) { again = false; schedule(800); }
    }
  }
  function pause(msg) { S.on = false; S.known = {}; S.etag = null; S.docHash = null; keep(); setState('paused', msg); if (UI.view === 'data') render(false); }
  function schedule(ms) { if (!S.on) return; clearTimeout(timer); timer = setTimeout(() => run(false), ms === undefined ? 2000 : ms); }

  /* ---------------- turning it on and off ---------------- */
  async function connect() {
    const box = document.getElementById('gsKey'), tok = ((box && box.value) || S.token || '').trim();
    if (!tok) return toast('Paste your sync key first');
    setState('syncing', 'checking the key…');
    try {
      const r = await gh('', { token: tok });
      if (!r.ok) throw new GhError(r.status, 'GitHub answered ' + r.status);
    } catch (e) { setState(S.on ? 'error' : 'off', ''); return toast('Could not turn sync on: ' + explain(e)); }
    S.token = tok; S.on = true; S.fresh = true; S.etag = null; S.docHash = null; S.known = {}; keep();
    if (UI.view === 'data') render(false);
    toast('Sync is on — bringing both devices together…');
    run(true);
  }
  function disconnect() {
    if (!confirm('Turn sync off on this device? Your trades stay here, and the sync key is removed from this device.')) return;
    clearTimeout(timer);
    S = { on: false, fresh: false, token: '', sha: null, etag: null, at: null, docHash: null, known: {}, tomb: S.tomb, have: S.have, dirty: {} }; keep();
    setState('off', ''); if (UI.view === 'data') render(false);
    toast('Sync is off on this device');
  }

  /* ---------------- what the Data tab shows ---------------- */
  function setNote(n) { note = n; paint(); }
  function setState(s, n) { state = s; note = n || ''; paint(); }
  function label() {
    const when = S.at ? (() => { const s = Math.round((Date.now() - new Date(S.at)) / 1000); return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : ago(S.at); })() : 'not yet';
    return ({ syncing: ['busy', 'Syncing…', note || 'talking to your other device'], ok: ['ok', 'In sync', 'last synced ' + when], idle: ['ok', 'On', 'last synced ' + when],
      offline: ['warn', 'Waiting for a connection', 'last synced ' + when], error: ['bad', 'Sync problem', note], held: ['warn', 'Waiting for you', note],
      paused: ['warn', 'Paused', note], off: ['', 'Off', ''] })[state] || ['', 'Off', ''];
  }
  function paint() {
    const el = document.getElementById('gsState'); if (!el) return;
    const [tone, text, small] = label();
    el.className = 'gs-state ' + tone;
    el.innerHTML = `<i></i><b>${esc(text)}</b><span>${esc(small)}</span>`;
  }
  function card() {
    const [tone, text, small] = label();
    const where = 'your own private GitHub repository, <b>htc-vault-data</b>';
    if (!S.on) return `<section class="card gs-card" id="gsCard"><div class="card-h"><h2>Sync Mac and phone</h2></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:12px">
        ${state === 'paused' ? `<div class="alert warn"><div><b>Sync is paused.</b>${esc(note)}</div></div>` : ''}
        <p class="muted" style="font-size:13px">Log a trade on one and it appears on the other. Trades and charts are kept in ${where}, and each device stays up to date on its own. Use the same key on both.</p>
        <div class="row gs-row"><input class="in" id="gsKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your sync key" aria-label="Sync key" value="${esc(S.token)}">
          <button class="btn primary" type="button" onclick="GS.connect()">Turn on sync</button></div>
        <details class="gs-how"><summary>Where do I get a sync key?</summary>
          <ol><li>On github.com open <b>Settings › Developer settings › Personal access tokens › Fine-grained tokens</b> and choose <b>Generate new token</b>.</li>
          <li>Repository access: <b>Only select repositories</b> → <b>htc-vault-data</b>.</li>
          <li>Permissions › Repository permissions › <b>Contents: Read and write</b>.</li>
          <li>Generate it, copy it, and paste it here — then paste the same key on your other device.</li></ol></details>
      </div></section>`;
    return `<section class="card gs-card" id="gsCard"><div class="card-h"><h2>Sync Mac and phone</h2></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:14px">
        <div class="gs-state ${tone}" id="gsState"><i></i><b>${esc(text)}</b><span>${esc(small)}</span></div>
        <p class="muted" style="font-size:13px">Every trade, chart and weekly note on this ${DEVICE === 'Mac' ? 'Mac' : 'device'} is kept in ${where}, and changes from your other device arrive here within a minute while the app is open.</p>
        <div class="row"><button class="btn primary" type="button" onclick="GS.now()">Sync now</button><button class="btn ghost" type="button" onclick="GS.disconnect()">Turn off</button></div>
      </div></section>`;
  }

  /* ---------------- hooks: anything that changes the journal schedules a run ---------------- */
  const rawPutShot = putShot;
  putShot = async function (id, blob) { const ok = await rawPutShot(id, blob); if (!DEMO) { S.dirty[String(id)] = Date.now(); keep(); } return ok; };
  const _save = save;
  save = function () { const ok = _save.apply(this, arguments); if (ok && !applying && !DEMO) schedule(); return ok; };
  const _saveWeeks = saveWeeks;
  saveWeeks = function () { _saveWeeks.apply(this, arguments); if (!applying && !DEMO) schedule(); };
  const wake = () => { if (S.on && document.visibilityState === 'visible' && Date.now() - lastRun > 5000) run(false); };
  document.addEventListener('visibilitychange', wake);
  window.addEventListener('focus', wake);
  window.addEventListener('online', wake);
  setInterval(() => { if (S.on && document.visibilityState === 'visible' && Date.now() - lastRun > 40000) run(false); else paint(); }, 15000);
  if (S.on) setTimeout(() => run(false), 1500);

  return { connect, disconnect, card, now: () => { if (state === 'paused' || !S.on) return connect(); run(true); }, state: () => ({ state, note, on: S.on, at: S.at, known: Object.keys(S.known).length }), _run: run, _api: u => { API = u; } };
})();

</script>

<script>

/* =====================================================================
   HTC Vault on a phone — a layer over Pulse, added only by
   mobile/build-mobile.sh. The Mac app never loads this file.
   Same journal, same storage key (htc.v2), no cloud: trades live on the
   phone and move to and from the Mac as backup files.
   ===================================================================== */
const M_PHONE = matchMedia('(max-width: 720px)');
const M_STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const M_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
document.documentElement.classList.toggle('m-standalone', M_STANDALONE);

/* ---------------- dock: four tabs, the rest under More ----------------
   Nine tabs do not fit a phone. These four stay in the dock; change the
   list to change which. Reviews are files on the Mac, so the phone leaves
   that tab out. */
const M_PRIMARY = ['overview', 'journal', 'size', 'rules'];
const M_HIDDEN = ['reviews'];
const M_MORE = VIEWS.map(v => v[0]).filter(v => !M_PRIMARY.includes(v) && !M_HIDDEN.includes(v));
const M_MORE_ICON = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor"/></svg>';

function mBuildNav() {
  const nav = document.getElementById('nav');
  if (!nav || nav.querySelector('.m-morebtn')) return;
  nav.querySelectorAll('a[data-v]').forEach(a => { if (!M_PRIMARY.includes(a.dataset.v)) a.classList.add('m-extra'); });
  const b = document.createElement('a');
  b.className = 'm-morebtn'; b.href = '#'; b.setAttribute('role', 'button'); b.setAttribute('aria-haspopup', 'menu'); b.setAttribute('aria-expanded', 'false');
  b.innerHTML = M_MORE_ICON + '<span class="ns">More</span>';
  b.addEventListener('click', e => { e.preventDefault(); mMenu(); });
  nav.appendChild(b);
  const menu = document.createElement('div');
  menu.id = 'mMenu'; menu.className = 'm-menu'; menu.setAttribute('role', 'menu'); menu.hidden = true;
  menu.innerHTML = M_MORE.map((v, k) => { const [, label] = VIEWS.find(x => x[0] === v); return `<a role="menuitem" href="#/${v}" data-v="${v}" style="--k:${k}">${icon(v)}<span>${label}</span></a>`; }).join('');
  menu.addEventListener('click', () => mMenu(false));
  document.querySelector('.pu-dockwrap').appendChild(menu);
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !e.target.closest('#mMenu, .m-morebtn')) mMenu(false); });
}
function mMenu(open) {
  const menu = document.getElementById('mMenu'), b = document.querySelector('.m-morebtn');
  if (!menu) return;
  const on = open === undefined ? menu.hidden : open;
  menu.hidden = !on; b.setAttribute('aria-expanded', on);
}
/* a view kept under More lights the More button, and the highlight slides to it */
const _mRenderNav = renderNav;
renderNav = function () {
  _mRenderNav();
  mBuildNav();
  const more = document.querySelector('.m-morebtn'), inMore = M_PHONE.matches && !M_PRIMARY.includes(UI.view);
  if (more) inMore ? more.setAttribute('aria-current', 'page') : more.removeAttribute('aria-current');
  if (inMore) document.querySelectorAll('#nav a.m-extra[aria-current]').forEach(a => a.removeAttribute('aria-current'));
  document.querySelectorAll('#mMenu a').forEach(a => a.dataset.v === UI.view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  placePill();
};
M_PHONE.addEventListener('change', () => { mMenu(false); renderNav(); });
window.addEventListener('hashchange', () => mMenu(false));
window.addEventListener('scroll', () => mMenu(false), { passive: true });

/* ---------------- backup files: how trades travel between phone and Mac ----------------
   The same shape the Mac app writes to Documents › LVDHTC Backups, so a file from
   either side restores on the other. */
async function mBackupFile() {
  if (DEMO || !trades.length) return toast('Nothing to back up yet');
  toast('Building the backup…');
  let text;
  try {
    const d = JSON.parse(await buildBackup(true));
    d.weeks = WEEKS; d.theme = theme;
    text = JSON.stringify(d);
  } catch (e) { return toast('Could not build the backup'); }
  const name = `htc-vault-phone-${ymd(new Date())}.json`;
  const done = () => { LAST_BACKUP = new Date().toISOString(); LAST_BACKUP_N = trades.length; save(); if (UI.view === 'data') render(false); };
  const file = new File([text], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'HTC Vault backup' }); done(); toast(`Backup shared — ${mb(text.length)}`); }
    catch (e) { if (e && e.name !== 'AbortError') toast('The backup could not be shared'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  done(); toast(`Backup saved — ${name}`);
}

/* Restore merges, exactly as the Mac app does: it adds the trades this device is
   missing and never drops one it has. For a trade on both, the newer edit wins. */
async function mMerge(d) {
  if (!d || !Array.isArray(d.trades)) return toast('No trades found in that file');
  const wasDemo = DEMO;
  if (wasDemo) exitDemo();
  const prev = trades.map(t => Object.assign({}, t)), byId = new Map(trades.map(t => [String(t.id), t]));
  let added = 0, updated = 0, shots = 0;
  const took = new Set();
  for (const r of d.trades) {
    if (!r || r.id === undefined) continue;
    const k = String(r.id), mine = byId.get(k);
    const c = Object.assign({}, r); delete c.asset; delete c.synced;
    if (!mine) { trades.push(c); byId.set(k, c); added++; took.add(k); }
    else if ((+r.updatedAt || 0) > (+mine.updatedAt || 0)) { Object.assign(mine, c); updated++; took.add(k); }
  }
  if (!added && !updated) { if (wasDemo) { enterDemo(); render(false); } return toast('Nothing new — every trade in that file is already here'); }
  if (!save()) { trades = prev; return toast('Restore failed — nothing was changed'); }
  for (const [id, url] of Object.entries(d.shots || {})) {
    if (!took.has(String(id)) && await getShot(id)) continue;
    try { await putShot(id, dataURLtoBlob(url)); shots++; } catch (e) {}
  }
  if (d.weeks && typeof d.weeks === 'object') {
    for (const [wk, note] of Object.entries(d.weeks)) if (!WEEKS[wk]) WEEKS[wk] = note;
    saveWeeks();
  }
  SHOT_URL.forEach(u => URL.revokeObjectURL(u)); SHOT_URL.clear();
  editing = null; ED = DEFAULTS();
  render(true);
  toast(`Added ${plural(added, 'trade')}${updated ? `, updated ${updated}` : ''}${shots ? ` and ${plural(shots, 'chart')}` : ''} — ${trades.length} in total`);
}
async function mRestoreFile(file) {
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { return toast('That file is not a journal backup'); }
  return mMerge(d);
}

/* ---------------- Data — the phone's own wording ---------------- */
function mInstallNote() {
  if (M_STANDALONE) return '';
  return `<div class="alert warn"><div><b>Add HTC Vault to your Home Screen first.</b>${M_IOS
    ? 'In Safari tap Share, then “Add to Home Screen”. The Home Screen app keeps its own journal, separate from this Safari tab — so bring your trades in from there, not here.'
    : 'Use your browser’s “Install” or “Add to Home Screen”, then open it from there.'}</div></div>`;
}
vData = function () {
  const shots = trades.filter(t => t.shot).length, n = DEMO ? 0 : trades.length, stale = n - LAST_BACKUP_N;
  const tile = (ic, label, v, small, k) => `<div class="dt" style="--k:${k}"><span class="dt-i">${ic}</span><div class="label">${label}</div><div class="sv">${v}<small>${small}</small></div></div>`;
  const I = {
    phone: '<svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 18.5h3"/></svg>',
    shield: '<svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.2 3 7.6 7 9 4-1.4 7-4.8 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    disk: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6"/></svg>'
  };
  const kept = M_STANDALONE || STORAGE.persisted === true;
  const synced = typeof GS === 'object' && GS.state().on;
  const nag = DEMO || synced ? '' : !LAST_BACKUP && n ? `<div class="alert warn"><div><b>No backup file sent yet.</b>Until you send one, these trades exist only on this device.</div></div>`
    : stale > 0 ? `<div class="alert warn"><div><b>${plural(stale, 'trade')} logged since your last backup file.</b>The last one was ${ago(LAST_BACKUP)}.</div></div>` : '';
  return `
  <div class="head"><div><div class="label">Data</div><h1>Your journal, kept safe</h1>
    <p>${DEMO ? 'Sample trades are showing — nothing is stored yet.' : `${plural(n, 'trade')}${shots ? ` and ${plural(shots, 'chart')}` : ''}.`} Stored on this device${synced ? ' and kept in step with your Mac' : ' and nowhere else'}; it works with no signal.</p></div></div>
  ${mInstallNote()}
  <section class="card"><div class="card-b" style="display:flex;flex-direction:column;gap:16px">
    <div class="dtiles">
      ${tile(I.phone, 'Where it lives', 'This device', M_STANDALONE ? 'inside the Home Screen app' : 'in this browser tab', 0)}
      ${tile(I.shield, 'Kept by the system', kept ? '<span class="up">Yes</span>' : 'Not yet', kept ? 'not cleared for space' : 'add it to the Home Screen', 1)}
      ${tile(I.clock, 'Last backup file', esc(ago(LAST_BACKUP)), LAST_BACKUP ? LAST_BACKUP_N + ' trades then' : 'none sent', 2)}
      ${tile(I.disk, 'Space used', mb(STORAGE.usage), 'trades and charts', 3)}
    </div>
    ${nag}
  </div></section>
  ${typeof GS === 'object' ? GS.card() : ''}
  <div class="cols c-2">
    <section class="card"><div class="card-h"><h2>Backup file</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
      <p class="muted" style="font-size:13px">Makes one file with every trade and chart on this device — a safety copy to AirDrop to your Mac or save to Files, with or without sync.</p>
      <div class="row"><button class="btn primary" onclick="mBackupFile()">Send backup file</button><button class="btn ghost" onclick="copyOut(csv(),'CSV')">Copy CSV</button></div>
    </div></section>
    <section class="card"><div class="card-h"><h2>Bring trades in</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
      <p class="muted" style="font-size:13px">Pick a backup file — from the Mac they are in Documents › LVDHTC Backups. It adds the trades this device is missing and never removes any.</p>
      <div class="row"><button class="btn" onclick="document.getElementById('mFile').click()">Restore from file</button></div>
      <input id="mFile" type="file" accept=".json,application/json" hidden onchange="mRestoreFile(this.files[0]); this.value='';">
    </div></section>
  </div>
  <div class="cols c-2">
    <section class="card"><div class="card-h"><h2>Preferences</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:16px">
      <div class="f pref-theme"><span class="label">Theme</span>${seg([['system', 'System'], ['light', 'Light'], ['dark', 'Dark']], theme, 'setTheme', 'lg')}</div>
    </div></section>
    <section class="card"><div class="card-h"><h2>Start over</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:12px">
      <p class="muted" style="font-size:13px">Deletes every trade and chart on this device. Your Mac and any backup files are not touched${synced ? ' — sync pauses first, so nothing is deleted anywhere else' : ''}.</p>
      <div><button class="btn danger" onclick="wipe()">${icon('trash')} Delete everything</button></div>
    </div></section>
  </div>
  <p class="faint m-ver">HTC Vault for phone · build ${esc(window.LVD_MOBILE.version)}</p>`;
};

const _mSize = vSize;
vSize = function () { return _mSize().replace('Remembered on this Mac.', 'Remembered on this device.'); };

/* ---------------- a phone has no keyboard shortcuts, drag-and-drop or ⌘V ---------------- */
const M_TOUCH = matchMedia('(hover: none)').matches || navigator.maxTouchPoints > 0;
const _mJournal = vJournal;
vJournal = function () { const h = _mJournal(); return M_TOUCH ? h.replace('Search notes…  ( / )', 'Search notes…') : h; };
const _mRenderSheet = renderSheet;
renderSheet = function () {
  _mRenderSheet();
  const hint = M_TOUCH && document.querySelector('#drop b');
  if (hint && hint.nextSibling) hint.nextSibling.textContent = 'Tap to pick the screenshot from your photos.';
};

{ const skip = M_TOUCH && document.querySelector('#puSplash .sp-skip'); if (skip) skip.textContent = 'tap to skip'; }

/* ---------------- offline + a fresh look at the current view ---------------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
render(false);

</script>
